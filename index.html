<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>LimeOS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="LimeOS">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<style>
/* =====================================================================
   LIMEOS 1.0 (beta) — DESIGN SYSTEM
   Tudo centralizado em tokens (:root). Um único arquivo de propósito.
   ===================================================================== */
:root {
  /* cores */
  --lime-yellow:#D9C94A; --lime-green:#4C8C3C; --lime-soft:#E7F0C8;
  --bg-black:#000; --bg-dark:#121212; --bg-elevated:#1C1C1C;
  --text:#fff; --text-dim:#8A8A8A;
  --glass:rgba(255,255,255,.10); --glass-strong:rgba(255,255,255,.18);
  --error:#E05A4E;
  /* tipografia */
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --fs-xs:11px; --fs-sm:13px; --fs-md:15px; --fs-lg:18px; --fs-xl:24px;
  /* espaçamento / bordas / tamanhos */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px;
  --r-sm:12px; --r-md:20px; --r-lg:28px; --r-pill:999px;
  --statusbar-h:30px; --navbar-h:48px;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px); --safe-right:env(safe-area-inset-right,0px);
  /* sombras / blur */
  --shadow:0 8px 28px rgba(0,0,0,.45);
  --blur:22px; --blur-strong:34px;
  /* animação */
  --ease:cubic-bezier(.22,.61,.36,1); --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --t-fast:.18s; --t-mid:.32s; --t-slow:.5s;
  /* Liquid Jelly (valores centrais) */
  --jelly-blur:var(--blur); --jelly-return:.45s; --jelly-quick:.38s; --jelly-long:.7s;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
html,body { width:100%; height:100%; overflow:hidden; background:var(--bg-black); color:var(--text); font-family:var(--font); touch-action:none; }
button { font-family:inherit; color:inherit; border:none; background:none; cursor:pointer; }
input { font-family:inherit; user-select:text; -webkit-user-select:text; }

/* ---------- Telas ---------- */
.screen { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .35s ease; background:var(--bg-black); background-size:cover; background-position:center; }
.screen.active { opacity:1; pointer-events:auto; }

/* ---------- Liquid Jelly ---------- */
.jelly { will-change:transform; }
.jelly.jelly-quick { animation:jelly-quick var(--jelly-quick) var(--ease-spring); }
.jelly.jelly-long  { animation:jelly-long var(--jelly-long) var(--ease); }
@keyframes jelly-quick { 0%{transform:scale(1)} 25%{transform:scale(.92,1.06)} 55%{transform:scale(1.05,.96)} 100%{transform:scale(1)} }
@keyframes jelly-long  { 0%{transform:scale(1)} 20%{transform:scale(.9,1.08)} 45%{transform:scale(1.06,.94)} 70%{transform:scale(.98,1.02)} 100%{transform:scale(1)} }
.glass { background:var(--glass); backdrop-filter:blur(var(--jelly-blur)); -webkit-backdrop-filter:blur(var(--jelly-blur)); border:1px solid rgba(255,255,255,.12); }

/* ---------- BOOT (base v0.3) ---------- */
#screen-boot .boot-content { display:flex; flex-direction:column; align-items:center; gap:14px; }
.boot-title { font-size:32px; font-weight:600; letter-spacing:.5px; opacity:0; transform:translateY(8px); animation:boot-in .6s ease forwards; }
.boot-subtitle { font-size:14px; color:var(--text-dim); margin-bottom:22px; opacity:0; animation:boot-in .6s ease .25s forwards; }
.android-robot { display:flex; flex-direction:column; align-items:center; opacity:0; transform:scale(.7); animation:boot-robot .6s var(--ease-spring) .5s forwards; }
@keyframes boot-in { to { opacity:1; transform:translateY(0); } }
@keyframes boot-robot { to { opacity:1; transform:scale(1); } }
.robot-head { width:36px; height:20px; background:#78C257; border-radius:18px 18px 0 0; }
.robot-body { display:flex; align-items:center; gap:4px; }
.robot-arm { width:6px; height:26px; background:#78C257; border-radius:3px; }
.robot-torso { width:36px; height:26px; background:#78C257; }
.robot-legs { display:flex; gap:10px; margin-top:1px; }
.robot-leg { width:7px; height:12px; background:#78C257; border-radius:0 0 3px 3px; }

/* ---------- LOADING (base v0.3) ---------- */
.loading-content { position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
.lemon-wrap { position:relative; width:100%; display:flex; justify-content:center; }
.lemon { width:72px; height:90px; background:var(--lime-yellow); border-radius:50% 50% 45% 45%; position:relative; transform:translateX(0) rotate(0); }
.lemon-leaf { position:absolute; top:-14px; left:50%; transform:translateX(-50%); width:16px; height:22px; background:var(--lime-green); border-radius:0 100% 0 100%; }
.lemon.spin-move { transition:transform 1.7s cubic-bezier(.4,0,.2,1); transform:translateX(-70px) rotate(720deg); }
.lime-os-logo { position:absolute; left:50%; top:50%; transform:translate(calc(-50% + 46px),-50%); font-size:34px; font-weight:700; letter-spacing:.5px; opacity:0; transition:opacity .6s ease; }
.lime-os-logo.visible { opacity:1; }
.logo-lime { color:var(--lime-yellow); } .logo-os { color:var(--lime-green); }

/* ---------- STATUS BAR ---------- */
#statusbar { position:fixed; top:0; left:0; right:0; height:calc(var(--statusbar-h) + var(--safe-top)); padding:var(--safe-top) 14px 0; z-index:900; display:none; align-items:center; justify-content:space-between; font-size:var(--fs-sm); font-weight:500; touch-action:none; }
#statusbar.show { display:flex; }
.sb-left,.sb-right { height:100%; display:flex; align-items:center; gap:8px; }
.sb-left { flex:1; } .sb-right { flex:1; justify-content:flex-end; }
.sb-notifs { display:flex; gap:5px; }
.sb-notif { width:16px; height:16px; border-radius:50%; background:var(--glass-strong); font-size:9px; display:flex; align-items:center; justify-content:center; }
.sb-ind { display:flex; align-items:center; font-size:12px; }
.sb-ind.hidden { display:none; }
.sb-wifi { display:flex; align-items:flex-end; gap:2px; height:11px; }
.sb-wifi i { width:3px; background:var(--text); border-radius:1px; } .sb-wifi i:nth-child(1){height:4px} .sb-wifi i:nth-child(2){height:6px} .sb-wifi i:nth-child(3){height:8px} .sb-wifi i:nth-child(4){height:11px}
.sb-data { font-size:10px; font-weight:700; letter-spacing:-.5px; }
.sb-battery { display:flex; align-items:center; gap:4px; }
.sb-batt-body { position:relative; width:22px; height:11px; border:1.5px solid var(--text); border-radius:3px; padding:1px; }
.sb-batt-body::after { content:""; position:absolute; right:-4px; top:2px; width:2px; height:4px; background:var(--text); border-radius:0 1px 1px 0; }
.sb-batt-fill { height:100%; width:100%; background:var(--text); border-radius:1px; }
.sb-batt-leaf { display:none; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-size:9px; }
.sb-battery.saver .sb-batt-fill { background:var(--lime-yellow); }
.sb-battery.saver .sb-batt-leaf { display:block; }
.sb-batt-pct { font-size:11px; color:var(--text-dim); }

/* ---------- LOCK ---------- */
.lock-content { position:relative; width:100%; height:100%; }
.lock-clock { position:absolute; left:50%; top:30%; transform:translate(-50%,-50%); text-align:center; transition:transform .25s var(--ease); text-shadow:0 2px 18px rgba(0,0,0,.45); }
.lock-time { font-size:88px; font-weight:300; letter-spacing:1px; line-height:1; transform-origin:center; will-change:transform; }
.lock-date { font-size:var(--fs-md); color:rgba(255,255,255,.85); margin-top:6px; }
.lock-hint { position:absolute; bottom:calc(36px + var(--safe-bottom)); left:0; right:0; text-align:center; font-size:var(--fs-sm); color:rgba(255,255,255,.7); }
.lock-hint::before { content:""; display:block; width:36px; height:4px; border-radius:2px; background:rgba(255,255,255,.55); margin:0 auto 10px; }
.lock-zone { position:absolute; left:0; right:0; bottom:0; height:55%; }
.lock-content.dragging .lock-clock { transition:none; }

/* ---------- PIN (Material Design 3) ---------- */
#screen-pin { background:rgba(0,0,0,.55); backdrop-filter:blur(var(--blur-strong)); -webkit-backdrop-filter:blur(var(--blur-strong)); }
.pin-content { display:flex; flex-direction:column; align-items:center; gap:26px; width:100%; padding:0 20px; }
.pin-title { font-size:var(--fs-lg); font-weight:500; }
.pin-dots { display:flex; gap:16px; height:20px; align-items:center; }
.pin-dot { width:14px; height:14px; border-radius:50%; border:2px solid var(--text-dim); transition:all .22s var(--ease-spring); }
.pin-dot.filled { background:var(--lime-yellow); border-color:var(--lime-yellow); transform:scale(1.15); border-radius:40% 60% 55% 45% / 55% 45% 60% 40%; }
.pin-dot.error { background:var(--error); border-color:var(--error); }
.pin-pad { display:grid; grid-template-columns:repeat(3,72px); gap:14px; }
.pin-key { width:72px; height:72px; border-radius:var(--r-lg); font-size:26px; background:var(--glass); display:flex; align-items:center; justify-content:center; transition:background var(--t-fast), border-radius var(--t-fast); }
.pin-key:active { background:var(--glass-strong); border-radius:50%; }
.pin-key.pressed { animation:pin-press .38s var(--ease-spring); }
@keyframes pin-press { 0%{transform:scale(1)} 30%{transform:scale(.86,.9)} 65%{transform:scale(1.06)} 100%{transform:scale(1)} }
.pin-key-empty { background:transparent; pointer-events:none; }
.pin-key-del { font-size:20px; color:var(--text-dim); background:transparent; }
.pin-flyer { position:fixed; z-index:950; width:14px; height:14px; background:var(--lime-yellow); border-radius:40% 60% 55% 45% / 55% 45% 60% 40%; pointer-events:none; }
.pin-content.shake { animation:shake .4s ease; }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-10px)} 40%{transform:translateX(10px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)} }
#screen-pin .pin-bio { font-size:var(--fs-sm); color:var(--text-dim); text-align:center; min-height:16px; background:none; border:none; padding:6px; }
#screen-pin .pin-bio.pin-bio-action { color:var(--lime-yellow); font-weight:600; }
#screen-pin .pin-bio.pin-bio-action:active { opacity:.7; }

/* ---------- HOME ---------- */
#screen-home { align-items:flex-start; justify-content:center; background-color:var(--bg-black); }
.home-content { width:100%; height:100%; display:flex; flex-direction:column; padding:calc(var(--statusbar-h) + var(--safe-top) + 24px) 16px calc(var(--navbar-h) + var(--safe-bottom) + 8px); overflow-y:auto; touch-action:pan-y; }
.app-grid { flex:1; display:grid; grid-template-columns:repeat(4,1fr); grid-auto-rows:92px; gap:10px 6px; align-content:start; }

/* ---------- LimeOS 1.6: Widgets da Home ---------- */
.widget-board { position:relative; width:100%; margin-bottom:14px; display:grid; grid-template-columns:repeat(4, 1fr); grid-auto-rows:76px; gap:10px; min-height:0; }
.widget-board.wb-empty { display:none; }
.widget-board.editing { outline:1px dashed rgba(255,255,255,.18); outline-offset:8px; border-radius:var(--r-md); }
.widget-cell { position:relative; border-radius:var(--r-md); background:var(--glass); backdrop-filter:blur(var(--jelly-blur)); -webkit-backdrop-filter:blur(var(--jelly-blur)); border:1px solid rgba(255,255,255,.12); overflow:hidden; display:flex; flex-direction:column; touch-action:none; transition:box-shadow .2s; }
.widget-cell.w-dragging { z-index:40; box-shadow:0 14px 30px rgba(0,0,0,.5); opacity:.92; }
.widget-cell.w-invalid { outline:2px solid var(--error); }
.widget-cell .w-body { flex:1; min-height:0; min-width:0; padding:10px 12px; display:flex; flex-direction:column; }
.widget-cell .w-remove { position:absolute; top:4px; right:4px; width:22px; height:22px; border-radius:50%; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; font-size:13px; z-index:5; }
.widget-board.editing .widget-cell .w-remove { display:flex; }
.widget-cell .w-resize-handle { position:absolute; width:22px; height:22px; z-index:5; display:none; touch-action:none; }
.widget-board.editing .widget-cell .w-resize-handle { display:block; }
.widget-cell .w-resize-handle::after { content:""; position:absolute; width:10px; height:10px; border:2px solid var(--lime-yellow); border-radius:3px; background:rgba(0,0,0,.4); }
.w-resize-handle.rh-se { right:-6px; bottom:-6px; cursor:se-resize; }
.w-resize-handle.rh-e { right:-6px; top:50%; margin-top:-11px; cursor:e-resize; }
.w-resize-handle.rh-s { bottom:-6px; left:50%; margin-left:-11px; cursor:s-resize; }
.widget-edit-bar { position:fixed; left:0; right:0; bottom:0; z-index:920; display:none; align-items:center; justify-content:space-between; gap:8px; padding:10px calc(10px + var(--safe-left)) calc(10px + var(--safe-bottom)) calc(10px + var(--safe-right)); background:rgba(10,10,10,.85); backdrop-filter:blur(var(--blur)); -webkit-backdrop-filter:blur(var(--blur)); }
.widget-edit-bar.show { display:flex; }
.widget-edit-bar .widget-edit-title { font-size:var(--fs-sm); color:var(--text-dim); flex:1; text-align:center; }
.widget-edit-bar .btn { margin:0; }
.widget-picker { position:fixed; inset:0; z-index:940; background:rgba(0,0,0,.5); display:flex; align-items:flex-end; opacity:0; pointer-events:none; transition:opacity .25s ease; }
.widget-picker.open { opacity:1; pointer-events:auto; }
.widget-picker-sheet { width:100%; max-height:76vh; background:var(--bg-elevated); border-radius:var(--r-lg) var(--r-lg) 0 0; padding:0 0 calc(16px + var(--safe-bottom)); transform:translateY(100%); transition:transform .32s var(--ease-spring); display:flex; flex-direction:column; }
.widget-picker.open .widget-picker-sheet { transform:translateY(0); }
.widget-picker-head { display:flex; align-items:center; justify-content:space-between; padding:16px 16px 10px; font-weight:600; font-size:var(--fs-md); }
.widget-picker-list { overflow-y:auto; padding:4px 14px 10px; display:flex; flex-direction:column; gap:8px; }
.wp-item { display:flex; align-items:center; gap:12px; padding:12px; border-radius:var(--r-md); background:var(--bg-elevated); border:1px solid rgba(255,255,255,.08); text-align:left; }
.wp-item .wpi-glyph { width:40px; height:40px; border-radius:var(--r-sm); background:var(--glass); display:flex; align-items:center; justify-content:center; font-size:19px; flex-shrink:0; }
.wp-item .wpi-text { flex:1; } .wp-item .wpi-name { font-size:var(--fs-sm); font-weight:500; } .wp-item .wpi-desc { font-size:var(--fs-xs); color:var(--text-dim); margin-top:2px; }
.wp-item.disabled { opacity:.45; pointer-events:none; }
/* Conteúdos internos de widgets */
.w-clock-time { font-size:26px; font-weight:300; line-height:1; } .w-clock-date { font-size:10px; color:var(--text-dim); margin-top:2px; }
.w-date-weekday { font-size:11px; color:var(--lime-yellow); text-transform:uppercase; } .w-date-full { font-size:16px; font-weight:500; margin-top:2px; }
.w-shortcut { align-items:center; justify-content:center; text-align:center; gap:4px; }
.w-shortcut .ws-glyph { font-size:24px; } .w-shortcut .ws-name { font-size:10px; color:var(--text-dim); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.w-notes-title { font-size:var(--fs-sm); font-weight:500; margin-bottom:4px; } .w-notes-item { font-size:11px; color:rgba(255,255,255,.8); padding:3px 0; border-top:1px solid rgba(255,255,255,.07); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.w-notes-empty { font-size:11px; color:var(--text-dim); }
.w-batt-row { display:flex; align-items:center; gap:8px; } .w-batt-pct { font-size:20px; font-weight:300; } .w-batt-label { font-size:9px; color:var(--text-dim); margin-top:4px; }
.w-music-track { font-size:11px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .w-music-sub { font-size:9px; color:var(--text-dim); }
.w-music-controls { display:flex; align-items:center; justify-content:space-around; margin-top:auto; } .w-music-btn { font-size:16px; width:28px; height:28px; display:flex; align-items:center; justify-content:center; }
.w-unavail { font-size:11px; color:var(--text-dim); text-align:center; margin:auto; padding:6px; }
.app-window.in-split .widget-board { display:none; }
.app-icon { display:flex; flex-direction:column; align-items:center; gap:6px; opacity:0; transform:scale(.5) translateY(14px); position:relative; }
.app-icon.icon-in { animation:icon-pop .45s var(--ease-spring) forwards; }
@keyframes icon-pop { to { opacity:1; transform:scale(1) translateY(0); } }
.app-icon-glyph { width:58px; height:58px; display:flex; align-items:center; justify-content:center; font-size:27px; border-radius:var(--r-md); background:var(--glass); backdrop-filter:blur(var(--jelly-blur)); -webkit-backdrop-filter:blur(var(--jelly-blur)); border:1px solid rgba(255,255,255,.12); }
.app-icon-label { font-size:var(--fs-xs); text-shadow:0 1px 6px rgba(0,0,0,.7); max-width:100%; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.app-icon.dragging-icon { z-index:30; opacity:.85; transform:scale(1.12); }
.app-icon.drop-target .app-icon-glyph { outline:2px solid var(--lime-yellow); }
.dock { display:none; align-self:center; gap:14px; padding:10px 14px; border-radius:var(--r-lg); margin-top:8px; }
.dock.show { display:flex; }
.dock.side { position:absolute; right:10px; top:50%; transform:translateY(-50%); flex-direction:column; margin:0; }
.dock .app-icon { opacity:1; transform:none; } .dock .app-icon-label { display:none; }
.dock-slot { width:58px; height:58px; border-radius:var(--r-md); border:1px dashed rgba(255,255,255,.25); }

/* ---------- BARRA DE NAVEGAÇÃO (3 botões) ---------- */
#navbar { position:fixed; left:0; right:0; bottom:0; height:calc(var(--navbar-h) + var(--safe-bottom)); padding-bottom:var(--safe-bottom); z-index:880; display:none; align-items:center; justify-content:space-around; background:rgba(0,0,0,.35); backdrop-filter:blur(var(--blur)); -webkit-backdrop-filter:blur(var(--blur)); }
#navbar.wb-editing-hide { display:none !important; }
#navbar.show { display:flex; }
.nav-btn { flex:1; height:100%; display:flex; align-items:center; justify-content:center; position:relative; }
.nav-recents-lines { display:flex; gap:5px; align-items:center; height:22px; transition:opacity .2s; }
.nav-recents-lines i { width:2px; height:16px; background:var(--text); border-radius:1px; }
.nav-minis { display:none; gap:6px; align-items:center; }
.nav-btn.ctx .nav-recents-lines { display:none; } .nav-btn.ctx .nav-minis { display:flex; }
.nav-mini { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; width:24px; height:36px; padding:2px 1px; border:1.5px solid rgba(255,255,255,.55); border-radius:5px; background:var(--glass); overflow:hidden; }
.nav-mini span:first-child { font-size:11px; line-height:1; }
.nav-mini span:last-child { font-size:5.5px; line-height:1; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.nav-home-shape { width:18px; height:18px; border:2px solid var(--text); border-radius:50%; transition:all .35s var(--ease-spring); position:relative; }
.nav-btn.ctx .nav-home-shape { border-radius:3px 3px 2px 2px; width:20px; height:15px; margin-top:4px; }
.nav-btn.ctx .nav-home-shape::before { content:""; position:absolute; left:-3px; top:-10px; border-left:12px solid transparent; border-right:12px solid transparent; border-bottom:10px solid var(--text); }
.nav-home-shape.house-fix { }
.nav-back-arrow { width:12px; height:12px; border-left:2.5px solid var(--text); border-bottom:2.5px solid var(--text); transform:rotate(45deg); transition:transform .35s var(--ease-spring); }
.nav-back-arrow.kb { transform:rotate(-45deg); }

/* ---------- APP WINDOW ---------- */
.app-window { position:fixed; left:0; right:0; top:0; bottom:calc(var(--navbar-h) + var(--safe-bottom)); background:var(--bg-dark); z-index:50; display:flex; flex-direction:column; overflow:hidden; opacity:0; transform:scale(.1); pointer-events:none; border-radius:var(--r-lg); }
/* A transição real (expandir/recolher a partir do ícone de origem) é conduzida pelo AnimEngine via Web
   Animations API (anim_engine.js) — aqui .open só define o estado final, sem transition própria, para
   não concorrer com a animação WAAPI em curso. */
.app-window.open { opacity:1; transform:scale(1); pointer-events:auto; border-radius:0; }
body.anim-off .app-window { transition:none !important; }
.app-window.hidden-bg { visibility:hidden; }
.app-splash { position:absolute; inset:0; z-index:5; display:flex; align-items:center; justify-content:center; background:var(--bg-dark); transition:opacity .25s ease; }
.app-splash.hidden { opacity:0; pointer-events:none; }
.app-splash-glyph { width:76px; height:76px; display:flex; align-items:center; justify-content:center; font-size:36px; background:var(--glass); border-radius:var(--r-md); animation:splash-pop .4s var(--ease-spring) both; }
@keyframes splash-pop { from{opacity:0;transform:scale(.7)} to{opacity:1;transform:scale(1)} }
.app-body { flex:1; overflow-y:auto; padding:calc(var(--statusbar-h) + var(--safe-top) + 6px) 0 12px; touch-action:pan-y; }
.app-center { display:flex; align-items:center; justify-content:center; text-align:center; padding:32px; font-size:var(--fs-lg); color:var(--text-dim); flex-direction:column; gap:10px; }
.app-title { font-size:var(--fs-xl); font-weight:600; padding:12px 20px 14px; }

/* ---------- SETTINGS ---------- */
.set-list { padding:0 12px; display:flex; flex-direction:column; gap:2px; }
.set-row { display:flex; align-items:center; gap:14px; padding:12px; width:100%; text-align:left; border-radius:var(--r-sm); }
.set-row:active { background:var(--glass); }
.set-row-glyph { width:40px; height:40px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:19px; background:var(--bg-elevated); border-radius:var(--r-sm); }
.set-row-label { font-size:var(--fs-md); flex:1; } .set-row-sub { font-size:var(--fs-xs); color:var(--text-dim); display:block; margin-top:2px; }
.set-row-chev { color:var(--text-dim); }
.set-page { position:absolute; inset:0; z-index:3; background:var(--bg-dark); display:flex; flex-direction:column; transform:translateX(100%); transition:transform .28s var(--ease); }
.set-page.open { transform:translateX(0); }
.set-head { display:flex; align-items:center; gap:8px; padding:calc(var(--statusbar-h) + var(--safe-top) + 6px) 12px 10px; }
.set-back { width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px; }
.set-back:active { background:var(--glass); }
.set-head-title { font-size:var(--fs-xl); font-weight:600; }
.set-body { flex:1; overflow-y:auto; padding:6px 16px 20px; touch-action:pan-y; }
.card { background:var(--bg-elevated); border-radius:var(--r-md); padding:14px 16px; margin-bottom:10px; }
.card-title { font-size:var(--fs-md); margin-bottom:4px; } .card-sub { font-size:var(--fs-sm); color:var(--text-dim); line-height:1.45; }
.tag { display:inline-block; font-size:10px; padding:2px 8px; border-radius:var(--r-pill); background:var(--glass-strong); color:var(--text-dim); margin-top:6px; margin-right:4px; }
.tag.real { color:var(--lime-yellow); } .tag.sim { color:#9fc5ff; }
.toggle-row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:6px 0; }
.switch { width:46px; height:28px; border-radius:14px; background:var(--glass-strong); position:relative; transition:background var(--t-mid); flex-shrink:0; }
.switch::after { content:""; position:absolute; left:3px; top:3px; width:22px; height:22px; border-radius:50%; background:#fff; transition:transform var(--t-mid) var(--ease-spring); }
.switch.on { background:var(--lime-green); } .switch.on::after { transform:translateX(18px); }
.switch.off-disabled { opacity:.4; pointer-events:none; }
.btn { display:inline-flex; align-items:center; justify-content:center; padding:12px 18px; border-radius:var(--r-pill); background:var(--glass-strong); font-size:var(--fs-sm); margin:4px 6px 4px 0; }
.btn:active { background:rgba(255,255,255,.28); }
.btn.primary { background:var(--lime-yellow); color:#000; font-weight:600; }
.text-input { width:100%; padding:12px 14px; border-radius:var(--r-sm); border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.06); color:#fff; font-size:var(--fs-sm); margin:8px 0; }
.wp-preview { width:100%; height:170px; border-radius:var(--r-md); background:var(--bg-elevated) center/cover; display:flex; align-items:center; justify-content:center; color:var(--text-dim); font-size:var(--fs-sm); margin-bottom:10px; }
.slider { width:100%; accent-color:var(--lime-yellow); }

/* ---------- PAINÉIS (blur sobre a tela anterior) ---------- */
#panel-backdrop { position:fixed; inset:0; z-index:800; pointer-events:none; opacity:0; background:rgba(0,0,0,.35); backdrop-filter:blur(0px); -webkit-backdrop-filter:blur(0px); }
#panel-backdrop.on { pointer-events:auto; }
.panel { position:fixed; left:0; right:0; top:0; z-index:850; padding:calc(var(--statusbar-h) + var(--safe-top) + 6px) 14px 16px; transform:translateY(-105%); pointer-events:none; max-height:94%; overflow-y:auto; touch-action:pan-y; }
.panel.on { pointer-events:auto; }
.panel.settling { transition:transform .4s var(--ease); }
.panel-head { display:flex; align-items:center; justify-content:space-between; padding:6px 4px 10px; }
.panel-title { font-size:var(--fs-lg); font-weight:600; }
.notif-list { display:flex; flex-direction:column; gap:8px; }
.notif-card { padding:12px 14px; border-radius:var(--r-md); display:flex; gap:12px; align-items:flex-start; }
.notif-card.max { border-color:var(--error); background:rgba(224,90,78,.2); }
.notif-ico { width:34px; height:34px; border-radius:50%; background:var(--glass-strong); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
.notif-app { font-size:var(--fs-xs); color:var(--text-dim); } .notif-title { font-size:var(--fs-md); font-weight:500; } .notif-text { font-size:var(--fs-sm); color:rgba(255,255,255,.8); }
.notif-empty { text-align:center; color:var(--text-dim); padding:36px 0; font-size:var(--fs-sm); }
.cc-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.cc-tile { display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:var(--r-lg); text-align:left; min-height:56px; }
.cc-tile .ci { font-size:22px; width:30px; text-align:center; } .cc-tile .cl { font-size:var(--fs-sm); line-height:1.2; } .cc-tile .cs { font-size:10px; color:var(--text-dim); display:block; }
.cc-tile.on { background:var(--lime-yellow); color:#000; border-color:transparent; } .cc-tile.on .cs { color:rgba(0,0,0,.6); }
.cc-tile.unavail { opacity:.45; }
.cc-slider { grid-column:1 / -1; padding:10px 14px; border-radius:var(--r-lg); display:flex; align-items:center; gap:12px; }
.cc-slider .ci { font-size:20px; } .cc-slider input { flex:1; accent-color:var(--lime-yellow); }
.cc-note { grid-column:1 / -1; font-size:10px; color:var(--text-dim); text-align:center; padding:2px 8px; }

/* ---------- MULTITAREFA ---------- */
#screen-recents { z-index:700; background:rgba(0,0,0,.4); backdrop-filter:blur(var(--blur-strong)); -webkit-backdrop-filter:blur(var(--blur-strong)); flex-direction:column; justify-content:flex-start; }
#screen-recents:not(.active) { visibility:hidden; transition:opacity .35s ease, visibility 0s .35s; }
.rec-track { position:absolute; left:0; right:0; top:calc(var(--statusbar-h) + var(--safe-top) + 24px); bottom:calc(var(--navbar-h) + var(--safe-bottom) + 80px); touch-action:pan-y; }
.rec-card { position:absolute; left:50%; top:0; width:62%; height:100%; margin-left:-31%; border-radius:var(--r-md); background:var(--bg-elevated); box-shadow:var(--shadow); overflow:hidden; display:flex; flex-direction:column; transition:transform .38s var(--ease), opacity .3s; will-change:transform; }
.rec-card-head { display:flex; align-items:center; gap:8px; padding:10px 12px; font-size:var(--fs-sm); background:var(--glass); }
.rec-card-body { flex:1; display:flex; align-items:center; justify-content:center; font-size:56px; background:linear-gradient(160deg,#222,#161616); }
.rec-empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--text-dim); font-size:var(--fs-md); }
.rec-card-menu-btn { position:absolute; top:10px; right:10px; width:28px; height:28px; border-radius:50%; background:var(--glass-strong); display:flex; align-items:center; justify-content:center; font-size:15px; z-index:2; }
.rec-card.dragging-split { opacity:.5; }
.rec-card-ctx { position:absolute; top:44px; right:10px; background:var(--bg-elevated); border-radius:var(--r-sm); box-shadow:var(--shadow); z-index:30; overflow:hidden; min-width:170px; }
.rec-card-ctx button { display:block; width:100%; text-align:left; padding:11px 14px; font-size:var(--fs-sm); }
.rec-card-ctx button:active { background:var(--glass); }
.rec-card.rec-card-split { display:flex; flex-direction:row; gap:2px; padding:0; }
.rec-card.rec-card-split.portrait-pair { flex-direction:column; }
.rec-card.rec-card-split .rec-card-split-half { flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; }
.rec-card.rec-card-split .rec-card-head { font-size:11px; padding:7px 8px; }
.rec-card.rec-card-split .rec-card-body { font-size:30px; }

/* ---------- Tela dividida (1.4) ---------- */
.split-screen { z-index:60; flex-direction:row; align-items:stretch; justify-content:stretch; background:var(--bg-black); }
.split-screen:not(.active) { visibility:hidden; }
.split-pane { position:relative; overflow:hidden; display:flex; flex-direction:column; min-width:0; min-height:0; }
#split-pane-a { flex:0 0 50%; }
#split-pane-b { flex:1 1 auto; }
.split-screen.landscape { flex-direction:row; }
.split-screen.portrait { flex-direction:column; }
.split-divider { position:relative; flex:0 0 auto; display:flex; align-items:center; justify-content:center; background:var(--bg-black); touch-action:none; z-index:5; }
.split-screen.landscape .split-divider { width:18px; cursor:col-resize; }
.split-screen.portrait .split-divider { height:18px; cursor:row-resize; }
.split-divider-grip { background:var(--glass-strong); border-radius:var(--r-pill); }
.split-screen.landscape .split-divider-grip { width:4px; height:46px; }
.split-screen.portrait .split-divider-grip { width:46px; height:4px; }
.split-divider:active .split-divider-grip { background:var(--lime-yellow); }
.split-pane .app-window.in-split { position:absolute; inset:0; border-radius:0; }
.split-pane .app-window.in-split.open { transform:none; }

/* ---------- Adaptação por app dentro do split (1.4, item 7) ----------
   Cada app recebe regras próprias para caber bem num painel reduzido,
   em vez de um encolhimento genérico de toda a interface. ---------- */
.app-window.in-split .app-title { font-size:var(--fs-lg); padding:10px 14px 10px; }
.app-window.in-split .set-body { padding:4px 12px 16px; }

/* Calculadora: grade de teclas encolhe e o visor reduz a fonte do resultado */
.app-window.in-split .calc-wrap { padding:0 8px 8px; gap:6px; }
.app-window.in-split .calc-display { min-height:64px; padding:6px 10px 8px; }
.app-window.in-split .calc-result { font-size:28px; }
.app-window.in-split .calc-grid { min-height:0; gap:5px; }
.app-window.in-split .calc-key { font-size:15px; border-radius:var(--r-sm); }

/* Notes: lista e toolbar mais compactas */
.app-window.in-split .notes-wrap { padding:0 10px 8px; }
.app-window.in-split .notes-toolbar { margin-bottom:6px; gap:6px; }
.app-window.in-split .notes-empty { padding:28px 10px; }

/* Modules */
.app-window.in-split .modules-wrap { padding:0 10px 8px; }
.app-window.in-split .modules-empty { padding:24px 10px; }
.app-window.in-split .modules-empty .me-icon { font-size:30px; }

/* Browser: barra de endereço e botões de navegação encolhem */
.app-window.in-split .browser-bar { padding:0 6px 6px; gap:4px; }
.app-window.in-split .browser-nav-btn { width:28px; height:28px; font-size:13px; }
.app-window.in-split .browser-addr { padding:6px 8px; font-size:12px; }

/* Clock: relógio grande demais para metade da tela */
.app-window.in-split #ck-time { font-size:32px !important; }
.app-window.in-split .ck-big-time { font-size:34px !important; }
.app-window.in-split .ck-tabs { padding:0 10px 6px; }
.app-window.in-split .ck-pane { padding:0 10px 10px; }
.app-window.in-split .ck-stopwatch-time { font-size:32px; margin:10px 0; }
.app-window.in-split .ck-timer-ring { width:120px; height:120px; margin:8px auto; }
.app-window.in-split .ck-timer-remain { font-size:22px; }
.app-window.in-split .ck-round-btn { width:46px; height:46px; font-size:11px; }

/* Files / Settings / Tester / About / AppStore: usam .set-body e cards padrão,
   que já reduzem via padding acima; cards individuais ganham respiro menor */
.app-window.in-split .card, .app-window.in-split .item-card, .app-window.in-split .form-card,
.app-window.in-split .settings-row { padding:10px 12px; }
.app-window.in-split .settings-group { margin-bottom:14px; }

/* LifeOS: iframe simplesmente ocupa 100% do painel — responsivo por natureza */
.app-window.in-split .lifeos-wrap { height:100%; }

/* Arquivos: toolbar e lista mais compactas, grade reduz colunas */
.app-window.in-split .fm-toolbar { padding:0 8px 6px; }
.app-window.in-split .fm-search-row { padding:0 8px 6px; }
.app-window.in-split .fm-list.grid { grid-template-columns:repeat(2,1fr); gap:6px; }
.app-window.in-split .fm-row-ico { width:34px; height:34px; font-size:16px; }

/* Música: player e controles encolhem */
.app-window.in-split .mu-player { padding:8px 10px calc(8px + var(--safe-bottom)); }
.app-window.in-split .mu-controls { gap:14px; }
.app-window.in-split .mu-ctrl-btn.play { font-size:28px; }

/* Lime AI: bolhas e barra de entrada mais compactas */
.app-window.in-split .ai-msg { max-width:92%; font-size:12px; padding:8px 11px; }
.app-window.in-split .ai-input-bar { padding:8px 10px calc(8px + var(--safe-bottom)); }
.split-swap-btn { position:absolute; top:calc(var(--safe-top) + 10px); width:34px; height:34px; border-radius:50%; background:var(--glass-strong); backdrop-filter:blur(var(--blur)); z-index:10; font-size:15px; }
.split-swap-btn.sw-a { left:10px; }
.split-swap-btn.sw-b { right:10px; }
.split-screen.portrait .split-swap-btn.sw-a { top:calc(var(--safe-top) + 10px); }
.split-exit-btn { position:absolute; top:calc(var(--safe-top) + 10px); left:50%; transform:translateX(-50%); width:34px; height:34px; border-radius:50%; background:var(--glass-strong); backdrop-filter:blur(var(--blur)); z-index:11; font-size:14px; }

/* App Picker (escolher 2º app / trocar app no split) */
.app-picker { position:fixed; inset:0; z-index:900; background:rgba(0,0,0,.5); display:flex; align-items:flex-end; opacity:0; pointer-events:none; transition:opacity .26s ease; }
.app-picker.open { opacity:1; pointer-events:auto; }
.app-picker-sheet { width:100%; max-height:72vh; background:var(--bg-elevated); border-radius:var(--r-lg) var(--r-lg) 0 0; padding:0 0 calc(16px + var(--safe-bottom)); transform:translateY(100%); transition:transform .32s var(--ease-spring); display:flex; flex-direction:column; }
.app-picker.open .app-picker-sheet { transform:translateY(0); }
.app-picker-head { display:flex; align-items:center; justify-content:space-between; padding:16px 16px 10px; font-weight:600; font-size:var(--fs-md); }
.app-picker-grid { overflow-y:auto; padding:4px 14px 10px; display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
.app-picker-cell { display:flex; flex-direction:column; align-items:center; gap:6px; }
.app-picker-cell .ap-glyph { width:52px; height:52px; border-radius:var(--r-md); background:var(--glass); display:flex; align-items:center; justify-content:center; font-size:24px; }
.app-picker-cell .ap-label { font-size:10.5px; color:var(--text-dim); text-align:center; }
.app-picker-cell.disabled { opacity:.35; pointer-events:none; }

/* Áreas de destino (método B) */
.split-dropzones { position:fixed; inset:0; z-index:850; display:none; flex-direction:row; }
.split-dropzones.show { display:flex; }
.split-dropzones.portrait-zones { flex-direction:column; }
.split-dz { flex:1; margin:10px; border-radius:var(--r-lg); border:2px dashed var(--glass-strong); display:flex; align-items:center; justify-content:center; transition:background .15s,border-color .15s; }
.split-dz.dz-hover { background:rgba(217,201,74,.18); border-color:var(--lime-yellow); }
.rec-bottom { position:absolute; left:0; right:0; bottom:calc(var(--navbar-h) + var(--safe-bottom) + 18px); display:flex; justify-content:center; }
.pill { padding:12px 26px; border-radius:var(--r-pill); font-size:var(--fs-sm); }

/* ---------- TOAST / TESTER ---------- */
#toast { position:fixed; left:50%; bottom:calc(var(--navbar-h) + var(--safe-bottom) + 24px); transform:translateX(-50%); z-index:990; padding:11px 18px; border-radius:var(--r-pill); font-size:var(--fs-sm); background:rgba(30,30,30,.92); opacity:0; pointer-events:none; transition:opacity .25s; max-width:88%; text-align:center; }
#toast.show { opacity:1; }
.tester-sec { margin-bottom:16px; } .tester-sec h3 { font-size:var(--fs-sm); color:var(--lime-yellow); margin:6px 0 6px; font-weight:600; }
.cap-row { display:flex; justify-content:space-between; font-size:var(--fs-sm); padding:5px 0; border-bottom:1px solid rgba(255,255,255,.06); }
.cap-yes { color:var(--lime-yellow); } .cap-no { color:var(--text-dim); }
@media (prefers-reduced-motion:reduce) { .jelly,.app-window,.panel { animation:none!important; transition-duration:.01s!important; } }
body.reduce-motion *,body.reduce-motion *::before { animation-duration:.01s!important; transition-duration:.01s!important; }
body.high-contrast { --glass:rgba(255,255,255,.22); --text-dim:#c8c8c8; }
/* ---------- LimeOS 1.1.1: relógio da Lock Screen ---------- */
#screen-lock.default-bg, .pv-screen.default-bg { background:radial-gradient(120% 70% at 78% 10%, rgba(140,190,70,.34) 0%, rgba(40,85,30,.28) 42%, rgba(0,0,0,0) 100%), linear-gradient(180deg,#0b140a 0%,#000 100%); }
.lock-clock { white-space:nowrap; }
.pv-wrap { display:flex; flex-direction:column; align-items:center; gap:10px; margin:6px 0 14px; }
.pv-screen { position:relative; overflow:hidden; border-radius:26px; border:2px solid rgba(255,255,255,.18); background:#000 center/cover; touch-action:none; }
.pv-clock { position:absolute; transform:translate(-50%,-50%); text-align:center; white-space:nowrap; cursor:grab; padding:2px 4px; border-radius:6px; outline:1px dashed transparent; text-shadow:0 1px 8px rgba(0,0,0,.5); touch-action:none; }
.pv-clock.drag { cursor:grabbing; outline-color:rgba(255,255,255,.35); }
.pv-clock.conflict { outline:1.5px dashed var(--lime-yellow); }
.pv-time { font-weight:300; letter-spacing:1px; line-height:1; } .pv-date { color:rgba(255,255,255,.85); margin-top:2px; }

.pv-clock { padding:2px 4px; }
.pv-screen .pv-ring { position:absolute; transform:translate(-50%,-50%) scale(.92); border:1.5px solid rgba(255,255,255,.75); border-radius:50%; opacity:0; pointer-events:none; transition:opacity .18s ease, transform .18s ease; }
.pv-screen .pv-ring.on { opacity:1; transform:translate(-50%,-50%) scale(1); }
.pv-leaf { position:absolute; transform:translate(-50%,-50%) scale(.6); width:26px; height:26px; padding:0; display:flex; align-items:center; justify-content:center; border-radius:50%; background:rgba(0,0,0,.45); opacity:0; pointer-events:none; transition:opacity .18s ease, transform .18s ease; touch-action:none; cursor:ns-resize; }
.pv-leaf.on { opacity:1; pointer-events:auto; transform:translate(-50%,-50%) scale(1); }
.pv-leaf.drag { transform:translate(-50%,-50%) scale(1.15); }
.pv-tip { position:absolute; left:10px; right:10px; bottom:34px; padding:6px 8px; border-radius:10px; background:rgba(0,0,0,.6); color:#fff; font-size:9px; line-height:1.3; text-align:center; transition:opacity .3s; pointer-events:none; }
.pv-tip.off { opacity:0; }
.pv-panel { margin:4px auto 0; max-width:320px; padding:12px; border-radius:var(--r-lg,18px); background:rgba(255,255,255,.06); }
.pv-lab { font-size:12px; color:rgba(255,255,255,.65); margin:6px 0 6px; } .pv-lab:first-child { margin-top:0; }
.pv-chips, .pv-cols, .pv-pal { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.pv-chip, .pv-col { display:flex; align-items:center; gap:6px; padding:8px 12px; border-radius:999px; background:rgba(255,255,255,.08); font-size:13px; }
.pv-chip.on, .pv-col.open { background:rgba(214,242,74,.22); box-shadow:inset 0 0 0 1.5px var(--lime-yellow); }
.pv-chip-s { font-size:18px; line-height:1; color:var(--lime-yellow); }
.pv-sw { width:18px; height:18px; border-radius:50%; display:inline-block; border:1.5px solid rgba(255,255,255,.5); }
.pv-sw.big { width:30px; height:30px; padding:0; } .pv-sw.big.on { box-shadow:0 0 0 2px #000, 0 0 0 4px #fff; }
.pv-pal { margin-top:10px; } .pv-pick { width:34px; height:30px; border:0; padding:0; background:none; }
.pv-small { font-size:11px; color:rgba(255,255,255,.55); margin-top:8px; line-height:1.4; }
/* ---------- LimeOS 1.2 ---------- */
body.font-comfort { --font:'LimeComfort',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
#reading-overlay { position:fixed; inset:0; z-index:995; pointer-events:none; background:rgba(255,186,70,.16); mix-blend-mode:multiply; display:none; }
body.reading-mode #reading-overlay { display:block; }
/* AOD */
#screen-aod { background:#000; }
.aod-clock { text-align:center; } .aod-time { font-size:64px; font-weight:300; color:#fff; letter-spacing:1px; } .aod-date { font-size:var(--fs-sm); color:rgba(255,255,255,.55); margin-top:4px; }
/* Lock style: Filme */
.lock-content.style-filme .lock-clock { left:50%; top:38%; }
.lock-content.style-filme .lock-time { font-size:116px; font-weight:700; color:rgba(255,255,255,.88); text-shadow:0 4px 30px rgba(0,0,0,.55); letter-spacing:0; }
.lock-content.style-filme .lock-date { font-size:var(--fs-md); color:rgba(255,255,255,.7); }
.film-widgets { position:absolute; left:0; right:0; bottom:calc(120px + var(--safe-bottom)); display:flex; justify-content:center; gap:10px; padding:0 20px; }
.film-widget { display:flex; align-items:center; gap:8px; padding:10px 16px; border-radius:var(--r-pill); background:rgba(255,255,255,.14); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); color:#fff; font-size:var(--fs-sm); }
.film-widget .fw-i { font-size:16px; }
.film-widget .fw-sub { font-size:10px; color:rgba(255,255,255,.65); display:block; }
/* Modos */
.mode-card { display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:var(--r-md); background:var(--bg-elevated); margin-bottom:8px; }
.mode-card .mc-g { font-size:22px; width:34px; text-align:center; } .mode-card .mc-n { flex:1; font-size:var(--fs-md); } .mode-card .mc-s { font-size:var(--fs-xs); color:var(--text-dim); display:block; margin-top:2px; }
.mode-card.active { outline:1.5px solid var(--lime-yellow); }
.mode-apps-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin:10px 0; }
.mode-app-chip { display:flex; align-items:center; gap:8px; padding:10px; border-radius:var(--r-sm); background:var(--bg-elevated); }
.mode-app-chip.blocked { background:rgba(224,90,78,.18); }
.cc-tile.mode-tile .cl { font-size:var(--fs-sm); }

/* ---------- LimeOS 1.3: App Store + 5 novos apps ---------- */
/* Lime Calculator */
.calc-wrap { display:flex; flex-direction:column; height:100%; padding:0 12px 12px; gap:10px; }
.calc-display { flex:0 0 auto; min-height:92px; display:flex; flex-direction:column; justify-content:flex-end; align-items:flex-end; padding:8px 14px 10px; border-radius:var(--r-md); background:var(--bg-elevated); }
.calc-expr { font-size:var(--fs-sm); color:var(--text-dim); min-height:16px; word-break:break-all; text-align:right; max-width:100%; }
.calc-result { font-size:40px; font-weight:300; word-break:break-all; text-align:right; max-width:100%; line-height:1.1; }
.calc-grid { flex:1; display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(5,1fr); gap:8px; min-height:320px; }
.calc-key { border-radius:var(--r-md); background:var(--glass); display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:500; }
.calc-key:active { background:var(--glass-strong); }
.calc-key.op { background:rgba(214,242,74,.18); color:var(--lime-yellow); }
.calc-key.fn { color:var(--text-dim); }
.calc-key.eq { background:var(--lime-yellow); color:#000; font-weight:700; }
.calc-key.wide { grid-column:span 2; }

/* Lime Notes */
.notes-wrap { padding:0 14px 12px; display:flex; flex-direction:column; height:100%; }
.notes-toolbar { display:flex; gap:8px; align-items:center; margin-bottom:10px; }
.notes-search { flex:1; }
.notes-list { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px; }
.note-card { padding:12px 14px; border-radius:var(--r-md); background:var(--bg-elevated); text-align:left; display:flex; flex-direction:column; gap:2px; }
.note-card .nc-title { font-size:var(--fs-md); font-weight:600; }

/* =====================================================================
   LIMEOS 1.7 — Lime Camera + Lime Gallery + Editor
   ===================================================================== */
.cam-wrap { position:relative; width:100%; height:100%; background:#000; overflow:hidden; display:flex; flex-direction:column; }

.cam-grid-overlay::after { background: linear-gradient(to bottom, transparent calc(33.33% - .5px), rgba(255,255,255,.4) calc(33.33% - .5px), rgba(255,255,255,.4) calc(33.33% + .5px), transparent calc(33.33% + .5px), transparent calc(66.66% - .5px), rgba(255,255,255,.4) calc(66.66% - .5px), rgba(255,255,255,.4) calc(66.66% + .5px), transparent calc(66.66% + .5px)); }
.cam-top-bar { position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:center; padding:10px 12px; z-index:5; background:linear-gradient(rgba(0,0,0,.55), transparent); }

#lock p{color:rgba(255,255,255,0.75); margin:0 0 28px; font-size:14px;}
.pin-dots{display:flex; gap:14px; margin-bottom:24px;}
.pin-dot{width:16px; height:16px; border-radius:50%; border:2px solid rgba(255,255,255,0.5); transition:.15s;}
.pin-dot.filled{background:var(--amarelo); border-color:var(--amarelo);}
.pin-dot.pop{ animation:pinDotPop .32s cubic-bezier(.34,1.6,.5,1); }
@keyframes pinDotPop{
  0%{ transform:scale(1); }
  40%{ transform:scale(1.55) translateY(-4px); }
  100%{ transform:scale(1) translateY(0); }
}
.pin-pad{display:grid; grid-template-columns:repeat(3,66px); gap:20px;}
.pin-key{
  width:66px; height:66px; border-radius:50%;
  background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.18);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.25), inset 0 -6px 12px rgba(0,0,0,0.12), 0 6px 16px rgba(0,0,0,0.18);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  color:#fff; font-size:23px; font-weight:600; font-family:'Sora',sans-serif; letter-spacing:.3px;
  display:flex; align-items:center; justify-content:center;
  transition:.12s;
}
.pin-key:active{transform:scale(0.92); background:rgba(255,255,255,0.22);}
.pin-key.wide{background:transparent; border-color:transparent; box-shadow:none; backdrop-filter:none; font-size:14px; color:rgba(255,255,255,0.7);}
#lock-error{color:var(--amarelo); font-size:13px; height:18px; margin-bottom:6px;}
#lock-msg{font-size:13px; color:rgba(255,255,255,0.85); margin-bottom:10px; min-height:16px;}

/* ---------- HOME ---------- */
#home{
  position:absolute; inset:0; overflow-y:auto; padding:28px 20px 100px;
}
.home-header{margin-bottom:18px;}
.home-header .greeting{font-size:13px; color:var(--text-soft); font-weight:500;}
.home-header h1{font-size:30px; margin:2px 0 0; letter-spacing:-0.5px;}

.pill-home{
  background:linear-gradient(145deg,var(--verde-escuro), var(--verde));
  border-radius:var(--radius-lg);
  padding:22px 22px 20px;
  color:#fff; margin-bottom:22px;
  box-shadow:var(--shadow);
}
.pill-home .label{
  display:inline-flex; align-items:center; gap:6px;
  background:rgba(255,214,10,0.18); color:var(--amarelo);
  font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
  padding:5px 12px; border-radius:999px; margin-bottom:12px;
}
.pill-home h2{font-size:19px; margin:0 0 12px;}
.brief-toggle{display:flex; gap:8px; margin-bottom:12px;}
.brief-tab{
  flex:1; padding:8px 10px; border-radius:999px; font-size:12.5px; font-weight:700;
  background:rgba(255,255,255,0.1); color:rgba(255,255,255,0.75);
}
.brief-tab.active{background:var(--amarelo); color:var(--verde-escuro);}
#brief-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
#brief-list li{
  display:flex; align-items:flex-start; gap:8px;
  font-size:13.5px; line-height:1.4; color:rgba(255,255,255,0.92);
  background:rgba(255,255,255,0.08); padding:9px 12px; border-radius:18px;
}
#brief-list li .dot{color:var(--amarelo); margin-top:1px;}
.brief-empty{color:rgba(255,255,255,0.6); font-size:13px;}

.module-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.module-card{
  background:var(--bg-card); border-radius:var(--radius-md); border:1px solid var(--border);
  padding:18px 16px; text-align:left; box-shadow:var(--shadow);
  display:flex; flex-direction:column; gap:10px; min-height:108px;
  transition:transform .15s ease;
}
.module-card:active{transform:scale(0.96);}
.module-card .icon{
  width:42px; height:42px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-size:19px;
}
.module-card .title{font-size:14.5px; font-weight:700;}
.module-card .sub{font-size:11.5px; color:var(--text-soft);}

/* ---------- v6.0: CASCATA DE ENTRADA DA HOME (pós-desbloqueio) ---------- */
@keyframes homeCascadeIn{
  from{ opacity:0; transform:translateY(34px) scale(0.82); }
  to{ opacity:1; transform:translateY(0) scale(1); }
}
.home-cascade-item{
  opacity:0;
  animation:homeCascadeIn .7s cubic-bezier(.22,1,.36,1) forwards;
  animation-delay:calc(var(--cascade-delay, 0) * 1ms);
}

/* ---------- v3.6: MODO REORGANIZAR (jiggle + drag) ---------- */
@keyframes jiggle{
  0%{transform:rotate(-1deg);}
  50%{transform:rotate(1deg);}
  100%{transform:rotate(-1deg);}
}
.module-grid.rearrange-mode .module-card{
  animation:jiggle .26s ease-in-out infinite;
  animation-delay:calc(var(--jiggle-delay, 0) * 1ms);
}
.module-grid.rearrange-mode .module-card.wide{ animation-name:jiggle; }
.module-card.dragging{
  animation:none !important; opacity:0.55; transform:scale(1.06) !important;
  box-shadow:0 16px 40px rgba(0,0,0,0.25); z-index:50; position:relative;
}
.module-card.drop-target{ outline:2px dashed var(--verde-claro); outline-offset:2px; }
#rearrange-bar{
  position:fixed; left:0; right:0; bottom:0; z-index:400;
  padding:14px 20px calc(18px + env(safe-area-inset-bottom));
  background:var(--bg-card); border-top:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  transform:translateY(110%); transition:transform .3s cubic-bezier(.22,.85,.28,1);
}
#rearrange-bar.open{ transform:translateY(0); }
#rearrange-bar span{ font-size:13px; color:var(--text-soft); }
#rearrange-bar button{
  background:var(--verde-escuro); color:#fff; font-weight:700; font-size:13.5px;
  padding:10px 22px; border-radius:999px;
}

/* ---------- v4.0: TAB BAR INFERIOR (Fora da Home / Home / Configurações) ---------- */
#tab-bar{
  position:fixed; left:50%; bottom:calc(16px + env(safe-area-inset-bottom));
  transform:translateX(-50%);
  z-index:250;
  display:flex; align-items:center; gap:6px;
  padding:8px; border-radius:999px;
  background:rgba(20,20,20,0.35);
  backdrop-filter:blur(18px) saturate(1.4); -webkit-backdrop-filter:blur(18px) saturate(1.4);
  border:1px solid rgba(255,255,255,0.12);
  box-shadow:0 10px 30px rgba(0,0,0,0.25);
}
body.panel-open #tab-bar{ display:none; } /* hidden while a module panel is open */

/* ---------- v5.0: SAVE INDICATOR ---------- */
#save-indicator{
  position:fixed; top:calc(10px + env(safe-area-inset-top)); left:50%;
  transform:translateX(-50%) translateY(-140%);
  z-index:260;
  font-size:11.5px; font-weight:600; letter-spacing:.2px;
  padding:6px 14px; border-radius:999px;
  background:rgba(20,20,20,0.55);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  color:rgba(255,255,255,0.7);
  opacity:0;
  transition:transform .3s cubic-bezier(.22,.8,.28,1), opacity .3s ease, color .3s ease, background .3s ease;
  pointer-events:none;
  white-space:nowrap;
}
#save-indicator.saving, #save-indicator.saved{
  transform:translateX(-50%) translateY(0);
  opacity:1;
}
#save-indicator.saved{
  color:#fff;
  background:rgba(27,67,50,0.75); /* verde-escuro tint, so "saved" reads as a positive confirmation */
}
body.panel-open #save-indicator{ display:none; } /* don't compete with a module's own header */
#tab-pill{
  position:absolute; top:8px; left:0;
  width:52px; height:44px; border-radius:999px;
  background:rgba(255,255,255,0.16);
  transition:transform .75s cubic-bezier(.4,0,.2,1);
  pointer-events:none;
}
.tab-btn{
  position:relative; z-index:1;
  width:52px; height:44px; border-radius:999px;
  display:flex; align-items:center; justify-content:center;
  font-size:20px; color:rgba(255,255,255,0.55);
  transition:color .2s ease, transform .15s ease;
}
.tab-btn:active{ transform:scale(0.9); }
.tab-btn.active{ color:#fff; }
#screens{ position:relative; width:100%; height:100%; overflow:hidden; }
.app-screen{
  position:absolute; inset:0;
  transition:transform .3s cubic-bezier(.22,.8,.28,1);
  overflow-y:auto; padding:28px 20px 100px;
}
.app-screen.dragging{ transition:none; }
.app-screen > *{ will-change:auto; }
.elastic-content{ transition:transform .35s cubic-bezier(.34,1.3,.4,1); }
.elastic-content.pulling{ transition:none; }

.icon-habitos{background:#E9F5EC; color:var(--verde);}
.icon-config{background:#EFEFF4; color:#5B5B6B;}
.icon-metas{background:#FFF6D9; color:var(--amarelo-escuro);}
.icon-agenda{background:#E7F0FF; color:#3B6FD6;}
.icon-tarefas{background:#E9F5EC; color:var(--verde-escuro);}

[data-theme="dark"] .icon-config{background:rgba(150,150,170,0.2);}
[data-theme="dark"] .icon-metas{background:rgba(244,161,0,0.2);}
[data-theme="dark"] .icon-agenda{background:rgba(59,111,214,0.22);}
[data-theme="dark"] .icon-tarefas{background:rgba(45,106,79,0.25);}
[data-theme="dark"] .icon-aulas{background:rgba(194,74,52,0.25);}

.streak-widget{
  position:relative; overflow:hidden;
  border-radius:var(--radius-lg); padding:18px 20px; margin-bottom:18px;

}
.streak-bg{
  position:absolute; inset:0; opacity:0.5; pointer-events:none;

             radial-gradient(circle at 15% 90%, rgba(116,198,157,0.3), transparent 55%);
}
.streak-flame{ position:relative; flex-shrink:0; width:52px; height:52px; display:flex; align-items:center; justify-content:center; }
.streak-flame svg{ width:44px; height:44px; filter:drop-shadow(0 4px 8px rgba(0,0,0,0.18)); }
.streak-info{ position:relative; }

.section-label{font-size:12px; font-weight:700; color:var(--text-soft); text-transform:uppercase; letter-spacing:.6px; margin:26px 0 12px;}

/* bottom nav (outside home) */
#bottom-nav{
  position:absolute; left:0; right:0; bottom:0; z-index:80;
  display:flex; justify-content:space-around; align-items:center;
  background:var(--bg-card); border-top:1px solid var(--border);
  padding:10px 8px calc(10px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 20px rgba(0,0,0,0.06);
}
.nav-btn{display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px; color:var(--text-soft); padding:4px 10px; border-radius:18px;}

/* ---------- MODULE PANELS (morph target) ---------- */
.panel{
  position:fixed; inset:0; z-index:300;
  background:var(--bg);
  display:none; flex-direction:column;
  transform:scale(0.3); opacity:0;
  overflow:hidden;
}
.panel.active{display:flex;}
.panel-header{
  display:flex; align-items:center; gap:12px;
  padding:20px 18px 14px; border-bottom:1px solid var(--border);
  background:var(--bg-card); flex-shrink:0;
}
.back-btn{
  width:38px; height:38px; border-radius:50%; background:var(--bg);
  display:flex; align-items:center; justify-content:center; font-size:18px;
  border:1px solid var(--border);
}
.back-btn:active{transform:scale(0.9);}
.panel-header h2{font-size:18px; margin:0; flex:1;}
.panel-body{flex:1; overflow-y:auto; padding:18px; padding-bottom:40px;}

/* form elements */
.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--text-soft); margin-bottom:6px;}
.field input, .field textarea, .field select{
  width:100%; padding:11px 14px; border-radius:20px; border:1px solid var(--border);
  background:var(--bg-card); color:var(--text); font-size:14px;
}
.field textarea{resize:vertical; min-height:64px;}
.btn-primary{
  background:var(--verde); color:#fff; padding:12px 20px; border-radius:999px;
  font-weight:700; font-size:14px; width:100%; text-align:center; margin-top:4px;
}
.btn-primary:active{transform:scale(0.98);}
.btn-secondary{
  background:transparent; color:var(--verde); border:1.5px solid var(--verde);
  padding:10px 18px; border-radius:999px; font-weight:600; font-size:13px;
}
.form-card{background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-md); padding:16px; margin-bottom:18px; box-shadow:var(--shadow);}

.item-card{

  padding:14px 16px; margin-bottom:10px; box-shadow:var(--shadow);

.boxy-box{

  background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-md);
  box-shadow:var(--shadow); transition:transform .15s ease;

  margin-top:8px; font-weight:700; font-size:12.5px;

}

.boxy-paper{

  border-left:4px solid var(--amarelo-escuro); border-radius:var(--radius-sm);

.item-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}

.empty-state{text-align:center; padding:40px 20px; color:var(--text-soft);}

.empty-state p{font-size:13.5px; margin:0;}

.progress-track{height:9px; border-radius:999px; background:var(--border); overflow:hidden; margin-top:8px;}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--verde),var(--verde-claro)); border-radius:999px; transition:width .3s ease;}

.settings-row{

.ai-msg.bot{background:var(--bg-card); border:1px solid var(--border); border-bottom-left-radius:4px;}
.ai-msg.user{background:var(--verde); color:#fff; margin-left:auto; border-bottom-right-radius:4px;}

.fab{

  background:var(--amarelo); color:var(--verde-escuro); font-size:26px; box-shadow:0 8px 20px rgba(244,161,0,0.4);
  display:flex; align-items:center; justify-content:center; z-index:10;
}
.fab:active{transform:scale(0.92);}

::-webkit-scrollbar{width:0px;}
.toast{

  background:var(--verde-escuro); color:#fff; padding:11px 20px; border-radius:999px;
  font-size:13px; font-weight:600; z-index:900; opacity:0; pointer-events:none; transition:.25s;
}
.toast.show{opacity:1; bottom:34px;}

/* ================== AURORA BACKGROUND (otimizado) + LIQUID GLASS ==================
   Antes: animava "background-position" no <body> inteiro, o que forçava o navegador
   a recalcular e repintar 4 gradientes a cada frame, pesado até nas telas ligadas.
   Agora: o fundo vive num ::before fixo, maior que a tela, e a animação mexe só o
   "transform" dele — isso roda na GPU (thread de composição), sem repintura. */
body{ background:var(--bg); position:relative; }
body::before{
  content:'';
  position:fixed;
  top:-15%; left:-15%; width:130%; height:130%;
  background:
    radial-gradient(circle at 12% 18%, rgba(255,214,10,0.40), transparent 46%),
    radial-gradient(circle at 88% 12%, rgba(116,198,157,0.40), transparent 50%),
    radial-gradient(circle at 25% 85%, rgba(214,214,220,0.55), transparent 52%),
    radial-gradient(circle at 82% 78%, rgba(244,161,0,0.28), transparent 48%);
  animation:auroraShift 30s ease-in-out infinite alternate;
  will-change:transform;
  transform:translateZ(0);
  pointer-events:none;
  z-index:0;
}
#app{ position:relative; z-index:1; }
@keyframes auroraShift{
  0%{ transform:translate3d(0,0,0); }
  100%{ transform:translate3d(-4%,4%,0); }
}
body.panel-open::before{ animation-play-state:paused; }
[data-theme="dark"] body::before{
  background:
    radial-gradient(circle at 12% 18%, rgba(255,214,10,0.10), transparent 46%),
    radial-gradient(circle at 88% 12%, rgba(82,183,136,0.14), transparent 50%),
    radial-gradient(circle at 25% 85%, rgba(160,160,170,0.07), transparent 52%),
    radial-gradient(circle at 82% 78%, rgba(244,161,0,0.10), transparent 48%);
}
.panel{ background:var(--bg); }

@keyframes tierFlash{
  0%{opacity:1;} 70%{opacity:0.7;} 100%{opacity:0;}
}
@keyframes confettiFall{
  0%{ transform:translateY(0) rotate(0deg); opacity:1; }
  100%{ transform:translateY(100vh) rotate(360deg); opacity:0.3; }
}

/* tema extra: pôr do sol */

  --verde-escuro:#7C2D12;
  --verde:#C2410C;
  --verde-claro:#FDBA74;
  --amarelo:#FBBF24;
  --amarelo-escuro:#EA580C;
  --branco:#FFFFFF;
  --bg:#FFF7ED;
  --bg-card:#FFFFFF;
  --text:#431407;
  --text-soft:#9A6A52;
  --border:rgba(124,45,18,0.12);
  --shadow:0 8px 30px rgba(124,45,18,0.12);
}
[data-theme="sunset"] body::before{

/* modo economia: desliga blur e animações pesadas, mantém tudo funcional */
body.eco-mode::before{ display:none; }
body.eco-mode *{
  backdrop-filter:none !important; -webkit-backdrop-filter:none !important;
  animation-duration:0.001s !important; transition-duration:0.1s !important;
}
body.eco-mode .module-card, body.eco-mode .back-btn, body.eco-mode .icon-btn, body.eco-mode .fab, body.eco-mode .btn-secondary, body.eco-mode .switch{
  background:var(--bg-card) !important;
}
.module-card{
  background:rgba(255,255,255,0.38) !important;
  backdrop-filter:blur(8px) saturate(150%);
  -webkit-backdrop-filter:blur(8px) saturate(150%);
  border:1px solid rgba(255,255,255,0.55) !important;
  box-shadow:0 8px 28px rgba(31,52,42,0.10), inset 0 1px 0 rgba(255,255,255,0.55) !important;
}
[data-theme="dark"] .module-card{
  background:rgba(18,32,25,0.45) !important;
  border-color:rgba(255,255,255,0.08) !important;
  box-shadow:0 8px 28px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.05) !important;
}

/* Pet (Alfa) — só o Steve. Sem animação contínua: tudo dispara só quando você toca ou cria algo, e some sozinho. */
#pets-layer{ position:fixed; inset:0; pointer-events:none; z-index:310; }
.pixel-pet{
  position:absolute; pointer-events:auto; cursor:grab; touch-action:none;
}
.pixel-pet:active{ cursor:grabbing; }
.pixel-pet-sprite{ position:absolute; top:0; left:0; pointer-events:none; image-rendering:pixelated; overflow:hidden; }
.pixel-pet.jumping{ animation:petJump .4s ease; }
@keyframes petJump{
  0%{ transform:translateY(0); }
  40%{ transform:translateY(-14px); }
  100%{ transform:translateY(0); }
}
/* rabinho: gira suavemente seguindo a inércia do arrasto (ver JS: attachPetDrag) */
.pixel-pet-tail{
  position:absolute; pointer-events:none; image-rendering:pixelated;
  transform-origin:top left;
  transition:transform .35s cubic-bezier(.22,1,.36,1);
}
/* reação na telinha: coração ou setinhas ⏩, some sozinho */
.pet-react-overlay{ position:absolute; top:0; left:0; pointer-events:none; image-rendering:pixelated; display:none; }
.pet-react-overlay.show{ display:block; }

.item-card, .form-card, .settings-row, .panel-header, #bottom-nav, .ai-msg.bot, .ai-input-bar input{
  background:var(--bg-card);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
}

/* botões: vidro líquido leve (blur baixo, elementos pequenos = barato) + reação gelatinosa */
.back-btn, .icon-btn{
  background:rgba(255,255,255,0.4) !important;
  backdrop-filter:blur(5px) saturate(140%);
  -webkit-backdrop-filter:blur(5px) saturate(140%);
  border:1px solid rgba(255,255,255,0.5) !important;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1), border-radius .18s ease;
}
[data-theme="dark"] .back-btn, [data-theme="dark"] .icon-btn{
  background:rgba(255,255,255,0.08) !important; border-color:rgba(255,255,255,0.12) !important;
}
.back-btn:active{
  transform:scale(0.8) rotate(-6deg);
  border-radius:40% 60% 55% 45%/50% 45% 55% 50%;
}
.fab{
  background:rgba(255,214,10,0.75) !important;
  backdrop-filter:blur(6px) saturate(140%);
  -webkit-backdrop-filter:blur(6px) saturate(140%);
  border:1px solid rgba(255,255,255,0.5) !important;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1), border-radius .18s ease;
}
.fab:active{ transform:scale(0.88) rotate(4deg); border-radius:45% 55% 40% 60%/55% 40% 60% 45%; }

.btn-secondary{
  background:rgba(255,255,255,0.4) !important;
  backdrop-filter:blur(5px) saturate(140%);
  -webkit-backdrop-filter:blur(5px) saturate(140%);
  border:1.5px solid var(--verde) !important;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1);
}
[data-theme="dark"] .btn-secondary{ background:rgba(255,255,255,0.06) !important; }
.btn-secondary:active{ transform:scale(0.94); }

.switch{
  background:rgba(120,140,130,0.28) !important;
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  transition:background .2s ease;
}
.switch.on{ background:var(--verde) !important; }

.history-toggle{
  display:inline-flex; align-items:center; gap:6px;
  background:rgba(255,255,255,0.4); backdrop-filter:blur(6px) saturate(140%); -webkit-backdrop-filter:blur(6px) saturate(140%);
  border:1px solid rgba(255,255,255,0.55); border-radius:999px;
  padding:9px 16px; font-size:12.5px; font-weight:700; color:var(--verde-escuro);
  margin-bottom:12px; transition:transform .15s cubic-bezier(.34,1.56,.64,1);
}
[data-theme="dark"] .history-toggle{ background:rgba(255,255,255,0.08); color:var(--verde-claro); }
.history-toggle:active{ transform:scale(0.95); }

/* resizable widgets: hold a card to toggle 1x1 <-> 2x1 */
.module-card.wide{ grid-column:span 2; flex-direction:row; align-items:center; gap:14px; }
.module-card.wide .icon{ flex-shrink:0; }
.module-card.wide .title{ font-size:15px; }

/* liquid glass pull-down search */
#search-toggle-btn{
  position:absolute; top:calc(14px + env(safe-area-inset-top)); right:18px; z-index:210;
  width:38px; height:38px; border-radius:50%;
  background:rgba(255,255,255,0.45); backdrop-filter:blur(8px) saturate(140%);
  border:1px solid rgba(255,255,255,0.55); box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:center; font-size:15px;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1);
}
#search-toggle-btn:active{ transform:scale(0.85) rotate(-8deg); }
[data-theme="dark"] #search-toggle-btn{ background:rgba(255,255,255,0.08); border-color:rgba(255,255,255,0.12); }

#search-bar{
  position:absolute; top:0; left:0; right:0; z-index:200;
  padding:calc(16px + env(safe-area-inset-top)) 16px 18px;
  transform:translateY(-115%);
  transition:transform .4s cubic-bezier(.22,.85,.28,1);
  background:var(--bg-card);
  border-bottom:1px solid var(--border);
  max-height:80vh; overflow-y:auto;
  pointer-events:none;
}
#search-bar.open{
  transform:translateY(0);
  pointer-events:auto;
  background:rgba(244,247,245,0.6);
  backdrop-filter:blur(14px) saturate(150%);
  -webkit-backdrop-filter:blur(14px) saturate(150%);
}
[data-theme="dark"] #search-bar.open{ background:rgba(10,19,14,0.75); }
#search-handle{
  position:absolute; top:8px; left:50%; transform:translateX(-50%);
  width:44px; height:5px; border-radius:999px; background:rgba(90,110,100,0.35);
}
#search-input{
  width:100%; padding:13px 18px; border-radius:999px; border:1px solid rgba(255,255,255,0.55);
  background:rgba(255,255,255,0.55); backdrop-filter:blur(6px); font-size:14.5px; margin-top:10px;
}
[data-theme="dark"] #search-input{ background:rgba(255,255,255,0.08); border-color:rgba(255,255,255,0.12); color:#EAF3EE; }
@keyframes jellyWiggle{
  0%{transform:scale(1,1);}
  35%{transform:scale(1.025,0.96);}
  65%{transform:scale(0.985,1.02);}
  100%{transform:scale(1,1);}
}
#search-input.wiggle{ animation:jellyWiggle .3s ease; }
#search-results{ margin-top:12px; }

/* ---------- v3.6: SPLASH SCREEN ---------- */
#splash{
  position:fixed; inset:0; z-index:900;
  background:linear-gradient(160deg,var(--verde-escuro), var(--verde));
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  overflow:hidden;
}
#splash-icon-wrap{
  position:relative; width:96px; height:96px;
  display:flex; align-items:center; justify-content:center;
}
#splash-icon{
  width:96px; height:96px; border-radius:26px;
  background:var(--amarelo);
  display:flex; align-items:center; justify-content:center;
  font-size:44px; box-shadow:0 14px 40px rgba(0,0,0,0.3);
  animation:splashShake 0.32s ease-in-out infinite;
}
@keyframes splashShake{
  0%{transform:rotate(0deg);}
  25%{transform:rotate(-3deg);}
  75%{transform:rotate(3deg);}
  100%{transform:rotate(0deg);}
}
#splash-pop-layer{
  position:absolute; left:50%; top:50%; width:0; height:0;
  pointer-events:none;
}
.splash-pop{
  position:absolute; left:0; top:0;
  transform:translate(-50%,0);
  opacity:0;
  font-size:22px;
  white-space:nowrap;
  animation:splashPopUp 1.2s cubic-bezier(.34,1.2,.4,1) forwards;
}
.splash-pop.is-text{
  font-family:'Sora',sans-serif; font-weight:800; font-size:15px; color:#fff;
  letter-spacing:-0.2px; white-space:nowrap;
}
/* Settled text: pops up once and stays parked until told to retract */
.splash-pop.is-settled{
  animation:none;
  transform:translate(-50%,0) scale(0.4);
  transition:transform .6s cubic-bezier(.34,1.15,.4,1), opacity .5s ease;
}
.splash-pop.is-settled.show{
  opacity:1;
  transform:translate(-50%, var(--pop-y)) scale(1);
}
@keyframes splashPopUp{
  0%{ opacity:0; transform:translate(calc(-50% + var(--pop-x, 0px)*0.15), 0) scale(0.4); }
  18%{ opacity:1; transform:translate(calc(-50% + var(--pop-x, 0px)), var(--pop-y)) scale(1.06); }
  30%{ transform:translate(calc(-50% + var(--pop-x, 0px)), var(--pop-y)) scale(1); }
  75%{ opacity:1; transform:translate(calc(-50% + var(--pop-x, 0px)), var(--pop-y)) scale(1); }
  100%{ opacity:0; transform:translate(calc(-50% + var(--pop-x, 0px)*0.15), 0) scale(0.5); }
}
#splash-progress{
  margin-top:34px; width:120px; height:3px; border-radius:99px;
  background:rgba(255,255,255,0.2); overflow:hidden;
}
#splash-progress-fill{
  height:100%; width:0%; background:var(--amarelo); border-radius:99px;
  transition:width .25s linear;
}
</style>

async function sha256(text){
  const enc=new TextEncoder().encode(text);
  const buf=await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function renderPinDots(){
  const dots=document.getElementById('pin-dots');

  for(let i=0;i<4;i++){
    const d=document.createElement('div');
    d.className='pin-dot'+(i<pinBuffer.length?' filled':'');

function renderPinPad(){
  const pad=document.getElementById('pin-pad');

  keys.forEach(k=>{
    const b=document.createElement('button');
    b.className='pin-key'+(k===''?' wide':'');
    b.textContent=k;
    if(k!=='') b.onclick=()=>pinPress(k);
    pad.appendChild(b);
  });
}
async function pinPress(k){
  if(navigator.vibrate) navigator.vibrate(10); // tap feedback for every key, including backspace
  if(k==='⌫'){ pinBuffer=pinBuffer.slice(0,-1); renderPinDots(); return; }
  if(pinBuffer.length>=4) return;
  pinBuffer+=k;
  renderPinDots();
  if(pinBuffer.length===4){
    if(pinMode==='create'){
      if(!firstPin){
        firstPin=pinBuffer;
        pinBuffer='';
        document.getElementById('lock-sub').textContent='Confirme seu PIN';
        renderPinDots();
      } else {
        if(firstPin===pinBuffer){
          DB.pinHash = await sha256(pinBuffer);
          saveDB();
          unlockApp();
        } else {
          document.getElementById('lock-error').textContent='Os PINs não coincidem. Tente de novo.';
          firstPin=''; pinBuffer='';
          document.getElementById('lock-sub').textContent='Crie um PIN de 4 dígitos para proteger seu app';
          renderPinDots();
        }
      }
    } else {
      const hash = await sha256(pinBuffer);
      if(hash===DB.pinHash){
        document.getElementById('lock-error').textContent='';
        unlockApp();
      } else {
        document.getElementById('lock-error').textContent='PIN incorreto.';
        pinBuffer='';
        renderPinDots();
      }
    }
  }
}

/* ---------- v6.0: animação de entrada da Home ao desbloquear ---------- */
function playHomeCascadeIn(){
  const CASCADE_STEP_MS = 110; // intervalo entre cada elemento
  const items = [];

  const header = document.getElementById('home-header');
  if(header) items.push(header);

  const streak = document.getElementById('streak-widget');
  if(streak) items.push(streak);

  const brief = document.getElementById('daily-brief-pill');
  if(brief) items.push(brief);

  const cards = document.querySelectorAll('#home .module-grid .module-card[data-mid]');
  cards.forEach(c=>items.push(c));

  // reseta todos primeiro (sem animação), depois força reflow em cada um
  // individualmente, e só então dispara a entrada — evita que o navegador
  // "funda" a remoção e a re-adição da classe num único frame e ignore a animação
  items.forEach(el=>{
    el.style.animation = 'none';
    el.classList.remove('home-cascade-item');
    void el.offsetHeight; // reflow por elemento, garante reset real do estado de animação
  });

  items.forEach((el, i)=>{
    el.style.removeProperty('animation');
    el.style.setProperty('--cascade-delay', i * CASCADE_STEP_MS);
    el.classList.add('home-cascade-item');
  });

  // limpa a classe depois que a última animação termina, pra não interferir
  // em outras transições (drag-and-drop, tap scale, etc.)
  const totalMs = items.length * CASCADE_STEP_MS + 700 + 50;
  clearTimeout(window._cascadeCleanupTimer);
  window._cascadeCleanupTimer = setTimeout(()=>{
    items.forEach(el=>{
      el.classList.remove('home-cascade-item');
      el.style.removeProperty('--cascade-delay');
      el.style.opacity='';
    });
  }, totalMs);
}

/* ---------------- v3.6: SPLASH SCREEN ---------------- */
function runSplash(){
  const layer = document.getElementById('splash-pop-layer');
  const fill = document.getElementById('splash-progress-fill');
  const splash = document.getElementById('splash');
  const TOTAL_DURATION = 7000;

  // Vibração inicial pra sinalizar o início da splash
  if(navigator.vibrate) navigator.vibrate([15, 40, 15]);

  // 1) "Sua vida em um lugar" pops out once, settles horizontally above the icon, and stays put.
  const textEl = document.createElement('div');
  textEl.className = 'splash-pop is-text is-settled';
  textEl.textContent = 'Sua vida em um lugar';
  textEl.style.setProperty('--pop-y', '-98px');
  textEl.style.left = '50%';
  layer.appendChild(textEl);
  setTimeout(()=> textEl.classList.add('show'), 30);

  // 2) Emojis keep popping out in a loop, each one always from the same fixed spot,
  //    around the icon but never on top of the text or too close to the icon.
  //    IMPORTANT: the repeat interval must be >= the pop's full lifetime (animation + removal),
  //    otherwise a new copy spawns on top of the still-fading old one and they visually clash —
  //    that's what caused the "sometimes shows, sometimes doesn't" flicker.
  const POP_LIFETIME = 1200; // matches the splashPopUp animation duration above
  const slots = [
    {emoji:'📚', x:-104, y:-30},
    {emoji:'✏️', x:104,  y:-30},
    {emoji:'🎓', x:-124, y:20},
    {emoji:'📝', x:124,  y:20},
    {emoji:'🧠', x:-96,  y:66},
    {emoji:'📖', x:96,   y:66},
  ];
  let emojiTimers = [];
  let stopped = false;
  function popEmoji(slot){
    const el = document.createElement('div');
    el.className = 'splash-pop';
    el.textContent = slot.emoji;
    el.style.setProperty('--pop-y', slot.y+'px');
    el.style.setProperty('--pop-x', slot.x+'px');
    layer.appendChild(el);
    if(navigator.vibrate) navigator.vibrate(6); // tiny tick per emoji pop
    setTimeout(()=> el.remove(), POP_LIFETIME);
  }
  function scheduleLoop(slot, delay){
    emojiTimers.push(setTimeout(function tick(){
      if(stopped) return;
      popEmoji(slot);
      emojiTimers.push(setTimeout(tick, POP_LIFETIME + 120)); // small gap so the old copy is fully gone first
    }, delay));
  }
  slots.forEach((slot,i)=> scheduleLoop(slot, 300 + i*160));

  // fake-but-honest progress bar tied to real background init work
  let pct = 0;
  const progressTimer = setInterval(()=>{
    pct = Math.min(96, pct + Math.random()*10);
    fill.style.width = pct+'%';
  }, 260);

  // Real lightweight background prep while the animation plays —
  // nothing here is allowed to block: just data prep for a snappier first paint.
  const bgWork = new Promise(resolve=>{
    requestAnimationFrame(()=>{
      try{
        precomputeHomeData();
      }catch(e){ /* never let splash prep crash the app */ }
      resolve();
    });
  });

  const minDuration = new Promise(resolve=>setTimeout(resolve, TOTAL_DURATION));

  Promise.all([bgWork, minDuration]).then(()=>{
    stopped = true;
    clearInterval(progressTimer);
    emojiTimers.forEach(clearTimeout);
    fill.style.width='100%';
    textEl.classList.remove('show'); // suck the text back into the icon
    setTimeout(()=>{
      splash.style.transition='opacity .35s ease';
      splash.style.opacity='0';
      setTimeout(()=>{ splash.style.display='none'; }, 360);
    }, 400);
  });
}
