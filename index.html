/* =====================================================================
   LIMEOS 1.5 — Lime Relógio: hora, alarmes, cronômetro, temporizador e
   relógio mundial, todos reais e funcionais dentro das limitações
   honestas do ambiente (sem alarme nativo de SO, sem push garantido).
   ===================================================================== */
const Clock15 = {
  tab: 'now', nowTimer: null, swTimer: null, timerTimer: null,
  alarms: [], sw: { running: false, startedAt: 0, elapsed: 0, laps: [] }, tmr: { running: false, remainMs: 0, totalMs: 0, endsAt: 0 },
  worldCities: [],

  load() {
    this.alarms = Storage.get('clock.alarms', []);
    this.sw = Storage.get('clock.sw', { running: false, startedAt: 0, elapsed: 0, laps: [] });
    if (this.sw.running) { this.sw.elapsed = Date.now() - this.sw.startedAt; } // recalcula ao reabrir, sem perder tempo
    this.worldCities = Storage.get('clock.world', []);
  },
  saveAlarms() { Storage.set('clock.alarms', this.alarms); },
  saveSw() { Storage.set('clock.sw', this.sw); },
  saveWorld() { Storage.set('clock.world', this.worldCities); },

  build(body) {
    this.load();
    body.innerHTML = `<div class="app-title" style="padding-bottom:0">Relógio</div>
      <div class="ck-tabs" id="ck-tabs">
        ${[['now', 'Hora'], ['alarm', 'Alarmes'], ['sw', 'Cronômetro'], ['timer', 'Temporizador'], ['world', 'Mundial']].map(([k, n]) => `<button class="ck-tab${this.tab === k ? ' active' : ''}" data-tab="${k}">${n}</button>`).join('')}
      </div>
      <div class="ck-pane" id="ck-pane"></div>`;
    this.pane = body.querySelector('#ck-pane');
    body.querySelector('#ck-tabs').addEventListener('click', (e) => { const b = e.target.closest('[data-tab]'); if (!b) return; this.tab = b.dataset.tab; body.querySelectorAll('.ck-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === this.tab)); this.renderTab(); });
    this.renderTab();
  },
  onClose() { clearInterval(this.nowTimer); clearInterval(this.swTimer); clearInterval(this.timerTimer); this.saveSw(); },
  onShow() { this.renderTab(); }, // reabertura: evita duplicar intervalos e re-renderiza a hora atual sem precisar fechar/reabrir

  renderTab() {
    clearInterval(this.nowTimer); clearInterval(this.swTimer); clearInterval(this.timerTimer);
    if (this.tab === 'now') this.renderNow();
    else if (this.tab === 'alarm') this.renderAlarms();
    else if (this.tab === 'sw') this.renderStopwatch();
    else if (this.tab === 'timer') this.renderTimer();
    else if (this.tab === 'world') this.renderWorld();
  },

  renderNow() {
    this.pane.innerHTML = `<div class="card" style="text-align:center"><div class="ck-big-time" id="ck-time"></div><div class="card-sub" id="ck-date"></div></div>`;
    const tick = () => {
      const t = $('ck-time'); if (!t) { clearInterval(this.nowTimer); return; } // app foi fechado — não deixa intervalo fantasma
      const d = new Date(); t.textContent = d.toLocaleTimeString('pt-BR', { hour12: !State.v.hour24 }); $('ck-date').textContent = d.toLocaleDateString('pt-BR', { dateStyle: 'full' });
    };
    tick(); this.nowTimer = setInterval(tick, 1000);
  },

  renderAlarms() {
    this.pane.innerHTML = `<button class="btn primary jelly" style="width:100%;margin-bottom:12px" id="ck-add-alarm">+ Novo alarme</button><div id="ck-alarm-list"></div>
      <div class="pv-small" style="margin-top:10px">Alarmes internos da LimeOS: disparam apenas enquanto este app estiver aberto no navegador (em primeiro ou segundo plano, com a aba ativa). Não é um alarme nativo do Android — fechar a aba ou o navegador cancela o disparo.</div>`;
    $('ck-add-alarm').addEventListener('click', () => this.promptAlarm());
    this.paintAlarms();
    this.armAlarmWatcher();
  },
  paintAlarms() {
    const list = $('ck-alarm-list'); if (!list) return; list.innerHTML = '';
    if (!this.alarms.length) { list.innerHTML = '<div class="card-sub" style="text-align:center;padding:20px 0">Nenhum alarme criado ainda.</div>'; return; }
    const DOW = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'];
    this.alarms.slice().sort((a, b) => a.time.localeCompare(b.time)).forEach(a => {
      const row = el(`<div class="ck-alarm-row${a.enabled ? '' : ' disabled'}" data-id="${a.id}">
        <div class="ck-alarm-time">${a.time}</div>
        <div class="ck-alarm-main"><div>${a.label || 'Alarme'}</div><div class="ck-alarm-days">${a.days && a.days.length ? a.days.map(d => DOW[d]).join(' ') : 'Uma vez'}</div></div>
        <div class="switch ${a.enabled ? 'on' : ''}" data-sw></div>
      </div>`);
      row.querySelector('[data-sw]').addEventListener('click', (e) => { e.stopPropagation(); a.enabled = !a.enabled; this.saveAlarms(); this.paintAlarms(); });
      row.addEventListener('click', (e) => { if (e.target.closest('[data-sw]')) return; this.promptAlarm(a); });
      row.addEventListener('contextmenu', (e) => e.preventDefault());
      list.appendChild(row);
      const del = el('<button class="btn jelly" style="margin:-6px 0 8px;color:var(--error)">Excluir este alarme</button>');
      del.addEventListener('click', () => { this.alarms = this.alarms.filter(x => x.id !== a.id); this.saveAlarms(); this.paintAlarms(); });
      list.appendChild(del);
    });
  },
  promptAlarm(existing) {
    const DOW = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
    const days = new Set(existing && existing.days || []);
    const bd = FM.modal(existing ? 'Editar alarme' : 'Novo alarme', `
      <input class="text-input" id="ck-al-time" type="time" value="${existing ? existing.time : '07:00'}">
      <input class="text-input" id="ck-al-label" placeholder="Nome (opcional)" value="${existing ? (existing.label || '') : ''}">
      <div style="display:flex;flex-wrap:wrap;justify-content:center;margin:4px 0 8px">${DOW.map((d, i) => `<span class="ck-day-chip${days.has(i) ? ' on' : ''}" data-day="${i}">${d[0]}</span>`).join('')}</div>
    `, [
      { label: 'Cancelar', onClick: (m) => m.remove() },
      { label: existing ? 'Salvar' : 'Criar', primary: true, onClick: (m) => {
          const time = m.querySelector('#ck-al-time').value; if (!time) { Core.toast('Defina um horário válido.'); return; }
          const label = m.querySelector('#ck-al-label').value.trim();
          const data = { id: existing ? existing.id : FileStore.uid(), time, label, days: [...days], enabled: true, firedAt: null };
          if (existing) this.alarms = this.alarms.map(a => a.id === existing.id ? data : a); else this.alarms.push(data);
          this.saveAlarms(); m.remove(); this.paintAlarms(); this.armAlarmWatcher();
        } }
    ]);
    bd.querySelectorAll('.ck-day-chip').forEach(c => c.addEventListener('click', () => { const d = +c.dataset.day; days.has(d) ? days.delete(d) : days.add(d); c.classList.toggle('on'); }));
  },
  armAlarmWatcher() {
    clearInterval(this._alWatch);
    this._alWatch = setInterval(() => {
      const now = new Date(); const hhmm = now.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', hour12: false });
      const todayKey = now.toDateString();
      this.alarms.forEach(a => {
        if (!a.enabled || a.time !== hhmm) return;
        if (a.days && a.days.length && !a.days.includes(now.getDay())) return;
        if (a.firedAt === todayKey) return; // já disparou hoje
        a.firedAt = todayKey; this.saveAlarms();
        Notif.push({ app: 'Relógio', appId: 'clock', glyph: '⏰', title: a.label || 'Alarme', text: `Alarme das ${a.time}`, max: true });
        if (!(a.days && a.days.length)) a.enabled = false; // alarme de uma vez só se desativa após disparar
        this.saveAlarms(); if (this.tab === 'alarm') this.paintAlarms();
      });
    }, 1000);
  },

  renderStopwatch() {
    this.pane.innerHTML = `<div class="ck-stopwatch-time" id="ck-sw-time">00:00.0</div>
      <div class="ck-btn-row">
        <button class="ck-round-btn jelly" id="ck-sw-lap">Marca</button>
        <button class="ck-round-btn primary jelly" id="ck-sw-startstop">${this.sw.running ? 'Pausar' : 'Iniciar'}</button>
        <button class="ck-round-btn jelly" id="ck-sw-reset">Zerar</button>
      </div>
      <div class="ck-stopwatch-laps" id="ck-sw-laps"></div>`;
    const timeEl = $('ck-sw-time');
    const fmt = (ms) => { const m = Math.floor(ms / 60000), s = Math.floor((ms % 60000) / 1000), d = Math.floor((ms % 1000) / 100); return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${d}`; };
    const paintLaps = () => { const l = $('ck-sw-laps'); l.innerHTML = this.sw.laps.slice().reverse().map((t, i) => `<div class="ck-lap-row"><span>Marca ${this.sw.laps.length - i}</span><span>${fmt(t)}</span></div>`).join(''); };
    const tick = () => { if (!$('ck-sw-time')) { clearInterval(this.swTimer); return; } const cur = this.sw.running ? Date.now() - this.sw.startedAt : this.sw.elapsed; timeEl.textContent = fmt(cur); };
    tick(); paintLaps();
    if (this.sw.running) this.swTimer = setInterval(tick, 100);
    $('ck-sw-startstop').addEventListener('click', () => {
      if (this.sw.running) { this.sw.elapsed = Date.now() - this.sw.startedAt; this.sw.running = false; clearInterval(this.swTimer); }
      else { this.sw.startedAt = Date.now() - this.sw.elapsed; this.sw.running = true; this.swTimer = setInterval(tick, 100); }
      this.saveSw(); this.renderStopwatch();
    });
    $('ck-sw-lap').addEventListener('click', () => { if (!this.sw.running) return; this.sw.laps.push(Date.now() - this.sw.startedAt); this.saveSw(); paintLaps(); });
    $('ck-sw-reset').addEventListener('click', () => {
      if (this.sw.running || this.sw.elapsed > 0) {
        const bd = FM.modal('Zerar cronômetro?', '<div class="card-sub">O tempo e as marcas serão perdidos.</div>', [
          { label: 'Cancelar', onClick: (m) => m.remove() },
          { label: 'Zerar', primary: true, onClick: (m) => { m.remove(); clearInterval(this.swTimer); this.sw = { running: false, startedAt: 0, elapsed: 0, laps: [] }; this.saveSw(); this.renderStopwatch(); } }
        ]);
      }
    });
  },

  renderTimer() {
    const running = this.tmr.running;
    this.pane.innerHTML = `
      <div class="ck-timer-ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="6"/><circle id="ck-tmr-arc" cx="50" cy="50" r="44" fill="none" stroke="var(--lime-yellow)" stroke-width="6" stroke-dasharray="276" stroke-dashoffset="0" stroke-linecap="round"/></svg><div class="ck-timer-remain" id="ck-tmr-remain">00:00</div></div>
      ${running ? '' : `<div style="display:flex;gap:8px;justify-content:center;margin-bottom:10px"><input class="text-input" id="ck-tmr-min" type="number" min="0" max="180" placeholder="min" style="width:70px;text-align:center"><input class="text-input" id="ck-tmr-sec" type="number" min="0" max="59" placeholder="seg" style="width:70px;text-align:center"></div>`}
      <div class="ck-btn-row">
        <button class="ck-round-btn primary jelly" id="ck-tmr-start">${running ? (this.tmr.paused ? 'Retomar' : 'Pausar') : 'Iniciar'}</button>
        <button class="ck-round-btn stop jelly" id="ck-tmr-cancel">Cancelar</button>
      </div>`;
    const remainEl = $('ck-tmr-remain'), arc = $('ck-tmr-arc');
    const fmt = (ms) => { const s = Math.ceil(ms / 1000); return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
    const paint = () => {
      if (!$('ck-tmr-remain')) { clearInterval(this.timerTimer); return; }
      const remain = this.tmr.paused ? this.tmr.remainMs : Math.max(0, this.tmr.endsAt - Date.now());
      remainEl.textContent = fmt(remain);
      const pct = this.tmr.totalMs ? remain / this.tmr.totalMs : 0; arc.style.strokeDashoffset = String(276 * (1 - pct));
      if (!this.tmr.paused && remain <= 0 && this.tmr.running) { this.tmr.running = false; clearInterval(this.timerTimer); Notif.push({ app: 'Relógio', appId: 'clock', glyph: '⏱️', title: 'Temporizador concluído', text: 'O tempo definido chegou ao fim.', max: true }); this.renderTimer(); }
    };
    paint(); if (running && !this.tmr.paused) this.timerTimer = setInterval(paint, 250);
    $('ck-tmr-start').addEventListener('click', () => {
      if (!this.tmr.running) {
        const min = +($('ck-tmr-min') ? $('ck-tmr-min').value : 0) || 0, sec = +($('ck-tmr-sec') ? $('ck-tmr-sec').value : 0) || 0;
        const totalMs = (min * 60 + sec) * 1000; if (totalMs <= 0) { Core.toast('Defina uma duração válida maior que zero.'); return; }
        this.tmr = { running: true, paused: false, totalMs, remainMs: totalMs, endsAt: Date.now() + totalMs };
      } else if (this.tmr.paused) { this.tmr.endsAt = Date.now() + this.tmr.remainMs; this.tmr.paused = false; this.timerTimer = setInterval(paint, 250); }
      else { this.tmr.remainMs = Math.max(0, this.tmr.endsAt - Date.now()); this.tmr.paused = true; clearInterval(this.timerTimer); }
      this.renderTimer();
    });
    $('ck-tmr-cancel').addEventListener('click', () => { clearInterval(this.timerTimer); this.tmr = { running: false, remainMs: 0, totalMs: 0, endsAt: 0 }; this.renderTimer(); });
  },

  renderWorld() {
    this.pane.innerHTML = `<button class="btn primary jelly" style="width:100%;margin-bottom:12px" id="ck-add-world">+ Adicionar fuso</button><div id="ck-world-list"></div>`;
    $('ck-add-world').addEventListener('click', () => this.promptWorld());
    this.paintWorld();
    this._wTick = setInterval(() => { if ($('ck-world-list')) this.paintWorld(); else clearInterval(this._wTick); }, 10000);
  },
  paintWorld() {
    const list = $('ck-world-list'); if (!list) return; list.innerHTML = '';
    if (!this.worldCities.length) { list.innerHTML = '<div class="card-sub" style="text-align:center;padding:20px 0">Nenhum fuso adicionado ainda.</div>'; return; }
    this.worldCities.forEach(tz => {
      try {
        const now = new Date(); const time = now.toLocaleTimeString('pt-BR', { timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: !State.v.hour24 });
        const date = now.toLocaleDateString('pt-BR', { timeZone: tz, day: '2-digit', month: 'short' });
        const row = el(`<div class="ck-world-row"><div><div class="ck-world-city">${tz.split('/').pop().replace(/_/g, ' ')}</div><div class="ck-world-sub">${tz} · ${date}</div></div><div class="ck-world-time">${time}</div></div>`);
        row.addEventListener('click', () => { const bd = FM.modal('Remover fuso?', `<div class="card-sub">${tz}</div>`, [{ label: 'Cancelar', onClick: (m) => m.remove() }, { label: 'Remover', primary: true, onClick: (m) => { this.worldCities = this.worldCities.filter(t => t !== tz); this.saveWorld(); m.remove(); this.paintWorld(); } }]); });
        list.appendChild(row);
      } catch (e) {}
    });
  },
  promptWorld() {
    let zones = [];
    try { zones = Intl.supportedValuesOf('timeZone'); } catch (e) { zones = ['America/Sao_Paulo', 'America/New_York', 'Europe/London', 'Europe/Lisbon', 'Asia/Tokyo', 'Asia/Shanghai', 'Australia/Sydney']; }
    const bd = FM.modal('Adicionar fuso horário', `<input class="text-input" id="ck-wz-search" placeholder="Buscar cidade/fuso…"><div id="ck-wz-list" style="max-height:240px;overflow-y:auto"></div>`, [{ label: 'Fechar', onClick: (m) => m.remove() }]);
    const listEl = bd.querySelector('#ck-wz-list');
    const paint = (q) => {
      const filtered = (q ? zones.filter(z => z.toLowerCase().includes(q.toLowerCase())) : zones).slice(0, 60);
      listEl.innerHTML = ''; filtered.forEach(z => { const b = el(`<button class="btn jelly" style="display:block;width:100%;text-align:left;margin:4px 0">${z.replace(/_/g, ' ')}</button>`); b.addEventListener('click', () => { if (!this.worldCities.includes(z)) { this.worldCities.push(z); this.saveWorld(); } bd.remove(); this.paintWorld(); }); listEl.appendChild(b); });
    };
    paint(''); bd.querySelector('#ck-wz-search').addEventListener('input', (e) => paint(e.target.value));
  }
};
Apps.clock = Clock15;

/* =====================================================================
   LIMEOS 1.5 — Lime Música: player real de áudio, compartilhando o
   armazenamento com Lime Arquivos (FileStore). Toca Blobs importados
   pelo próprio app ou pelo Arquivos, sem inventar metadados.
   ===================================================================== */
const Music15 = {
  queue: [], current: -1, audio: null,
  build(body) {
    body.innerHTML = `<div class="mu-wrap">
      <div class="app-title" style="padding-bottom:4px;display:flex;align-items:center;justify-content:space-between">
        <span>Música</span><button class="fm-icon-btn jelly" id="mu-add" aria-label="Importar música">⬆️</button>
      </div>
      <div class="mu-list" id="mu-list"></div>
      <div class="mu-player" id="mu-player" style="display:none"></div>
    </div>`;
    if (!this.audio) { this.audio = new Audio(); this.bindAudioEvents(); }
    body.querySelector('#mu-add').addEventListener('click', () => this.importAudio());
    this.list = body.querySelector('#mu-list'); this.playerEl = body.querySelector('#mu-player');
    this.loadQueue();
  },
  onShow() { this.loadQueue(); this.paintPlayer(); },
  onClose() { /* a reprodução continua em segundo plano dentro do app aberto; o <audio> persiste no objeto Music15 */ },

  bindAudioEvents() {
    this.audio.addEventListener('timeupdate', () => this.paintProgress());
    this.audio.addEventListener('ended', () => this.next());
    this.audio.addEventListener('error', () => { if (this.current >= 0) Core.toast('Erro ao reproduzir "' + (this.queue[this.current] && this.queue[this.current].name) + '" — formato pode não ser suportado.'); });
    this.audio.addEventListener('loadstart', () => this.setLoading(true));
    this.audio.addEventListener('canplay', () => this.setLoading(false));
  },
  setLoading(v) { const t = document.querySelector('.mu-player-sub[data-loading]'); if (t) t.textContent = v ? 'Carregando…' : ''; },

  async loadQueue() {
    // Pode ser chamado pelo widget da Home sem o app Música ter sido aberto ainda (this.list não existe nesse caso);
    // a leitura real de this.queue sempre acontece, só o pintar da lista do app em si depende do app estar montado.
    if (!Capability.has('indexedDB')) { if (this.list) this.list.innerHTML = '<div class="mu-empty">Armazenamento indisponível neste navegador.</div>'; return; }
    let files = [];
    try { files = await FileStore.allFiles(); } catch (e) { if (this.list) this.list.innerHTML = '<div class="mu-empty">Erro ao acessar o armazenamento: ' + e.message + '</div>'; return; }
    const audioFiles = files.filter(f => (f.mime || '').startsWith('audio/'));
    this.queue = audioFiles;
    if (this.list) this.paintList();
  },
  paintList() {
    if (!this.list) return;
    this.list.innerHTML = '';
    if (!this.queue.length) { this.list.innerHTML = '<div class="mu-empty">🎵<br>Nenhum arquivo de áudio ainda.<br>Importe pelo botão acima ou pelo app Arquivos.</div>'; return; }
    this.queue.forEach((t, i) => {
      const row = el(`<div class="mu-track-row${i === this.current ? ' playing' : ''}" data-i="${i}"><div class="mu-track-ico">${i === this.current && !this.audio.paused ? '▶️' : '🎵'}</div><div class="mu-track-main"><div class="mu-track-name">${t.name}</div><div class="mu-track-sub">${fmtBytes(t.size || 0)}</div></div></div>`);
      row.addEventListener('click', () => this.playAt(i));
      this.list.appendChild(row);
    });
  },
  async playAt(i) {
    if (i < 0 || i >= this.queue.length) return;
    const node = this.queue[i]; if (!node.blob) { Core.toast('Arquivo indisponível.'); return; }
    if (this._url) URL.revokeObjectURL(this._url);
    this._url = URL.createObjectURL(node.blob); this.audio.src = this._url; this.current = i;
    try { await this.audio.play(); } catch (e) { Core.toast('Não foi possível iniciar a reprodução: ' + e.message); }
    this.paintList(); this.paintPlayer();
  },
  toggle() { if (this.current < 0) { if (this.queue.length) this.playAt(0); return; } if (this.audio.paused) this.audio.play().catch(() => {}); else this.audio.pause(); this.paintList(); this.paintPlayer(); },
  next() { if (!this.queue.length) return; const n = (this.current + 1) % this.queue.length; if (this.current === this.queue.length - 1) { this.audio.pause(); this.current = -1; this.paintList(); this.paintPlayer(); return; } this.playAt(n); },
  prev() { if (!this.queue.length) return; const p = (this.current - 1 + this.queue.length) % this.queue.length; this.playAt(p); },

  paintPlayer() {
    if (!this.playerEl) return; // app Música não está montado (ex.: chamado só pelo widget da Home)
    if (this.current < 0 || !this.queue[this.current]) { this.playerEl.style.display = 'none'; return; }
    const t = this.queue[this.current]; this.playerEl.style.display = 'block';
    this.playerEl.innerHTML = `
      <div class="mu-player-title">${t.name}</div><div class="mu-player-sub" data-loading></div>
      <div class="mu-progress-row"><span class="mu-time" id="mu-cur">0:00</span><input type="range" id="mu-seek" min="0" max="100" value="0"><span class="mu-time" id="mu-dur">0:00</span></div>
      <div class="mu-controls">
        <button class="mu-ctrl-btn jelly" id="mu-prev">⏮️</button>
        <button class="mu-ctrl-btn play jelly" id="mu-play">${this.audio.paused ? '▶️' : '⏸️'}</button>
        <button class="mu-ctrl-btn jelly" id="mu-next">⏭️</button>
      </div>
      <div class="mu-vol-row">🔈<input type="range" id="mu-vol" min="0" max="100" value="${Math.round(this.audio.volume * 100)}">🔊</div>`;
    $('mu-play').addEventListener('click', () => this.toggle()); $('mu-prev').addEventListener('click', () => this.prev()); $('mu-next').addEventListener('click', () => this.next());
    $('mu-seek').addEventListener('input', (e) => { if (this.audio.duration) this.audio.currentTime = (e.target.value / 100) * this.audio.duration; });
    $('mu-vol').addEventListener('input', (e) => { this.audio.volume = e.target.value / 100; });
    this.paintProgress();
  },
  paintProgress() {
    const cur = $('mu-cur'), dur = $('mu-dur'), seek = $('mu-seek'), playBtn = $('mu-play'); if (!cur) return;
    const fmt = (s) => { if (!isFinite(s)) return '0:00'; const m = Math.floor(s / 60), r = Math.floor(s % 60); return `${m}:${String(r).padStart(2, '0')}`; };
    cur.textContent = fmt(this.audio.currentTime); dur.textContent = fmt(this.audio.duration || 0);
    if (this.audio.duration) seek.value = String((this.audio.currentTime / this.audio.duration) * 100);
    if (playBtn) playBtn.textContent = this.audio.paused ? '▶️' : '⏸️';
  },
  async importAudio() {
    const input = document.createElement('input'); input.type = 'file'; input.accept = 'audio/*'; input.multiple = true;
    input.addEventListener('change', async () => {
      if (!input.files || !input.files.length) return;
      for (const file of input.files) {
        if (!file.type.startsWith('audio/')) { Core.toast(`"${file.name}" não é um arquivo de áudio suportado.`); continue; }
        try { await FileStore.createFile('root', file.name, file.slice(0, file.size, file.type), file.type); } catch (e) { Core.toast('Erro ao importar "' + file.name + '": ' + e.message); }
      }
      this.loadQueue();
    });
    input.click();
  }
};
Apps.music = Music15;

/* =====================================================================
   LIMEOS 1.5 — Lime AI: interface de chat completa, SEM integração de
   IA real nesta versão (adiada para uma versão futura). Nunca finge
   uma resposta de IA — todo envio recebe um estado honesto de
   "nenhum serviço configurado ainda".
   ===================================================================== */
const AI15 = {
  messages: [], sending: false,
  build(body) {
    this.messages = Storage.get('ai.history', []);
    body.innerHTML = `<div class="ai-wrap">
      <div class="app-title" style="padding-bottom:4px;display:flex;justify-content:space-between;align-items:center">
        <span>Lime AI</span><button class="fm-icon-btn jelly" id="ai-clear" aria-label="Limpar histórico">🗑️</button>
      </div>
      <div class="ai-msgs" id="ai-msgs"></div>
      <div class="ai-input-bar"><input id="ai-input" placeholder="Pergunte alguma coisa…" maxlength="2000"><button class="ai-send-btn" id="ai-send">➤</button></div>
    </div>`;
    this.msgsEl = body.querySelector('#ai-msgs'); this.input = body.querySelector('#ai-input'); this.sendBtn = body.querySelector('#ai-send');
    this.paint();
    this.sendBtn.addEventListener('click', () => this.send());
    this.input.addEventListener('keydown', (e) => { if (e.key === 'Enter') this.send(); });
    body.querySelector('#ai-clear').addEventListener('click', () => this.confirmClear());
  },
  paint() {
    this.msgsEl.innerHTML = '';
    if (!this.messages.length) { this.msgsEl.innerHTML = '<div class="ai-empty">✨<br>Envie uma mensagem para começar.<br><span class="card-sub">O Lime AI ainda não tem um serviço de inteligência artificial conectado nesta versão.</span></div>'; return; }
    this.messages.forEach(m => { const b = el(`<div class="ai-msg ${m.role}${m.notice ? ' notice' : ''}">${m.text}</div>`); this.msgsEl.appendChild(b); });
    this.msgsEl.scrollTop = this.msgsEl.scrollHeight;
  },
  persist() { Storage.set('ai.history', this.messages); },
  async send() {
    const text = this.input.value.trim();
    if (!text) return; // mensagem vazia: não envia, sem erro alarmante
    if (this.sending) return; // evita envio duplicado por clique repetido/Enter mantido
    this.sending = true; this.sendBtn.classList.add('disabled');
    this.messages.push({ role: 'user', text: this.escapeHtml(text) }); this.input.value = ''; this.persist(); this.paint();
    const typing = el('<div class="ai-typing"><i></i><i></i><i></i></div>'); this.msgsEl.appendChild(typing); this.msgsEl.scrollTop = this.msgsEl.scrollHeight;
    await new Promise(r => setTimeout(r, 450)); // pequeno delay só para a UI não parecer instantânea/quebrada
    typing.remove();
    this.messages.push({ role: 'bot', notice: true, text: 'O Lime AI ainda não tem um serviço de inteligência artificial configurado nesta versão da LimeOS. Nenhuma resposta real foi gerada.' });
    this.persist(); this.paint(); this.sending = false; this.sendBtn.classList.remove('disabled');
  },
  escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; },
  confirmClear() {
    if (!this.messages.length) return;
    FM.modal('Limpar histórico?', '<div class="card-sub">Todas as mensagens desta conversa serão apagadas. Esta ação não pode ser desfeita.</div>', [
      { label: 'Cancelar', onClick: (m) => m.remove() },
      { label: 'Limpar', primary: true, onClick: (m) => { this.messages = []; this.persist(); this.paint(); m.remove(); } }
    ]);
  }
};
Apps.ai = AI15;

/* =====================================================================
   APPS DO SISTEMA — Sobre · Relógio · Música · Arquivos · Lime AI · Tester
   ===================================================================== */
/* =====================================================================
   LIMEOS 1.5 — Sobre: informações reais + Armazenamento + Changelog.
   A versão exibida sempre reutiliza a constante VERSION central —
   nunca um número separado que possa ficar incoerente com manifest/sw.js.
   ===================================================================== */

    else b.appendChild(UI.card('🖼️ Lime Gallery (IndexedDB)', fmtBytes(mediaBytes) + ' em fotos/vídeos reais salvos pela Lime Camera/Gallery.'));

    b.appendChild(UI.card('Alcance', 'Mostra apenas o armazenamento permitido pelo ambiente web (localStorage + IndexedDB). O sistema de arquivos do Android não é acessado diretamente.'));

/* =====================================================================
   LIMEOS 1.5 — Lime Arquivos: gerenciador de arquivos real
   Pastas/arquivos reais em FileStore (IndexedDB + Blob). Diferencia o
   armazenamento virtual da LimeOS dos arquivos reais do dispositivo
   (importação/exportação via File System Access API, com fallback para
   <input type=file> + download por blob quando a API não existe).
   ===================================================================== */
const FM = {
  cwd: 'root', selected: new Set(), view: 'list', sortBy: 'name', search: '',
  els: {}, longPressTimer: null, dragSrc: null,

  async build(body) {
    this.selected = new Set(); this.cwd = 'root'; this.search = '';
    body.innerHTML = `<div class="fm-wrap">
      <div class="app-title" style="padding-bottom:6px">Arquivos</div>
      <div class="fm-toolbar">
        <button class="fm-icon-btn jelly" data-act="back" aria-label="Voltar">‹</button>
        <div class="fm-crumbs" id="fm-crumbs"></div>
        <button class="fm-icon-btn jelly" data-act="newfolder" aria-label="Nova pasta">📁+</button>
        <button class="fm-icon-btn jelly" data-act="import" aria-label="Importar">⬆️</button>
        <button class="fm-icon-btn jelly" data-act="view" aria-label="Alternar visualização">▦</button>
      </div>
      <div class="fm-search-row">
        <input class="text-input" id="fm-search" placeholder="Buscar nesta pasta…" />
        <select class="fm-sort-select" id="fm-sort">
          <option value="name">Nome</option><option value="size">Tamanho</option><option value="date">Data</option>
        </select>
      </div>
      <div class="fm-storage-tag" id="fm-storage-tag">📦 Armazenamento da LimeOS</div>
      <div class="fm-list" id="fm-list"></div>
    </div>`;
    this.els = { crumbs: body.querySelector('#fm-crumbs'), list: body.querySelector('#fm-list'), search: body.querySelector('#fm-search'), sort: body.querySelector('#fm-sort'), tag: body.querySelector('#fm-storage-tag'), toolbar: body.querySelector('.fm-toolbar'), body };
    if (!Capability.has('indexedDB')) { this.els.list.innerHTML = this.emptyHtml('⚠️', 'Armazenamento indisponível', 'Este navegador não suporta IndexedDB — o Gerenciador de Arquivos não pode funcionar aqui.'); return; }
    try { await FileStore.ensureRoot(); } catch (e) { this.els.list.innerHTML = this.emptyHtml('⚠️', 'Erro ao abrir o armazenamento', e.message); return; }
    this.bind(body);
    await this.render();
  },

  emptyHtml(icon, title, sub) { return `<div class="fm-empty"><div class="fe-icon">${icon}</div><div class="card-title">${title}</div><div class="card-sub">${sub}</div></div>`; },

  bind(body) {
    this.els.toolbar.addEventListener('click', (e) => {
      const b = e.target.closest('[data-act]'); if (!b) return;
      const act = b.dataset.act;
      if (act === 'back') this.goUp();
      else if (act === 'newfolder') this.promptNewFolder();
      else if (act === 'import') this.importFiles();
      else if (act === 'view') { this.view = this.view === 'list' ? 'grid' : 'list'; this.render(); }
    });
    this.els.search.addEventListener('input', () => { this.search = this.els.search.value; this.render(); });
    this.els.sort.addEventListener('change', () => { this.sortBy = this.els.sort.value; this.render(); });
    this.els.list.addEventListener('click', (e) => {
      const row = e.target.closest('[data-id]'); if (!row) return;
      const id = row.dataset.id;
      if (this.selected.size > 0) { this.toggleSelect(id); return; }
      this.openEntry(id);
    });
    this.els.list.addEventListener('pointerdown', (e) => {
      const row = e.target.closest('[data-id]'); if (!row) return;
      this.longPressTimer = setTimeout(() => { this.openCtxMenu(row.dataset.id, e.clientX, e.clientY); }, 480);
    });
    this.els.list.addEventListener('pointerup', () => clearTimeout(this.longPressTimer));
    this.els.list.addEventListener('pointermove', () => clearTimeout(this.longPressTimer));
  },

  async goUp() {
    if (this.cwd === 'root') { App.home(); return; }
    const node = await FileStore.get(this.cwd);
    this.cwd = (node && node.parentId) || 'root'; this.selected.clear(); await this.render();
  },
  async openEntry(id) {
    const node = await FileStore.get(id); if (!node) return;
    if (node.type === 'folder') { this.cwd = id; this.selected.clear(); await this.render(); }
    else this.preview(node);
  },
  toggleSelect(id) { this.selected.has(id) ? this.selected.delete(id) : this.selected.add(id); this.render(); },

  async render() {
    const path = await FileStore.pathOf(this.cwd);
    this.els.crumbs.innerHTML = path.map((n, i) => `<span class="fm-crumb" data-cid="${n.id}">${n.name}</span>${i < path.length - 1 ? '<span class="fm-crumb-sep">›</span>' : ''}`).join('');
    this.els.crumbs.querySelectorAll('.fm-crumb').forEach(c => c.addEventListener('click', async () => { this.cwd = c.dataset.cid; this.selected.clear(); await this.render(); }));
    let items = await FileStore.listChildren(this.cwd);
    if (this.search.trim()) { const q = this.search.trim().toLowerCase(); items = items.filter(i => i.name.toLowerCase().includes(q)); }
    items.sort((a, b) => {
      if (a.type !== b.type) return a.type === 'folder' ? -1 : 1;
      if (this.sortBy === 'size') return (b.size || 0) - (a.size || 0);
      if (this.sortBy === 'date') return (b.modifiedAt || 0) - (a.modifiedAt || 0);
      return a.name.localeCompare(b.name, 'pt-BR');
    });
    this.els.list.className = 'fm-list' + (this.view === 'grid' ? ' grid' : '');
    this.els.list.innerHTML = '';
    if (!items.length) { this.els.list.innerHTML = this.emptyHtml('📂', this.search ? 'Nada encontrado' : 'Pasta vazia', this.search ? 'Nenhum item corresponde à busca.' : 'Use os botões acima para criar uma pasta ou importar arquivos do dispositivo.'); }
    else items.forEach(n => this.els.list.appendChild(this.view === 'grid' ? this.gridCell(n) : this.listRow(n)));
    if (this.selected.size > 0) this.els.list.appendChild(this.selectionBar());
  },

  iconFor(n) { if (n.type === 'folder') return '📁'; const m = (n.mime || '').split('/')[0]; return m === 'image' ? '🖼️' : m === 'audio' ? '🎵' : m === 'video' ? '🎬' : (n.mime === 'application/pdf') ? '📕' : m === 'text' ? '📄' : '📦'; },
  metaFor(n) { if (n.type === 'folder') return 'Pasta'; const d = new Date(n.modifiedAt).toLocaleDateString('pt-BR'); return `${fmtBytes(n.size || 0)} · ${d}`; },

  listRow(n) {
    const sel = this.selected.has(n.id);
    const row = el(`<div class="fm-row${sel ? ' selected' : ''}" data-id="${n.id}">
      <div class="fm-row-check">${sel ? '✓' : ''}</div>
      <div class="fm-row-ico">${n.type === 'file' && (n.mime || '').startsWith('image/') ? '' : this.iconFor(n)}</div>
      <div class="fm-row-main"><div class="fm-row-name">${n.name}</div><div class="fm-row-meta">${this.metaFor(n)}</div></div>
    </div>`);
    if (n.type === 'file' && (n.mime || '').startsWith('image/') && n.blob) { const img = document.createElement('img'); img.src = URL.createObjectURL(n.blob); row.querySelector('.fm-row-ico').appendChild(img); }
    return row;
  },
  gridCell(n) {
    const sel = this.selected.has(n.id);
    const cell = el(`<div class="fm-grid-cell${sel ? ' selected' : ''}" data-id="${n.id}">
      <div class="fm-row-ico">${n.type === 'file' && (n.mime || '').startsWith('image/') ? '' : this.iconFor(n)}</div>
      <div class="fm-row-name">${n.name}</div>
    </div>`);
    if (n.type === 'file' && (n.mime || '').startsWith('image/') && n.blob) { const img = document.createElement('img'); img.src = URL.createObjectURL(n.blob); cell.querySelector('.fm-row-ico').appendChild(img); }
    return cell;
  },
  selectionBar() {
    const bar = el(`<div class="fm-selbar">
      <span class="fm-selcount">${this.selected.size} selecionado(s)</span>
      <button class="btn jelly" data-sact="rename">Renomear</button>
      <button class="btn jelly" data-sact="duplicate">Duplicar</button>
      <button class="btn jelly" data-sact="move">Mover</button>
      <button class="btn jelly" data-sact="export">Exportar</button>
      <button class="btn jelly" data-sact="info">Info</button>
      <button class="btn jelly" data-sact="delete" style="color:var(--error)">Excluir</button>
      <button class="btn jelly" data-sact="cancel">Cancelar</button>
    </div>`);
    bar.addEventListener('click', (e) => { const b = e.target.closest('[data-sact]'); if (!b) return; this.runAction(b.dataset.sact); });
    return bar;
  },

  async runAction(act) {
    const ids = [...this.selected];
    if (act === 'cancel') { this.selected.clear(); return this.render(); }
    if (act === 'delete') return this.confirmDelete(ids);
    if (act === 'rename') return this.promptRename(ids[0]);
    if (act === 'duplicate') { for (const id of ids) { try { await FileStore.duplicate(id); } catch (e) { Core.toast('Erro ao duplicar: ' + e.message); } } this.selected.clear(); return this.render(); }
    if (act === 'move') return this.openMovePicker(ids);
    if (act === 'export') return this.exportItems(ids);
    if (act === 'info') return this.showInfo(ids[0]);
  },

  openCtxMenu(id, x, y) {
    const menu = el(`<div class="fm-ctx">
      <button data-a="open">📂 Abrir</button>
      <button data-a="select">☑️ Selecionar</button>
      <button data-a="rename">✏️ Renomear</button>
      <button data-a="duplicate">📋 Duplicar</button>
      <button data-a="move">↗️ Mover</button>
      <button data-a="export">⬇️ Exportar</button>
      <button data-a="info">ℹ️ Informações</button>
      <button data-a="delete" class="danger">🗑️ Excluir</button>
    </div>`);
    const vw = window.innerWidth, vh = window.innerHeight;
    menu.style.left = Math.min(x, vw - 200) + 'px'; menu.style.top = Math.min(y, vh - 320) + 'px';
    document.body.appendChild(menu);
    const close = () => { menu.remove(); document.removeEventListener('pointerdown', onOut, true); };
    const onOut = (e) => { if (!menu.contains(e.target)) close(); };
    setTimeout(() => document.addEventListener('pointerdown', onOut, true), 10);
    menu.addEventListener('click', async (e) => {
      const b = e.target.closest('[data-a]'); if (!b) return; close();
      const a = b.dataset.a;
      if (a === 'open') this.openEntry(id);
      else if (a === 'select') { this.selected.add(id); this.render(); }
      else if (a === 'rename') this.promptRename(id);
      else if (a === 'duplicate') { try { await FileStore.duplicate(id); } catch (err) { Core.toast('Erro: ' + err.message); } this.render(); }
      else if (a === 'move') this.openMovePicker([id]);
      else if (a === 'export') this.exportItems([id]);
      else if (a === 'info') this.showInfo(id);
      else if (a === 'delete') this.confirmDelete([id]);
    });
  },

  modal(titleHtml, bodyHtml, actions) {
    const bd = el(`<div class="fm-modal-backdrop"><div class="fm-modal"><h3>${titleHtml}</h3>${bodyHtml}<div class="fm-modal-actions"></div></div></div>`);
    const actRow = bd.querySelector('.fm-modal-actions');
    actions.forEach(a => { const b = el(`<button class="btn ${a.primary ? 'primary' : ''} jelly">${a.label}</button>`); b.addEventListener('click', () => a.onClick(bd)); actRow.appendChild(b); });
    document.body.appendChild(bd); return bd;
  },

  promptNewFolder() {
    const bd = this.modal('Nova pasta', '<input class="text-input" id="fm-nf-name" placeholder="Nome da pasta" autofocus>', [
      { label: 'Cancelar', onClick: (m) => m.remove() },
      { label: 'Criar', primary: true, onClick: async (m) => {
          const name = m.querySelector('#fm-nf-name').value.trim(); if (!name) return;
          try { await FileStore.createFolder(this.cwd, name); m.remove(); this.render(); } catch (e) { Core.toast('Erro: ' + e.message); }
        } }
    ]);
    setTimeout(() => bd.querySelector('input').focus(), 50);
  },
  async promptRename(id) {
    const node = await FileStore.get(id); if (!node) return;
    const bd = this.modal('Renomear', `<input class="text-input" id="fm-rn-name" value="${node.name.replace(/"/g, '&quot;')}">`, [

/* ---------- Lime Calculator: parser próprio (sem eval), recursive-descent com precedência real ----------
   Gramática: expr := term (('+'|'-') term)*
              term := factor (('*'|'/'|'%') factor)*
              factor := unary ('^' unary)*      (potência, opcional, associa à direita)
              unary := ('-'|'+')? atom
              atom := number | '(' expr ')'
   Erros (divisão por zero, parênteses desbalanceados, token inválido, expressão incompleta) são capturados e
   retornam { error: '...' } em vez de lançar — a UI nunca mostra um erro JS cru. */
const CalcParser = {
  tokenize(src) {
    const toks = []; let i = 0;
    while (i < src.length) {
      const c = src[i];
      if (c === ' ') { i++; continue; }
      if (/[0-9.]/.test(c)) { let j = i; while (j < src.length && /[0-9.]/.test(src[j])) j++; const n = src.slice(i, j); if ((n.match(/\./g) || []).length > 1) throw new Error('Número inválido'); toks.push({ t: 'num', v: parseFloat(n) }); i = j; continue; }
      if ('+-*/%^()'.includes(c)) { toks.push({ t: c }); i++; continue; }
      throw new Error('Caractere inválido: ' + c);
    }
    return toks;
  },
  parse(src) {
    const toks = this.tokenize(src); let p = 0;
    const peek = () => toks[p]; const next = () => toks[p++];
    const expectNum = () => { if (!peek()) throw new Error('Expressão incompleta'); };
    const atom = () => {
      const t = peek(); if (!t) throw new Error('Expressão incompleta');
      if (t.t === 'num') { next(); return t.v; }
      if (t.t === '(') { next(); const v = expr(); if (!peek() || peek().t !== ')') throw new Error('Parênteses desbalanceados'); next(); return v; }
      throw new Error('Expressão incompleta');
    };
    const unary = () => { if (peek() && (peek().t === '-' || peek().t === '+')) { const op = next().t; return op === '-' ? -unary() : unary(); } return atom(); };
    const factor = () => { let v = unary(); while (peek() && peek().t === '^') { next(); const rhs = unary(); v = Math.pow(v, rhs); } return v; };
    const term = () => {
      let v = factor();
      while (peek() && (peek().t === '*' || peek().t === '/' || peek().t === '%')) {
        const op = next().t; const rhs = factor();
        if (op === '*') v = v * rhs; else if (op === '/') { if (rhs === 0) throw new Error('Divisão por zero'); v = v / rhs; } else { if (rhs === 0) throw new Error('Divisão por zero'); v = v % rhs; }
      }
      return v;
    };
    const expr = () => {
      let v = term();
      while (peek() && (peek().t === '+' || peek().t === '-')) { const op = next().t; const rhs = term(); v = op === '+' ? v + rhs : v - rhs; }
      return v;
    };
    expectNum();
    const v = expr();
    if (p < toks.length) throw new Error('Expressão inválida');
    if (!isFinite(v)) throw new Error('Resultado inválido');
    return v;
  },
  eval(src) { try { return { value: this.parse(src) }; } catch (e) { return { error: e.message || 'Expressão inválida' }; } },
  fmt(n) {
    if (!isFinite(n)) return 'Erro';
    if (Math.abs(n) >= 1e15 || (Math.abs(n) < 1e-9 && n !== 0)) return n.toExponential(6).replace(/e\+?/, 'e');
    const r = Math.round(n * 1e10) / 1e10; // evita ruído de ponto flutuante
    let s = String(r);
    if (s.length > 16) s = r.toPrecision(12).replace(/\.?0+$/, '').replace(/\.?0+e/, 'e');
    return s;
  }
};

Apps.calculator = { build(body) {
  body.innerHTML = '<div class="calc-wrap"><div class="calc-display"><div class="calc-expr" id="calc-expr"></div><div class="calc-result" id="calc-result">0</div></div><div class="calc-grid" id="calc-grid"></div></div>';
  let expr = '', lastResult = null, justEvaled = false;
  const exprEl = body.querySelector('#calc-expr'), resEl = body.querySelector('#calc-result'), grid = body.querySelector('#calc-grid');
  const OPS = '+-*/%^';
  const lastCh = () => expr.length ? expr[expr.length - 1] : '';
  const isOpCh = (c) => OPS.includes(c);
  const render = () => {
    exprEl.textContent = expr || '';
    if (!expr) { resEl.textContent = '0'; return; }
    const r = CalcParser.eval(expr.replace(/×/g, '*').replace(/÷/g, '/'));
    resEl.textContent = r.error ? '—' : CalcParser.fmt(r.value);
  };
  const press = (v) => {
    if (v === 'C') { expr = ''; lastResult = null; justEvaled = false; render(); return; }
    if (v === 'back') { expr = expr.slice(0, -1); justEvaled = false; render(); return; }
    if (v === '=') {
      if (!expr) return;
      const r = CalcParser.eval(expr.replace(/×/g, '*').replace(/÷/g, '/'));
      if (r.error) { resEl.textContent = r.error; return; }
      lastResult = r.value; exprEl.textContent = expr + ' ='; resEl.textContent = CalcParser.fmt(r.value); expr = CalcParser.fmt(r.value); justEvaled = true; return;
    }
    if (v === '±') { // troca de sinal do número atual no fim da expressão
      const m = expr.match(/(-?\d*\.?\d+)$/); if (!m) { expr = expr + '-'; render(); return; }
      const start = expr.length - m[0].length; const num = m[0]; expr = expr.slice(0, start) + (num.startsWith('-') ? num.slice(1) : '-' + num); render(); return;
    }
    if (isOpCh(v) || v === '×' || v === '÷') {
      const opNorm = v === '×' ? '*' : v === '÷' ? '/' : v;
      if (justEvaled) { justEvaled = false; }
      if (!expr) { if (opNorm === '-') { expr = '-'; render(); } return; } // só "-" pode iniciar (negativo)
      if (isOpCh(lastCh())) { expr = expr.slice(0, -1) + v; render(); return; } // operador repetido: substitui, não quebra
      expr += v; justEvaled = false; render(); return;

    }
    if (v === '(' || v === ')') { if (justEvaled) { expr = ''; justEvaled = false; } expr += v; render(); return; }

    if (justEvaled) { expr = v; justEvaled = false; render(); return; }
    expr += v; render();

    ['7', ''], ['8', ''], ['9', ''], ['×', 'op'],
    ['4', ''], ['5', ''], ['6', ''], ['-', 'op'],
    ['1', ''], ['2', ''], ['3', ''], ['+', 'op'],
    ['±', 'fn'], ['0', ''], ['.', ''], ['=', 'eq']

  keys.forEach(([label, cls]) => {

  cKey.addEventListener('pointerup', () => { clearTimeout(cTimer); });
  render();
} };

/* ---------- Lime Notes: CRUD real local, busca, anexos genéricos (FileReader dataURL) ----------
   Persistência: Storage 'notes.list' = [{id, title, content, updatedAt, attachments:[{name, dataUrl, size}]}]

  remove(id) { this.save(this.load().filter(x => x.id !== id)); }
};

/* ---------- Lime Browser: navegação real via iframe, histórico próprio, detecção honesta de bloqueio ----------
   Limitações documentadas na própria UI (ver browser-error / nota de rodapé):
   - iframe cross-origin não permite ler iframe.contentWindow.history → "voltar/avançar" usa um histórico PRÓPRIO
     do Lime Browser (array de URLs + índice), não o histórico interno do site.
   - CSP frame-ancestors pode bloquear a incorporação SEM disparar nenhum evento de erro — por isso o bloqueio é
     detectado por um timeout (8s) combinado com o evento 'load'; nem todo bloqueio é detectável a tempo.
   - "Parar" apenas interrompe visualmente (troca o src); não há controle real sobre a requisição de rede do iframe. */
const BrowserHistory = { KEY: 'browser.history', MAX: 50,
  load() { const l = Storage.get(this.KEY, []); return Array.isArray(l) ? l : []; },
  push(url) { const l = this.load(); l.unshift({ url, time: Date.now() }); Storage.set(this.KEY, l.slice(0, this.MAX)); }
};
Apps.browser = {
  TIMEOUT_MS: 7000,
  looksLikeUrl(s) {
    if (/\s/.test(s)) return false;
    return /^(https?:\/\/)?([\w-]+\.)+[a-z]{2,}(:\d+)?(\/.*)?$/i.test(s.trim());
  },
  toUrl(s) { s = s.trim(); if (!/^https?:\/\//i.test(s)) s = 'https://' + s; return s; },
  searchUrl(q) { return 'https://duckduckgo.com/?q=' + encodeURIComponent(q); },
  build(body) {
    this.hist = []; this.idx = -1; this.timer = null;
    body.innerHTML = '<div class="browser-wrap"><div class="browser-bar"><button class="browser-nav-btn jelly" id="bw-back">‹</button><button class="browser-nav-btn jelly" id="bw-fwd">›</button><button class="browser-nav-btn jelly" id="bw-reload">⟳</button><input class="browser-addr" id="bw-addr" placeholder="Pesquisar ou digitar endereço..."><button class="browser-nav-btn jelly" id="bw-go">↵</button></div><div class="browser-progress" id="bw-progress"></div><div class="browser-frame-wrap" id="bw-frame-wrap"><div class="browser-home" id="bw-home"><span style="font-size:40px">🌐</span><div class="card-title">Lime Browser</div><div class="card-sub" style="max-width:280px">Digite um endereço ou pesquise algo. Navegação baseada em iframe: a maioria dos sites bloqueia a incorporação (X-Frame-Options/CSP) — quando isso acontecer, você verá um aviso claro com a opção de abrir externamente.</div></div></div></div>';
    this.el = { addr: body.querySelector('#bw-addr'), back: body.querySelector('#bw-back'), fwd: body.querySelector('#bw-fwd'), reload: body.querySelector('#bw-reload'), go: body.querySelector('#bw-go'), wrap: body.querySelector('#bw-frame-wrap'), progress: body.querySelector('#bw-progress'), home: body.querySelector('#bw-home') };
    this.el.addr.addEventListener('keydown', (e) => { if (e.key === 'Enter') this.navigateFromInput(); });
    this.el.go.addEventListener('click', () => this.navigateFromInput());
    this.el.back.addEventListener('click', () => this.goBack());
    this.el.fwd.addEventListener('click', () => this.goFwd());
    this.el.reload.addEventListener('click', () => this.reload());
    this.updateNavButtons();
  },
  onClose() { clearTimeout(this.timer); },
  navigateFromInput() {
    const v = this.el.addr.value.trim(); if (!v) return;
    const url = this.looksLikeUrl(v) ? this.toUrl(v) : this.searchUrl(v);
    this.go(url, true);
  },
  updateNavButtons() {
    this.el.back.classList.toggle('disabled', this.idx <= 0);
    this.el.fwd.classList.toggle('disabled', this.idx >= this.hist.length - 1);
  },
  goBack() { if (this.idx > 0) { this.idx--; this.load(this.hist[this.idx], false); } },
  goFwd() { if (this.idx < this.hist.length - 1) { this.idx++; this.load(this.hist[this.idx], false); } },
  reload() { if (this.idx >= 0) this.load(this.hist[this.idx], false, true); },
  go(url, pushNew) {
    if (pushNew) { this.hist = this.hist.slice(0, this.idx + 1); this.hist.push(url); this.idx = this.hist.length - 1; try { BrowserHistory.push(url); } catch (e) {} }
    this.load(url, true);
  },
  load(url, updateAddr, forceReload) {
    clearTimeout(this.timer); this.updateNavButtons();
    if (updateAddr) this.el.addr.value = url;
    this.el.home.style.display = 'none';
    const wrap = this.el.wrap; wrap.querySelectorAll('.browser-error').forEach(e => e.remove());
    let iframe = wrap.querySelector('iframe');
    if (!iframe || forceReload) { if (iframe) iframe.remove(); iframe = document.createElement('iframe'); iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups'); wrap.appendChild(iframe); }
    this.el.progress.classList.add('loading');
    let loaded = false;
    const onLoad = () => { loaded = true; this.el.progress.classList.remove('loading'); iframe.removeEventListener('load', onLoad); };
    iframe.addEventListener('load', onLoad);
    iframe.src = url;
    this.timer = setTimeout(() => {
      if (!loaded) { this.showError(url); }
      this.el.progress.classList.remove('loading');
    }, this.TIMEOUT_MS);
  },
  showError(url) {
    const wrap = this.el.wrap; wrap.querySelectorAll('.browser-error').forEach(e => e.remove());
    const err = el(`<div class="browser-error"><span class="be-icon">🚫</span><div class="card-title" style="color:#fff">Este site não permite ser exibido aqui</div><div>O carregamento não foi concluído a tempo. Muitos sites bloqueiam incorporação via iframe (X-Frame-Options/CSP); por segurança do navegador, nem todo bloqueio pode ser detectado automaticamente — às vezes ele falha de forma silenciosa.</div><a class="btn primary jelly" href="${url}" target="_blank" rel="noopener">Abrir no navegador externo</a></div>`);
    wrap.appendChild(err);
  }
};

/* ---------- LifeOS: PWA pessoal do usuário, incorporado via iframe srcdoc (único arquivo HTML autocontido) ----------
   LifeOS não compartilha código com a LimeOS. Como a LimeOS é single-file, o jeito mais robusto de incorporar
   sem servidor HTTP próprio é via iframe.srcdoc com o HTML completo do LifeOS embutido como string.
   sandbox="allow-scripts allow-same-origin allow-forms allow-popups": allow-same-origin é necessário aqui porque
   o LifeOS usa localStorage próprio (DB_KEY='lifeos_db_v1') sem try/catch — sem essa permissão o acesso lançaria
   SecurityError e o app quebraria ao abrir. Isso dá ao LifeOS uma origem derivada do documento pai, isolada do
   localStorage da LimeOS (prefixo 'limeos.'); os dados do LifeOS continuam 100% locais, nunca enviados a um
   servidor. Limitação honesta: o Service Worker do LifeOS (sw.js) não pode ser registrado dentro de um iframe
   srcdoc (não há um arquivo real para o navegador buscar) — a chamada já vem protegida com .catch(()=>{}) no
   próprio LifeOS, então isso não quebra o app; apenas o cache offline próprio dele não funciona aqui dentro. */
Apps.lifeos = {
  build(body) {
    body.innerHTML = '<div class="lifeos-wrap"></div>';
    const wrap = body.querySelector('.lifeos-wrap');
    const tpl = $('lifeos-source');
    /* Use innerHTML to preserve HTML tags; textContent strips them and only gives plain text */
    const html = tpl ? tpl.innerHTML : '';
    if (html) {
      const iframe = document.createElement('iframe');
      iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups');
      wrap.appendChild(iframe);
      iframe.srcdoc = html;
    } else {
      wrap.innerHTML = '<div class="app-center">Conteúdo do LifeOS não encontrado.</div>';
    }
  }
};

/* ---------- Sons internos (áudio produzido pelo próprio LimeOS) ---------- */
const Sound = {
  ctx: null,
  beep(kind) {
    if (State.v.mute) return false; const map = { system: 'soundSystem', touch: 'soundTouch', notif: 'soundNotif' }; if (map[kind] && !State.v[map[kind]]) return false;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
    try { this.ctx = this.ctx || new AC(); const o = this.ctx.createOscillator(), g = this.ctx.createGain(); o.frequency.value = { system: 523, touch: 880, notif: 660 }[kind] || 660; g.gain.value = 0.15 * (State.v.volume / 100); o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime + 0.18); return true; } catch (e) { return false; }
  }
};

/* ---------- Tester (ferramenta administrativa) ---------- */
/* =====================================================================
   LIMEOS 1.5 — Tester: diagnóstico real, padronizado.
   Cada teste registra { name, what, result: pass|fail|unavailable|notested,
   detail, limitation }. Execução manual (botão), nunca automática.
   Um teste só é "pass" se o comportamento real foi verificado — não
   basta um elemento existir no HTML.
   ===================================================================== */
const Diag = {
  async run() {
    const results = [];
    const T = async (name, what, fn) => { try { const r = await fn(); results.push(Object.assign({ name, what }, r)); } catch (e) { results.push({ name, what, result: 'fail', detail: 'Erro inesperado: ' + e.message }); } };

    await T('Inicialização do sistema', 'Shell, State e Core carregados e com um app registrado.', () => {
      const ok = !!(Shell && State && Core && Object.keys(APPS).length > 0);
      return ok ? { result: 'pass', detail: `${Object.keys(APPS).length} apps registrados.` } : { result: 'fail', detail: 'Módulos principais ausentes.' };
    });
    await T('Registro dos aplicativos', 'Todo app em DEFAULT_ORDER existe em APPS e tem build().', () => {
      const missing = DEFAULT_ORDER.filter(id => !APPS[id] || !Apps[id] || typeof Apps[id].build !== 'function');
      return missing.length ? { result: 'fail', detail: 'Sem build() ou registro: ' + missing.join(', ') } : { result: 'pass', detail: 'Todos os apps fixos têm registro e build() válidos.' };
    });
    await T('Consistência de identificadores', 'Todo id em Home.order existe em APPS (sem referência quebrada).', () => {
      const bad = Home.order.filter(id => !APPS[id]);
      return bad.length ? { result: 'fail', detail: 'IDs inválidos na Home: ' + bad.join(', ') } : { result: 'pass', detail: `${Home.order.length} ícones na Home, todos válidos.` };
    });
    await T('Integridade do estado de instalação', 'Todo app instalado via App Store existe e está presente na Home.', () => {
      const installed = AppStore.installed(); const bad = installed.filter(id => !APPS[id] || !Home.order.includes(id));
      return bad.length ? { result: 'fail', detail: 'Instalado mas ausente da Home: ' + bad.join(', ') } : { result: 'pass', detail: `${installed.length} app(s) opcional(is) instalado(s), todos coerentes.` };
    });
    await T('Acesso ao armazenamento (localStorage)', 'Grava e lê uma chave de teste real.', () => {
      const k = '__diag_test__' + Date.now(); const ok = Storage.set(k, 1) && Storage.get(k) === 1; Storage.del(k);
      return ok ? { result: 'pass', detail: 'Leitura e escrita confirmadas.' } : { result: 'fail', detail: 'Falha ao gravar/ler no localStorage.' };
    });
    await T('Acesso ao armazenamento (IndexedDB / FileStore)', 'Abre o banco e confirma a pasta-raiz do Arquivos.', async () => {
      if (!Capability.has('indexedDB')) return { result: 'unavailable', detail: 'IndexedDB não suportado neste navegador.' };
      try { const root = await FileStore.ensureRoot(); return root ? { result: 'pass', detail: 'Banco aberto e raiz "' + root.name + '" confirmada.' } : { result: 'fail', detail: 'Raiz não encontrada.' }; }
      catch (e) { return { result: 'fail', detail: e.message }; }
    });
    await T('Notificações web', 'API Notification presente no navegador.', () => Capability.has('notifications') ? { result: 'pass', detail: 'API disponível (usada por alarmes/temporizador).' } : { result: 'unavailable', detail: 'Notification API ausente neste navegador.', limitation: 'Alarmes ainda funcionam dentro do app via toast/som, mas sem notificação do sistema.' });
    await T('File System Access API', 'showOpenFilePicker/showSaveFilePicker presentes.', () => Capability.has('fileSystemAccess') ? { result: 'pass', detail: 'Import/export usarão o seletor nativo do sistema.' } : { result: 'unavailable', detail: 'API ausente — Arquivos usa o seletor clássico (<input type=file> + download) como alternativa.' });
    await T('Manifesto do PWA', 'manifest.json referenciado no documento.', () => { const link = document.querySelector('link[rel="manifest"]'); return link ? { result: 'pass', detail: 'Link para ' + link.getAttribute('href') + ' presente.' } : { result: 'fail', detail: 'Tag <link rel="manifest"> não encontrada.' }; });
    await T('Service Worker', 'Registro ativo via navigator.serviceWorker.', async () => {
      if (!Capability.has('serviceWorker')) return { result: 'unavailable', detail: 'Service Worker não suportado neste navegador.' };
      try { const regs = await navigator.serviceWorker.getRegistrations(); return regs.length ? { result: 'pass', detail: regs.length + ' registro(s) ativo(s).' } : { result: 'fail', detail: 'Suportado, mas nenhum registro ativo encontrado.' }; }
      catch (e) { return { result: 'fail', detail: e.message }; }

   LIMEOS 1.7 — Lime Gallery

   favoritos + busca/filtros + seleção múltipla + lixeira. Tudo sobre o
   MediaStore real (IndexedDB). URLs de objeto são sempre revogadas ao
   sair da tela que as usa, para não acumular referências.

  currentAlbum: null, _urls: [], viewerIndex: 0, viewerList: [],

  onClose() { this.revokeAll(); },
  back() {

    if (this.view === 'album') { this.view = 'grid'; this.currentAlbum = null; this.renderGrid(); return true; }
    if (this.view === 'albums') { this.view = 'grid'; this.renderGrid(); return true; }

  revokeAll() { this._urls.forEach(u => { try { URL.revokeObjectURL(u); } catch (e) {} }); this._urls = []; },
  mkUrl(blob) { if (!blob) return ''; const u = URL.createObjectURL(blob); this._urls.push(u); return u; },
  async getFiltered() {
    let items;
    if (this.filter === 'trash') items = await MediaStore.trash();
    else items = await MediaStore.library();
    if (this.currentAlbum) items = items.filter(m => m.albumIds && m.albumIds.includes(this.currentAlbum));
    if (this.filter === 'photo') items = items.filter(m => m.kind === 'photo');
    else if (this.filter === 'video') items = items.filter(m => m.kind === 'video');
    else if (this.filter === 'fav') items = items.filter(m => m.favorite);
    if (this.query.trim()) { const q = this.query.trim().toLowerCase(); items = items.filter(m => (m.name || '').toLowerCase().includes(q)); }
    items.sort((a, b) => (b.capturedAt || b.createdAt) - (a.capturedAt || a.createdAt));
    return items;
  },
  renderGrid() {
    this.view = 'grid'; this.revokeAll();
    const b = this.body; b.innerHTML = `<div class="gal-wrap">
      <div class="gal-topbar">
        <span class="gal-title">Lime Gallery</span>
        <button class="gal-icon-btn jelly" id="gg-cam" title="Abrir câmera">📷</button>
        <button class="gal-icon-btn jelly" id="gg-albums" title="Álbuns">🗂️</button>

        <button class="gal-icon-btn jelly" id="gg-select" title="Selecionar">☑️</button>
      </div>
      <div class="gal-search-row"><input class="text-input" id="gg-q" placeholder="Buscar por nome..." value="${this.query.replace(/"/g, '&quot;')}"></div>
      <div class="gal-tabs" id="gg-tabs"></div>

      <div class="gal-grid" id="gg-grid"></div>

    const tabs = [['all', 'Tudo'], ['photo', 'Fotos'], ['video', 'Vídeos'], ['fav', '★ Favoritos'], ['trash', '🗑️ Lixeira']];
    const tabsEl = b.querySelector('#gg-tabs');
    tabs.forEach(([k, label]) => { const t = el(`<button class="gal-tab jelly ${this.filter === k ? 'active' : ''}">${label}</button>`); t.addEventListener('click', () => { this.filter = k; this.renderGrid(); }); tabsEl.appendChild(t); });
    b.querySelector('#gg-cam').addEventListener('click', () => App.open('camera'));
    b.querySelector('#gg-albums').addEventListener('click', () => this.renderAlbums());

    b.querySelector('#gg-select').addEventListener('click', () => { this.selectMode = !this.selectMode; this.selected.clear(); this.paintGrid(); });
    b.querySelector('#gg-q').addEventListener('input', (e) => { this.query = e.target.value; this.paintGrid(); });

  async paintGrid() {
    const grid = this.body.querySelector('#gg-grid'); if (!grid) return;
    grid.innerHTML = '<div class="gal-empty">Carregando…</div>';
    let items;
    try { items = await this.getFiltered(); } catch (e) { grid.innerHTML = `<div class="gal-empty"><span class="ge-icon">⚠️</span><div>Erro ao acessar o armazenamento: ${e.message}</div></div>`; return; }
    this.revokeAll(); grid.innerHTML = '';
    const selbar = this.body.querySelector('#gg-selbar'); selbar.classList.toggle('show', this.selectMode);
    if (!items.length) {
      const msg = this.filter === 'trash' ? 'A lixeira está vazia.' : this.query ? 'Nenhuma mídia encontrada para essa busca.' : 'Nenhuma mídia ainda. Use a câmera ou importe arquivos.';
      grid.innerHTML = `<div class="gal-empty"><span class="ge-icon">🖼️</span><div>${msg}</div></div>`; this.paintSelbar(); return;
    }
    this._list = items;
    items.forEach(m => {
      const url = this.mkUrl(m.thumbBlob || m.blob);
      const cell = el(`<button class="gal-cell jelly" data-id="${m.id}">${m.kind === 'video' ? `<video src="${url}" muted></video><span class="gc-video-badge">▶ ${m.durationMs ? fmtDur(m.durationMs) : ''}</span>` : `<img src="${url}" loading="lazy">`}${m.favorite ? '<span class="gc-fav">★</span>' : ''}<span class="gc-select-dot"></span></button>`);
      cell.classList.toggle('selected', this.selected.has(m.id));
      cell.addEventListener('click', () => { if (this.selectMode) this.toggleSelect(m.id, cell); else this.openViewer(items, items.indexOf(m)); });
      cell.addEventListener('contextmenu', (e) => e.preventDefault());

    });
