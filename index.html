  },
  toggleSelect(id, cell) { if (this.selected.has(id)) this.selected.delete(id); else this.selected.add(id); cell.classList.toggle('selected', this.selected.has(id)); this.paintSelbar(); },
  paintSelbar() {
    const bar = this.body.querySelector('#gg-selbar'); if (!bar) return; bar.innerHTML = '';
    const count = el(`<span class="gs-count">${this.selected.size} selecionado(s)</span>`); bar.appendChild(count);
    if (!this.selectMode) return;
    const mk = (label, fn) => { const btn = el(`<button class="btn jelly" style="padding:6px 10px">${label}</button>`); btn.addEventListener('click', fn); bar.appendChild(btn); return btn; };
    if (this.filter === 'trash') {
      mk('Restaurar', () => this.bulkRestore());
      mk('Excluir definitivamente', () => this.bulkPurge());
    } else {
      mk('★ Favoritar', () => this.bulkFavorite(true));
      mk('☆ Desfavoritar', () => this.bulkFavorite(false));
      mk('Álbum', () => this.bulkAddToAlbum());
      mk('Compartilhar', () => this.bulkShare());
      mk('Lixeira', () => this.bulkTrash());
    }
  },
  requireSelection() { if (!this.selected.size) { Core.toast('Selecione pelo menos um item.'); return false; } return true; },
  async bulkFavorite(fav) {
    if (!this.requireSelection()) return;
    for (const id of this.selected) { try { const m = await MediaStore.getMedia(id); if (m && m.favorite !== fav) await MediaStore.toggleFavorite(id); } catch (e) {} }
    Core.toast(fav ? 'Adicionado(s) aos favoritos.' : 'Removido(s) dos favoritos.'); this.paintGrid();
  },
  async bulkTrash() {
    if (!this.requireSelection()) return;
    const ids = [...this.selected];
    FM.modal('Mover para a lixeira?', `<div class="card-sub" style="padding:4px 2px 10px">${ids.length} item(ns) será(ão) movido(s) para a lixeira. Você pode restaurá-los depois.</div>`, [
      { label: 'Cancelar', onClick: (m) => m.remove() },
      { label: 'Mover', primary: true, onClick: async (m) => { m.remove(); for (const id of ids) { try { await MediaStore.trashMedia(id); } catch (e) { Core.toast('Erro: ' + e.message); } } this.selected.clear(); this.selectMode = false; this.paintGrid(); } }
    ]);
  },
  async bulkRestore() { if (!this.requireSelection()) return; for (const id of this.selected) { try { await MediaStore.restoreMedia(id); } catch (e) { Core.toast('Erro ao restaurar: ' + e.message); } } Core.toast('Restaurado(s).'); this.selected.clear(); this.selectMode = false; this.paintGrid(); },
  async bulkPurge() {
    if (!this.requireSelection()) return;
    const ids = [...this.selected];
    FM.modal('Excluir definitivamente?', `<div class="card-sub" style="padding:4px 2px 10px">${ids.length} item(ns) será(ão) apagado(s) para sempre. Esta ação não pode ser desfeita.</div>`, [
      { label: 'Cancelar', onClick: (m) => m.remove() },
      { label: 'Excluir', primary: true, onClick: async (m) => { m.remove(); for (const id of ids) { try { await MediaStore.purgeMedia(id); } catch (e) { Core.toast('Erro: ' + e.message); } } this.selected.clear(); this.selectMode = false; this.paintGrid(); } }
    ]);
  },
  async bulkAddToAlbum() {
    if (!this.requireSelection()) return;
    const albums = await MediaStore.allAlbums(); const ids = [...this.selected];
    const list = albums.map(a => `<button class="widget-picker-list-item jelly" data-id="${a.id}" style="display:flex;width:100%;padding:12px 4px;border:none;background:none;color:#fff;text-align:left">${a.name.replace(/</g, '&lt;')}</button>`).join('') || '<div class="card-sub">Nenhum álbum ainda. Crie um primeiro.</div>';
    const bd = FM.modal('Adicionar ao álbum', `<div style="max-height:50vh;overflow-y:auto">${list}</div>`, [{ label: 'Cancelar', onClick: (m) => m.remove() }, { label: 'Novo álbum', onClick: (m) => { m.remove(); this.createAlbumFlow(ids); } }]);
    bd.querySelectorAll('[data-id]').forEach(btn => btn.addEventListener('click', async () => {
      for (const id of ids) { try { await MediaStore.addToAlbum(id, btn.dataset.id); } catch (e) {} }
      Core.toast('Adicionado(s) ao álbum.'); bd.remove(); this.selected.clear(); this.selectMode = false; this.paintGrid();
    }));
  },
  async bulkShare() {
    if (!this.requireSelection()) return;
    const ids = [...this.selected]; const media = []; for (const id of ids) { const m = await MediaStore.getMedia(id); if (m) media.push(m); }
    this.shareMedia(media);
  },
  async shareMedia(mediaArr) {
    if (!mediaArr.length) return;
    try {
      const files = mediaArr.map(m => new File([m.blob], (m.name || 'midia') + (m.kind === 'video' ? '.webm' : '.jpg'), { type: m.mime }));
      if (navigator.canShare && navigator.canShare({ files }) && navigator.share) { await navigator.share({ files }); return; }
    } catch (e) { if (e.name === 'AbortError') return; }
    // alternativa real: download via link, quando o compartilhamento de arquivos não é suportado
    try {
      for (const m of mediaArr) {
        const url = URL.createObjectURL(m.blob); const a = document.createElement('a');
        a.href = url; a.download = (m.name || 'midia') + (m.kind === 'video' ? '.webm' : '.jpg'); document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
      }
      Core.toast('Compartilhamento direto não suportado aqui — exportado por download.');
    } catch (e) { Core.toast('Não foi possível compartilhar nem exportar: ' + e.message); }
  },
  importFiles() {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*,video/*'; inp.multiple = true;
    inp.addEventListener('change', async () => {
      const files = Array.from(inp.files || []); if (!files.length) return;
      const toast = Core.toast('Importando ' + files.length + ' arquivo(s)...');
      let ok = 0, fail = 0;
      for (const f of files) {
        const kind = f.type.startsWith('image/') ? 'photo' : f.type.startsWith('video/') ? 'video' : null;
        if (!kind) { fail++; continue; }
        try {
          let thumb = null, width = null, height = null, durationMs = null;
          if (kind === 'photo') { const dims = await this.imgDims(f); width = dims.w; height = dims.h; thumb = await this.thumbFromImage(f); }
          else { const vd = await this.videoMeta(f).catch(() => null); if (vd) { width = vd.w; height = vd.h; durationMs = vd.durationMs; thumb = vd.thumb; } }
          await MediaStore.addMedia({ kind, mime: f.type, blob: f, thumbBlob: thumb, name: f.name, width, height, durationMs, source: 'import' });
          ok++;
        } catch (e) { fail++; }
      }
      Core.toast(`Importação concluída: ${ok} com sucesso${fail ? ', ' + fail + ' com falha' : ''}.`);
      this.paintGrid();
    });
    inp.click();
  },
  imgDims(file) { return new Promise((res, rej) => { const img = new Image(); const url = URL.createObjectURL(file); img.onload = () => { URL.revokeObjectURL(url); res({ w: img.naturalWidth, h: img.naturalHeight }); }; img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('imagem inválida')); }; img.src = url; }); },
  thumbFromImage(file) {
    return new Promise((res, rej) => {
      const img = new Image(); const url = URL.createObjectURL(file);
      img.onload = () => {
        const maxW = 320, scale = Math.min(1, maxW / img.naturalWidth);
        const c = document.createElement('canvas'); c.width = Math.max(1, img.naturalWidth * scale); c.height = Math.max(1, img.naturalHeight * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        c.toBlob(b => res(b), 'image/jpeg', 0.75);
      };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('imagem inválida')); };
      img.src = url;
    });
  },
  videoMeta(file) {
    return new Promise((res, rej) => {
      const v = document.createElement('video'); v.preload = 'metadata'; v.muted = true; const url = URL.createObjectURL(file);
      v.onloadedmetadata = () => {
        v.currentTime = Math.min(0.3, (v.duration || 1) / 4);
      };
      v.onseeked = () => {
        const c = document.createElement('canvas'); const maxW = 320, scale = Math.min(1, maxW / (v.videoWidth || 320));
        c.width = Math.max(1, (v.videoWidth || 320) * scale); c.height = Math.max(1, (v.videoHeight || 180) * scale);
        try { c.getContext('2d').drawImage(v, 0, 0, c.width, c.height); } catch (e) {}
        c.toBlob(b => { URL.revokeObjectURL(url); res({ w: v.videoWidth, h: v.videoHeight, durationMs: Math.round((v.duration || 0) * 1000), thumb: b }); }, 'image/jpeg', 0.75);
      };
      v.onerror = () => { URL.revokeObjectURL(url); rej(new Error('vídeo inválido')); };
      v.src = url;
    });
  },
  /* ---- Álbuns ---- */
  async renderAlbums() {
    this.view = 'albums'; const b = this.body;
    b.innerHTML = `<div class="gal-wrap"><div class="gal-topbar"><button class="gal-icon-btn jelly" id="ab-back">‹</button><span class="gal-title">Álbuns</span><button class="gal-icon-btn jelly" id="ab-new">➕</button></div><div class="alb-grid" id="ab-grid" style="margin-top:4px"></div></div>`;
    b.querySelector('#ab-back').addEventListener('click', () => { this.view = 'grid'; this.renderGrid(); });
    b.querySelector('#ab-new').addEventListener('click', () => this.createAlbumFlow());
    const grid = b.querySelector('#ab-grid');
    let albums; try { albums = await MediaStore.allAlbums(); } catch (e) { grid.innerHTML = `<div class="gal-empty">Erro: ${e.message}</div>`; return; }
    this.revokeAll();
    if (!albums.length) { grid.innerHTML = '<div class="gal-empty" style="grid-column:1/-1"><span class="ge-icon">🗂️</span><div>Nenhum álbum ainda.</div></div>'; return; }
    for (const a of albums) {
      let coverHtml = '🗂️';
      if (a.order && a.order.length) { const m = await MediaStore.getMedia(a.order[a.order.length - 1]); if (m) coverHtml = `<img src="${this.mkUrl(m.thumbBlob || m.blob)}">`; }
      const card = el(`<button class="alb-card jelly"><div class="alb-cover">${coverHtml}</div><div class="alb-meta"><div class="alb-name">${a.name.replace(/</g, '&lt;')}</div><div class="alb-count">${(a.order || []).length} item(ns)</div></div></button>`);
      card.addEventListener('click', () => this.openAlbum(a.id));
      card.addEventListener('contextmenu', (e) => { e.preventDefault(); this.albumMenu(a); });
      grid.appendChild(card);
    }
  },
  albumMenu(a) {
    FM.modal(a.name, '', [
      { label: 'Cancelar', onClick: (m) => m.remove() },
      { label: 'Renomear', onClick: (m) => { m.remove(); this.renameAlbumFlow(a); } },
      { label: 'Excluir álbum', primary: true, onClick: (m) => { m.remove(); this.deleteAlbumFlow(a); } }
    ]);
  },
  createAlbumFlow(addIds) {
    const bd = FM.modal('Novo álbum', '<input class="text-input" id="ab-name" placeholder="Nome do álbum" autofocus>', [
      { label: 'Cancelar', onClick: (m) => m.remove() },
      { label: 'Criar', primary: true, onClick: async (m) => {
        const name = (bd.querySelector('#ab-name').value || '').trim(); if (!name) return;
        try {
          const a = await MediaStore.createAlbum(name);
          if (addIds) { for (const id of addIds) await MediaStore.addToAlbum(id, a.id); this.selected.clear(); this.selectMode = false; }
          Core.toast('Álbum criado.'); m.remove();
          if (this.view === 'grid') this.paintGrid(); else this.renderAlbums();
        } catch (e) { Core.toast('Erro: ' + e.message); }
      } }
    ]);
  },
  renameAlbumFlow(a) {
    const bd = FM.modal('Renomear álbum', `<input class="text-input" id="ab-rn" value="${a.name.replace(/"/g, '&quot;')}" autofocus>`, [
      { label: 'Cancelar', onClick: (m) => m.remove() },
      { label: 'Salvar', primary: true, onClick: async (m) => { const name = (bd.querySelector('#ab-rn').value || '').trim(); if (!name) return; try { await MediaStore.renameAlbum(a.id, name); m.remove(); this.renderAlbums(); } catch (e) { Core.toast('Erro: ' + e.message); } } }
    ]);
  },
  deleteAlbumFlow(a) {
    FM.modal('Excluir álbum?', `<div class="card-sub" style="padding:4px 2px 10px">O álbum "${a.name.replace(/</g, '&lt;')}" será excluído. As mídias NÃO serão apagadas.</div>`, [
      { label: 'Cancelar', onClick: (m) => m.remove() },
      { label: 'Excluir', primary: true, onClick: async (m) => { try { await MediaStore.deleteAlbum(a.id); m.remove(); this.renderAlbums(); } catch (e) { Core.toast('Erro: ' + e.message); } } }
    ]);
  },
  openAlbum(id) { this.currentAlbum = id; this.filter = 'all'; this.renderGrid(); this.view = 'album'; },
  /* ---- Visualizador ---- */
  async openViewer(list, idx) {
    this.view = 'viewer'; this.viewerList = list; this.viewerIndex = idx;
    this.paintViewer();
  },
  closeViewer() { this.view = this.currentAlbum ? 'album' : 'grid'; const v = this.body.querySelector('.gv-wrap'); if (v) v.remove(); this.paintGrid(); },
  async paintViewer() {
    const old = this.body.querySelector('.gv-wrap'); if (old) old.remove();
    const m = this.viewerList[this.viewerIndex]; if (!m) { this.closeViewer(); return; }
    const url = this.mkUrl(m.blob);
    const wrap = el(`<div class="gv-wrap"></div>`);
    wrap.innerHTML = `
      <div class="gv-topbar"><button class="gal-icon-btn jelly" id="gv-back">‹</button><button class="gal-icon-btn jelly" id="gv-info">ⓘ</button></div>
      <div class="gv-stage" id="gv-stage"></div>
      <div class="gv-bottombar">
        <button class="gv-action-btn jelly" id="gv-fav"><span class="gvb-ic">${m.favorite ? '★' : '☆'}</span>Favorito</button>
        ${m.kind === 'photo' ? '<button class="gv-action-btn jelly" id="gv-edit"><span class="gvb-ic">✏️</span>Editar</button>' : ''}
        <button class="gv-action-btn jelly" id="gv-share"><span class="gvb-ic">⇧</span>Compartilhar</button>
        <button class="gv-action-btn jelly" id="gv-trash"><span class="gvb-ic">🗑️</span>${this.filter === 'trash' ? 'Restaurar' : 'Lixeira'}</button>
      </div>`;
    this.body.appendChild(wrap);
    const stage = wrap.querySelector('#gv-stage');
    if (m.kind === 'photo') { stage.innerHTML = `<img src="${url}" alt="">`; }
    else {
      stage.innerHTML = `<video src="${url}" playsinline></video><div class="gv-video-controls"><input type="range" id="gv-seek" min="0" max="100" value="0"><div class="gv-video-time"><span id="gv-cur">0:00</span><span id="gv-dur">0:00</span></div></div>`;
      const video = stage.querySelector('video'), seek = stage.querySelector('#gv-seek'), cur = stage.querySelector('#gv-cur'), dur = stage.querySelector('#gv-dur');
      stage.addEventListener('click', (e) => { if (e.target === video) { if (video.paused) video.play(); else video.pause(); } });
      video.addEventListener('loadedmetadata', () => { dur.textContent = fmtDur(video.duration * 1000); if (!isFinite(video.duration)) dur.textContent = ''; });
      video.addEventListener('timeupdate', () => { if (video.duration) { seek.value = (video.currentTime / video.duration) * 100; cur.textContent = fmtDur(video.currentTime * 1000); } });
      video.addEventListener('error', () => { stage.innerHTML = '<div class="cam-state-msg" style="color:#fff;padding:20px">Não foi possível reproduzir este vídeo — formato incompatível com este navegador.</div>'; });
      seek.addEventListener('input', () => { if (video.duration) video.currentTime = (seek.value / 100) * video.duration; });
    }
    let sx = 0;
    stage.addEventListener('pointerdown', (e) => { sx = e.clientX; });
    stage.addEventListener('pointerup', (e) => { const dx = e.clientX - sx; if (Math.abs(dx) > 70) { if (dx < 0 && this.viewerIndex < this.viewerList.length - 1) { this.viewerIndex++; this.paintViewer(); } else if (dx > 0 && this.viewerIndex > 0) { this.viewerIndex--; this.paintViewer(); } } });
    wrap.querySelector('#gv-back').addEventListener('click', () => this.closeViewer());
    wrap.querySelector('#gv-info').addEventListener('click', () => this.toggleInfo(wrap, m));
    wrap.querySelector('#gv-fav').addEventListener('click', async () => { try { await MediaStore.toggleFavorite(m.id); m.favorite = !m.favorite; this.paintViewer(); } catch (e) { Core.toast('Erro: ' + e.message); } });
    wrap.querySelector('#gv-share').addEventListener('click', () => this.shareMedia([m]));
    const editBtn = wrap.querySelector('#gv-edit'); if (editBtn) editBtn.addEventListener('click', () => this.openEditor(m));
    wrap.querySelector('#gv-trash').addEventListener('click', async () => {
      try {
        if (this.filter === 'trash') { await MediaStore.restoreMedia(m.id); Core.toast('Restaurado.'); }
        else { await MediaStore.trashMedia(m.id); Core.toast('Movido para a lixeira.'); }

      } catch (e) { Core.toast('Erro: ' + e.message); }
    });
  },
  toggleInfo(wrap, m) {
    let card = wrap.querySelector('.gv-info-card');
    if (card) { card.remove(); return; }
    const d = new Date(m.capturedAt || m.createdAt);
    card = el(`<div class="gv-info-card">
      <div><b>Nome:</b> ${(m.name || '—').replace(/</g, '&lt;')}</div>
      <div><b>Tipo:</b> ${m.mime}</div>

      ${m.durationMs ? `<div><b>Duração:</b> ${fmtDur(m.durationMs)}</div>` : ''}
      <div><b>Data:</b> ${d.toLocaleDateString('pt-BR')} ${d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</div>
      <div><b>Origem:</b> ${m.source === 'capture' ? 'Capturado na Lime Camera' : 'Importado'}</div>

function fmtDur(ms) { if (!isFinite(ms) || ms < 0) return '0:00'; const s = Math.round(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

/* =====================================================================
   LIMEOS 1.7 — Editor de imagens (canvas puro, sem dependências)
   Edição não-destrutiva até o momento de salvar: todos os ajustes
   ficam num estado separado e só viram um novo registro de mídia
   quando "Salvar cópia" é confirmado. O original nunca é tocado.
   ===================================================================== */

  startWatch(cb) {
    if (!Capability.has('geolocation')) return;
    this.stopWatch();
    this.watchId = navigator.geolocation.watchPosition(
      (pos) => { this.myPos = { lat: pos.coords.latitude, lon: pos.coords.longitude, heading: pos.coords.heading, speed: pos.coords.speed }; if (cb) cb(this.myPos); },
      (err) => { Core.toast('Perda de sinal de localização: ' + err.message); },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 }
    );
  },
  /* ---- geocoding real via Nominatim ---- */
  onSearchInput() {
    clearTimeout(this.searchTimer); const q = this.els.search.value.trim();
    this.body.querySelector('#mp-search-clear').style.display = q ? '' : 'none';
    if (!q) { this.closeResults(); return; }
    this.searchTimer = setTimeout(() => this.doSearch(q), 500); // debounce — respeita o limite de uso do serviço público
  },
  async doSearch(q) {
    this.els.results.style.display = ''; this.els.results.innerHTML = '<div class="map-result-row">Buscando…</div>';
    try {
      const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&q=${encodeURIComponent(q)}&limit=8&addressdetails=1`;
      const r = await fetch(url, { headers: { 'Accept-Language': 'pt-BR' } });
      if (!r.ok) throw new Error('Serviço de busca respondeu ' + r.status);
      const data = await r.json();
      this.paintResults(data);
    } catch (e) { this.els.results.innerHTML = `<div class="map-result-row">Erro na busca: ${e.message}. O serviço público de geocoding pode estar temporariamente indisponível.</div>`; }
  },
  paintResults(list) {
    this.els.results.innerHTML = '';
    if (!list.length) { this.els.results.innerHTML = '<div class="map-result-row">Nenhum resultado encontrado.</div>'; return; }
    list.forEach(item => {
      const row = el(`<button class="map-result-row jelly">${(item.display_name || '').split(',')[0]}<span class="mr-sub">${(item.display_name || '').replace(/</g, '&lt;')}</span></button>`);
      row.addEventListener('click', () => { this.selectPlace({ lat: +item.lat, lon: +item.lon, name: item.display_name }); });
      this.els.results.appendChild(row);
    });
  },
  closeResults() { this.els.results.style.display = 'none'; this.els.results.innerHTML = ''; },
  selectPlace(place) {
    this.closeResults(); this.markers = [{ lat: place.lat, lon: place.lon, name: place.name }];
    this.centerOn(place.lat, place.lon, 16);
    this.openPlaceSheet(place);
  },
  openPlaceSheet(place) {
    this.els.sheetHost.innerHTML = '';
    const parts = (place.name || '').split(','); const title = parts[0], sub = parts.slice(1).join(',').trim();
    const sheet = el(`<div class="map-sheet"><div class="ms-title">${title.replace(/</g, '&lt;')}</div>${sub ? `<div class="ms-sub">${sub.replace(/</g, '&lt;')}</div>` : ''}<div class="map-sheet-actions"><button class="btn jelly" id="ms-close">Fechar</button><button class="btn primary jelly" id="ms-route">Rotas</button></div></div>`);
    sheet.querySelector('#ms-close').addEventListener('click', () => this.closeSheet());
    sheet.querySelector('#ms-route').addEventListener('click', () => this.planRoute(place));
    this.els.sheetHost.appendChild(sheet);
  },
  closeSheet() { this.els.sheetHost.innerHTML = ''; this.markers = []; this.render(); },
  /* ---- rotas reais via OSRM ---- */
  async planRoute(dest) {
    if (!this.myPos) { Core.toast('Obtendo sua localização para calcular a rota...'); this.locateMe(false); await new Promise(r => setTimeout(r, 1200)); if (!this.myPos) { Core.toast('Não foi possível obter sua localização para traçar a rota.'); return; } }
    this.routeDest = dest; this.routeProfile = this.routeProfile || 'driving';
    await this.fetchRoute();
  },
  async fetchRoute() {
    this.els.sheetHost.innerHTML = '<div class="map-sheet"><div class="ms-title">Calculando rota…</div></div>';
    try {
      const o = this.myPos, d = this.routeDest;
      const url = `https://router.project-osrm.org/route/v1/${this.routeProfile}/${o.lon},${o.lat};${d.lon},${d.lat}?overview=full&geometries=polyline&steps=true`;
      const r = await fetch(url);
      if (!r.ok) throw new Error('Serviço de rotas respondeu ' + r.status);
      const data = await r.json();
      if (data.code !== 'Ok' || !data.routes || !data.routes.length) throw new Error(data.message || 'Nenhuma rota encontrada entre os pontos.');
      const rt = data.routes[0];
      const coords = MapMath.decodePolyline(rt.geometry, 5);
      const steps = (rt.legs[0] && rt.legs[0].steps) || [];
      this.route = { coords, distanceM: rt.distance, durationS: rt.duration, steps, profile: this.routeProfile };
      this.markers = [{ lat: d.lat, lon: d.lon, name: d.name }];
      this.fitRouteView();
      this.render();
      this.openRouteSheet();
    } catch (e) {
      this.els.sheetHost.innerHTML = `<div class="map-sheet"><div class="ms-title">Não foi possível calcular a rota</div><div class="ms-sub">${e.message}. O serviço público de rotas pode estar temporariamente indisponível ou sem cobertura para este trajeto.</div><div class="map-sheet-actions"><button class="btn jelly" id="ms-close">Fechar</button></div></div>`;
      this.els.sheetHost.querySelector('#ms-close').addEventListener('click', () => this.closeSheet());
    }
  },
  fitRouteView() { if (!this.route || !this.route.coords.length) return; const mid = this.route.coords[Math.floor(this.route.coords.length / 2)]; this.centerOn(mid[0], mid[1], 14); },
  clearRoute() { this.route = null; this.routeDest = null; this.markers = []; this.closeSheet(); },
  openRouteSheet() {
    const rt = this.route; this.els.sheetHost.innerHTML = '';
    const km = (rt.distanceM / 1000).toFixed(rt.distanceM < 10000 ? 1 : 0);
    const mins = Math.round(rt.durationS / 60);
    const sheet = el(`<div class="map-route-summary">
      <div class="map-profile-row" id="mrs-profiles"></div>
      <div class="mrs-stats"><div class="mrs-stat"><b>${km} km</b><span>Distância</span></div><div class="mrs-stat"><b>${mins} min</b><span>Tempo estimado</span></div></div>
      <div class="map-sheet-actions"><button class="btn jelly" id="mrs-cancel">Cancelar</button><button class="btn primary jelly" id="mrs-start">Iniciar navegação</button></div>
    </div>`);
    const profiles = [['driving', '🚗 Carro'], ['cycling', '🚲 Bicicleta'], ['walking', '🚶 A pé']];
    const prow = sheet.querySelector('#mrs-profiles');
    profiles.forEach(([k, label]) => { const b = el(`<button class="map-profile-btn jelly ${this.routeProfile === k ? 'active' : ''}">${label}</button>`); b.addEventListener('click', async () => { this.routeProfile = k; await this.fetchRoute(); }); prow.appendChild(b); });
    sheet.querySelector('#mrs-cancel').addEventListener('click', () => this.clearRoute());
    sheet.querySelector('#mrs-start').addEventListener('click', () => this.startNav());
    this.els.sheetHost.appendChild(sheet);
  },
  /* ---- navegação passo a passo real ---- */
  startNav() {
    if (!this.route || !this.route.steps.length) { Core.toast('Não há instruções de navegação para esta rota.'); return; }
    this.nav = { stepIdx: 0 };
    this.els.sheetHost.innerHTML = '';
    const wrap = el('<div class="map-nav-wrap"></div>');
    wrap.innerHTML = `<div class="map-nav-banner" id="mnv-banner"></div><div class="map-nav-map" id="mnv-map"></div><div class="map-nav-bottom"><div class="mnbo-eta"><b id="mnv-eta">—</b><span>chegada estimada</span></div><button class="btn primary jelly map-nav-stop" id="mnv-stop">Encerrar</button></div>`;
    this.body.appendChild(wrap); this.navWrap = wrap;
    wrap.querySelector('#mnv-stop').addEventListener('click', () => this.stopNav());
    this.paintNavStep();
    this.startWatch((pos) => this.onNavPosition(pos));
  },
  stepIcon(maneuver) {
    const t = (maneuver && maneuver.type) || '', m = (maneuver && maneuver.modifier) || '';
    if (t === 'arrive') return '🏁'; if (t === 'depart') return '⬆️';
    if (m.includes('left')) return '⬅️'; if (m.includes('right')) return '➡️';
    if (t === 'roundabout') return '🔄'; return '⬆️';
  },
  stepText(step) {
    const m = step.maneuver || {}; const name = step.name ? ` em ${step.name}` : '';
    if (m.type === 'depart') return 'Siga em frente' + name;
    if (m.type === 'arrive') return 'Você chegou ao destino';
    if (m.type === 'roundabout') return 'Entre na rotatória' + name;
    const mod = m.modifier || '';
    if (mod.includes('left')) return 'Vire à esquerda' + name;
    if (mod.includes('right')) return 'Vire à direita' + name;
    return 'Continue' + name;
  },
  paintNavStep() {
    if (!this.navWrap) return;
    const rt = this.route, step = rt.steps[this.nav.stepIdx]; if (!step) { this.stopNav(); return; }
    const banner = this.navWrap.querySelector('#mnv-banner');
    banner.innerHTML = `<span class="mnb-icon">${this.stepIcon(step.maneuver)}</span><div><div class="mnb-instr">${this.stepText(step)}</div><div class="mnb-dist">${Math.round(step.distance)} m</div></div>`;
    const remainingS = rt.steps.slice(this.nav.stepIdx).reduce((s, x) => s + x.duration, 0);
    const eta = new Date(Date.now() + remainingS * 1000);
    this.navWrap.querySelector('#mnv-eta').textContent = eta.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    const mapHost = this.navWrap.querySelector('#mnv-map'); if (mapHost && !mapHost.contains(this.els.viewport)) mapHost.appendChild(this.body.querySelector('.map-viewport'));
    if (this.myPos) this.centerOn(this.myPos.lat, this.myPos.lon, 17);
  },
  onNavPosition(pos) {
    if (!this.nav) return;
    const step = this.route.steps[this.nav.stepIdx]; if (!step) return;
    const end = step.maneuver.location; // [lon, lat]
    const distToStepEnd = MapMath.distanceMeters(pos.lat, pos.lon, end[1], end[0]);
    if (distToStepEnd < 30 && this.nav.stepIdx < this.route.steps.length - 1) { this.nav.stepIdx++; this.paintNavStep(); }
    else { this.centerOn(pos.lat, pos.lon); this.render(); }
    // fora da rota (bem distante de todos os pontos conhecidos): avisa, sem recalcular automaticamente para não gastar o serviço público em excesso
    const minDist = Math.min(...this.route.coords.map(([lat, lon]) => MapMath.distanceMeters(pos.lat, pos.lon, lat, lon)));
    if (minDist > 150 && !this.nav.offRouteWarned) { this.nav.offRouteWarned = true; Core.toast('Você parece ter saído da rota. Toque em "Rotas" novamente para recalcular.'); }
  },
  stopNav(skipRender) {
    this.stopWatch();
    if (this.navWrap) { const mapHost = this.navWrap.querySelector('#mnv-map'); if (mapHost && mapHost.contains(this.els.viewport)) this.els.viewport.remove(); this.navWrap.remove(); this.navWrap = null; }
    this.nav = null;
    if (!this.els.viewport.parentNode) this.body.querySelector('.map-wrap').insertBefore(this.els.viewport, this.body.querySelector('.map-attribution'));
    if (!skipRender) { this.closeSheet(); } else { this.render(); }
  }
};

Apps.tester = { build(body) {
  body.innerHTML = '<div class="app-title">Tester</div><div class="set-body" style="padding-top:0"></div>'; const b = body.querySelector('.set-body');
  const sec = (title, cmds) => { const s = el(`<div class="tester-sec"><h3>${title}</h3></div>`); cmds.forEach(([label, fn, ok]) => { const x = el(`<button class="btn jelly" ${ok === false ? 'disabled style="opacity:.4"' : ''}>${label}${ok === false ? ' (indisponível)' : ''}</button>`); if (ok !== false) x.addEventListener('click', () => { try { fn(); } catch (e) { Core.toast('Erro: ' + e.message); } }); s.appendChild(x); }); b.appendChild(s); };

  /* ---- Seção nova: diagnóstico real padronizado, execução manual ---- */
  const diagSec = el(`<div class="tester-sec"><h3>Diagnóstico do sistema</h3>
    <div class="tr-suite-head"><button class="btn primary jelly" id="diag-run">Rodar diagnóstico</button><span class="tr-suite-summary" id="diag-summary"></span></div>
    <div id="diag-results"></div></div>`);
  b.appendChild(diagSec);
  const badgeLabel = { pass: 'Aprovado', fail: 'Falhou', unavailable: 'Indisponível', notested: 'Não testado' };
  diagSec.querySelector('#diag-run').addEventListener('click', async () => {
    const btn = diagSec.querySelector('#diag-run'); btn.textContent = 'Rodando…'; btn.disabled = true;
    const results = await Diag.run();
    btn.textContent = 'Rodar diagnóstico'; btn.disabled = false;
    const list = diagSec.querySelector('#diag-results'); list.innerHTML = '';
    const counts = { pass: 0, fail: 0, unavailable: 0 };
    results.forEach(r => {
      counts[r.result] = (counts[r.result] || 0) + 1;
      const row = el(`<div class="tr-result-row">
        <span class="tr-result-badge ${r.result}">${badgeLabel[r.result] || r.result}</span>
        <div class="tr-result-main"><div class="tr-result-name">${r.name}</div><div class="tr-result-desc">${r.what}</div>${r.detail ? `<div class="tr-result-detail">${r.detail}</div>` : ''}${r.limitation ? `<div class="tr-result-detail">⚠️ ${r.limitation}</div>` : ''}</div>
      </div>`);
      list.appendChild(row);
    });
    diagSec.querySelector('#diag-summary').textContent = `${counts.pass || 0} aprovado(s) · ${counts.fail || 0} falhou(aram) · ${counts.unavailable || 0} indisponível(is)`;
  });

  const flip = (k) => () => { const p = { [k]: !State.v[k] }; if (k === 'airplane' && p.airplane) { p.wifi = false; p.data = false; } State.set(p); Core.toast(`${k}: ${State.v[k] ? 'ligado' : 'desligado'} (estado interno)`); };
  const demoWp = () => { const c = document.createElement('canvas'); c.width = 540; c.height = 960; const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 540, 960); gr.addColorStop(0, '#2d5a27'); gr.addColorStop(.6, '#D9C94A'); gr.addColorStop(1, '#1b3a16'); g.fillStyle = gr; g.fillRect(0, 0, 540, 960); return c.toDataURL('image/jpeg', .8); };
  sec('Notificações', [
    ['Gerar notificação falsa', () => Notif.push({ app: 'Tester', appId: 'tester', glyph: '🧪', title: 'Notificação de teste', text: 'Gerada pelo Tester.' })],
    ['Gerar 3 notificações', () => ['settings', 'clock', 'about'].forEach(id => Notif.push({ app: APPS[id].name, appId: id, glyph: APPS[id].glyph, title: 'Teste ' + APPS[id].name, text: 'Notificação de teste.' }))],
    ['Alerta máximo', () => Notif.push({ app: 'Tester', appId: 'tester', glyph: '⚠️', title: 'ALERTA MÁXIMO', text: 'Notificação de prioridade máxima (teste).', max: true })],
    ['Limpar notificações', () => Notif.clear()]
  ]);
  sec('Painéis', [['Abrir Central de Notificações', () => Panels.show('notif')], ['Abrir Central de Controle', () => Panels.show('control')], ['Fechar painéis', () => Panels.closeAll()]]);
  sec('Lock Screen e PIN', [['Bloquear o LimeOS', () => Lock.enter()], ['Testar PIN (abrir tela de PIN)', () => { Lock.enter(); setTimeout(() => Lock.toPin(), 250); }], ['Retornar à Lock Screen', () => Lock.enter()]]);
  sec('Estados internos', [['Alternar Wi-Fi', flip('wifi')], ['Alternar dados móveis', flip('data')], ['Alternar modo avião', flip('airplane')], ['Alternar localização', flip('location')], ['Alternar economia de bateria (visual)', flip('saver')],
    ['Alternar bloqueio de orientação', () => { const v = !State.v.rotationLock; CC.rotation(v); State.set({ rotationLock: v }); }, Capability.has('orientation')], ['Estado da bateria visual', () => Core.toast('Folha no ícone: ' + (State.v.saver ? 'sim' : 'não'))]]);
  sec('Animações e Liquid Jelly', [
    ['Jelly rápido (neste botão)', () => {}], ['Jelly longo (neste botão)', () => {}],
    ['Testar animação do botão Home', () => { Nav.touch(); Core.toast('Home: círculo → casa por ~15 s'); }]
  ]);
  const jb = b.querySelectorAll('.tester-sec')[4].querySelectorAll('.btn'); jb[0].addEventListener('click', () => Shell.jelly(jb[0], false)); jb[1].addEventListener('click', () => Shell.jelly(jb[1], true));
  sec('Navegação, apps e multitarefa', [
    ['Abrir Relógio', () => App.open('clock')], ['Abrir Música', () => App.open('music')],
    ['Abrir 3 apps e a multitarefa', () => { ['clock', 'music', 'files'].forEach(id => App.open(id)); Nav.touch(); setTimeout(() => Recents.open(), 600); }],
    ['Voltar para a Home', () => App.home()]
  ]);
  sec('Sons e vibração', [['Som do sistema', () => { if (!Sound.beep('system')) Core.toast(UNAVAILABLE); }], ['Som de notificação', () => { if (!Sound.beep('notif')) Core.toast(UNAVAILABLE); }], ['Vibrar', () => navigator.vibrate(200), Capability.has('vibration')]]);
  sec('Wallpapers', [['Aplicar wallpaper de teste (ambos)', () => Wallpaper.apply(demoWp(), 'both')], ['Remover wallpapers', () => { Storage.del('wp.home'); Storage.del('wp.lock'); Shell.applyWallpapers(); Core.emit('wallpaper'); Core.toast('Wallpapers removidos.'); }]]);
  const cap = el('<div class="tester-sec"><h3>Capability Layer</h3><div class="card"></div></div>'); const cc = cap.querySelector('.card');
  Object.keys(Capability.labels).forEach(k => cc.appendChild(el(`<div class="cap-row"><span>${Capability.labels[k]}</span><span class="${Capability.has(k) ? 'cap-yes' : 'cap-no'}">${Capability.has(k) ? 'Disponível' : 'Indisponível'}</span></div>`))); b.appendChild(cap);
} };

/* ---------- Inicialização ---------- */
document.addEventListener('DOMContentLoaded', async () => {
  Capability.detect(); await Auth.init(); Shell.applyPrefs(); Shell.applyWallpapers();
  Lock.bind(); Pin.bind(); Home.bind(); Nav.bind(); Recents.bind(); Panels.bind(); Shell.bindJelly(); ScreenTimeout.bind();
  SplitView.bind(); AppPicker.bind();
  WidgetHome.load(); WidgetHome.render(); WidgetHome.bindEntry();
  StatusBar.update(); StatusBar.battery(); Notif.render(); BatteryWidget.init();
  if (State.v.lockStyle === 'filme') { LockStyle.apply(); WeatherWidget.run().then(() => LockStyle.apply()); }
  if (!Storage.get('firstRun', false)) Storage.set('firstRun', true); // primeira execução: estado mínimo já criado
  if (Capability.has('serviceWorker')) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  Boot.start();
});
</script>
