const DEFAULT_ORDER = ['settings', 'clock', 'camera', 'gallery', 'maps', 'music', 'files', 'ai', 'appstore', 'tester', 'about'];
/* App Store: apps que só entram na Home depois de "instalados" (nunca forçados pelo sanitize) */
const STORE_APP_IDS = Object.keys(APPS).filter(id => APPS[id].store);

/* ---------- Home: grade de apps + dock opcional, organizável ---------- */
const Home = {
  order: Storage.get('home.order', DEFAULT_ORDER.slice()),
  dockApps: Storage.get('home.dock', []),
  drag: null,
  save() { Storage.set('home.order', this.order); Storage.set('home.dock', this.dockApps); },
  sanitize() {
    const installed = AppStore.installed();
    this.order = this.order.filter(id => APPS[id] && !this.dockApps.includes(id) && (!STORE_APP_IDS.includes(id) || installed.includes(id)));
    DEFAULT_ORDER.forEach(id => { if (!this.order.includes(id) && !this.dockApps.includes(id)) this.order.push(id); });
  },
  icon(id) {
    const a = APPS[id], b = document.createElement('button');
    b.className = 'app-icon icon-in'; b.dataset.app = id;
    b.innerHTML = `<span class="app-icon-glyph">${a.glyph}</span><span class="app-icon-label">${a.name}</span>`;
    return b;
  },
  render(animate = true) {
    this.sanitize();
    const grid = $('app-grid'), dock = $('dock'), mode = State.v.dock;
    grid.innerHTML = ''; dock.innerHTML = '';
    this.order.forEach((id, i) => { const el = this.icon(id); if (animate) { el.classList.remove('icon-in'); el.style.animationDelay = (i * 0.07) + 's'; void el.offsetWidth; el.classList.add('icon-in'); } grid.appendChild(el); });
    const on = mode === 'bottom' || mode === 'side';
    dock.classList.toggle('show', on); dock.classList.toggle('side', mode === 'side');
    if (on) { this.dockApps.forEach(id => dock.appendChild(this.icon(id))); if (this.dockApps.length < 4) { const s = document.createElement('div'); s.className = 'dock-slot'; dock.appendChild(s); } }
  },
  bind() {
    const root = $('screen-home');
    root.addEventListener('pointerdown', (e) => {
      const ic = e.target.closest('.app-icon'); if (!ic) return;
      this.drag = { id: ic.dataset.app, el: ic, x: e.clientX, y: e.clientY, moved: false, on: false, ghost: null, pid: e.pointerId };
      this.drag.timer = setTimeout(() => this.startDrag(), 450);
    });
    window.addEventListener('pointermove', (e) => {
      const d = this.drag; if (!d) return;
      if (Math.hypot(e.clientX - d.x, e.clientY - d.y) > 8) { d.moved = true; if (!d.on) clearTimeout(d.timer); }
      if (d.on && d.ghost) { d.ghost.style.left = (e.clientX - 29) + 'px'; d.ghost.style.top = (e.clientY - 29) + 'px'; }
    });
    window.addEventListener('pointerup', (e) => this.endDrag(e));
    window.addEventListener('pointercancel', (e) => this.endDrag(e, true));
  },
  startDrag() {
    const d = this.drag; if (!d) return; d.on = true;
    const g = d.el.querySelector('.app-icon-glyph').cloneNode(true);
    g.style.cssText = `position:fixed;z-index:960;left:${d.x - 29}px;top:${d.y - 29}px;pointer-events:none;transform:scale(1.15);box-shadow:0 10px 24px rgba(0,0,0,.5)`;
    document.body.appendChild(g); d.ghost = g; d.el.style.opacity = '.3';
    if (Capability.has('vibration') && State.v.vibrate) try { navigator.vibrate(12); } catch (_) {}
  },
  endDrag(e, cancel) {
    const d = this.drag; if (!d) return; this.drag = null; clearTimeout(d.timer);
    if (d.ghost) d.ghost.remove(); d.el.style.opacity = '';
    if (cancel) return;
    if (!d.on) { if (!d.moved) App.open(d.id, d.el.querySelector('.app-icon-glyph').getBoundingClientRect()); return; }
    const t = document.elementFromPoint(e.clientX, e.clientY); if (!t) return;
    const inDock = t.closest('#dock'), tgtIcon = t.closest('.app-icon'), inGrid = t.closest('#app-grid') || t.closest('.home-content');
    const id = d.id;
    this.order = this.order.filter(x => x !== id); this.dockApps = this.dockApps.filter(x => x !== id);
    if (inDock && $('dock').classList.contains('show')) {
      const at = tgtIcon && this.dockApps.indexOf(tgtIcon.dataset.app); if (this.dockApps.length < 5) this.dockApps.splice(at >= 0 && at !== null ? at : this.dockApps.length, 0, id); else this.order.push(id);
    } else {
      const at = tgtIcon ? this.order.indexOf(tgtIcon.dataset.app) : -1; if (at >= 0) this.order.splice(at, 0, id); else this.order.push(id);
    }
    this.save(); this.render(false);
  }
};

/* =====================================================================
   LIMEOS 1.6 — Sistema de Widgets da Home
   Arquitetura em camadas, conforme pedido na spec (seção 13):
   - WidgetTypes: catálogo/contrato de cada tipo (render/onTap/onConfigure/size)
   - WidgetHome: grid (4 colunas), layout confirmado + rascunho, persistência
   - WidgetEdit: modo de edição (entrar/adicionar/mover/redimensionar/remover/confirmar/cancelar)
   Tudo persiste via Storage (localStorage), reaproveitando o wrapper já existente.
   ===================================================================== */

/* Contrato de um tipo de widget (registrado em WidgetTypes.register):
   {
     id, name, glyph, desc,
     minW, minH, maxW, maxH, defaultW, defaultH,   // em células da grade (col/row)
     available(): bool — false => "widget indisponível", nunca finge sucesso
     render(cellEl, inst): preenche cellEl.querySelector('.w-body') com o conteúdo real
     onTap(inst): ação principal ao toque normal (ex.: abrir o app)
     onShow(inst)/onHide(inst): ciclo de vida opcional quando entra/saí da tela
     configure(inst): opcional — abre um menu de configuração específico do widget
   }
*/
const WidgetTypes = {
  _reg: {},
  register(def) { this._reg[def.id] = def; },
  get(id) { return this._reg[id]; },
  all() { return Object.values(this._reg); }
};

const WidgetHome = {
  COLS: 4,
  KEY_LAYOUT: 'widgets.layout',       // disposição confirmada: [{id, type, x, y, w, h, cfg}]
  KEY_DRAFT: 'widgets.draft',         // rascunho da sessão de edição em andamento (ou null)
  editing: false,
  layout: [],      // disposição atualmente exibida (confirmada OU rascunho, durante edição)
  confirmed: [],   // última disposição confirmada (cópia separada, para "Cancelar")
  liveTimers: [],  // intervals dos widgets ativos (ex.: relógio), limpos a cada render

  load() {
    this.confirmed = Storage.get(this.KEY_LAYOUT, []);
    const draft = Storage.get(this.KEY_DRAFT, null);
    if (draft && Array.isArray(draft)) {
      // Recuperação de rascunho pendente: entra direto no modo de edição com o rascunho carregado
      // (decisão explícita do usuário — sem perguntar).
      this.layout = draft.map(w => Object.assign({}, w));
      this.editing = true;
    } else {
      this.layout = this.confirmed.map(w => Object.assign({}, w));
      this.editing = false;
    }
  },
  uid() { return 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); },

  saveDraft() { Storage.set(this.KEY_DRAFT, this.layout); },
  saveConfirmed() {
    this.confirmed = this.layout.map(w => Object.assign({}, w));
    Storage.set(this.KEY_LAYOUT, this.confirmed);
    Storage.del(this.KEY_DRAFT);
  },

  /* ---- Edição ---- */
  enterEdit() {
    this.editing = true;
    // ao entrar manualmente (não por recuperação), parte sempre da disposição confirmada
    if (!Storage.get(this.KEY_DRAFT, null)) this.layout = this.confirmed.map(w => Object.assign({}, w));
    this.saveDraft();
    this.render();
  },
  cancelEdit() {
    if (!this.hasUnconfirmedChanges()) { this.exitEditDiscard(); return; }
    this._openDiscardModal();
  },
  hasUnconfirmedChanges() {
    const a = JSON.stringify(this.layout.map(w => ({ id: w.id, type: w.type, x: w.x, y: w.y, w: w.w, h: w.h, cfg: w.cfg })).sort((p, q) => p.id < q.id ? -1 : 1));
    const b = JSON.stringify(this.confirmed.map(w => ({ id: w.id, type: w.type, x: w.x, y: w.y, w: w.w, h: w.h, cfg: w.cfg })).sort((p, q) => p.id < q.id ? -1 : 1));
    return a !== b;
  },
  _openDiscardModal() {
    FM.modal('Descartar alterações?', `<div class="card-sub" style="padding:4px 2px 10px">Você tem mudanças não confirmadas nos widgets. O que deseja fazer?</div>`, [
      { label: 'Continuar editando', onClick: (m) => m.remove() },
      { label: 'Descartar', primary: true, onClick: (m) => { m.remove(); this.exitEditDiscard(); } }
    ]);
  },
  exitEditDiscard() {
    this.layout = this.confirmed.map(w => Object.assign({}, w));
    Storage.del(this.KEY_DRAFT);
    this.editing = false;
    this.render();
  },
  confirmEdit() {
    // valida: nenhum widget fora da grade, nenhuma dimensão inválida
    this.layout.forEach(w => this._clampToGrid(w));
    this.resolveCollisions();
    this.saveConfirmed();
    this.editing = false;
    this.render();
    Core.toast('Widgets atualizados.');
  },

  /* ---- Adicionar / remover ---- */
  addWidget(typeId) {
    const def = WidgetTypes.get(typeId); if (!def) return;
    const w = def.defaultW || 2, h = def.defaultH || 1;
    const pos = this._findFreeSpot(w, h);
    const inst = { id: this.uid(), type: typeId, x: pos.x, y: pos.y, w, h, cfg: {} };
    this.layout.push(inst);
    this.saveDraft();
    this.render();
  },
  removeWidget(id) {
    // Remove só o widget/atalho da Home — nunca apaga dados do app de origem (notas, música, etc.)
    this.layout = this.layout.filter(w => w.id !== id);
    this.saveDraft();
    this.render();
  },

  /* ---- Posicionamento em grade ---- */
  _occupies(w) { const cells = []; for (let dy = 0; dy < w.h; dy++) for (let dx = 0; dx < w.w; dx++) cells.push((w.y + dy) * this.COLS + (w.x + dx)); return cells; },
  _overlaps(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; },
  _clampToGrid(w) {
    w.w = Math.max(1, Math.min(w.w, this.COLS));
    w.x = Math.max(0, Math.min(w.x, this.COLS - w.w));
    w.y = Math.max(0, w.y);
    w.h = Math.max(1, w.h);
  },
  _findFreeSpot(w, h) {
    for (let y = 0; y < 60; y++) {
      for (let x = 0; x <= this.COLS - w; x++) {
        const cand = { x, y, w, h };
        if (!this.layout.some(o => this._overlaps(cand, o))) return { x, y };
      }
    }
    return { x: 0, y: this._maxY() + 1 };
  },
  _maxY() { return this.layout.reduce((m, w) => Math.max(m, w.y + w.h - 1), -1); },
  /* Resolve colisões movendo apenas os widgets realmente afetados para o espaço livre mais próximo,
     preservando a posição dos demais (regra explícita da seção 6.3). */
  resolveCollisions(movedId) {
    const moved = this.layout.find(w => w.id === movedId) || null;
    const order = moved ? [moved].concat(this.layout.filter(w => w !== moved)) : this.layout.slice();
    const placed = [];
    order.forEach(w => {
      this._clampToGrid(w);
      let tries = 0;
      while (placed.some(p => this._overlaps(w, p)) && tries < 200) {
        w.y += 1; // empurra para baixo até achar espaço livre mais próximo na coluna atual
        if (w.x + w.w > this.COLS) w.x = Math.max(0, this.COLS - w.w);
        tries++;
      }
      placed.push(w);
    });
  },

  /* ---- Render ---- */
  render() {
    this.liveTimers.forEach(t => clearInterval(t)); this.liveTimers = [];
    const board = $('widget-board'), bar = $('widget-edit-bar');
    if (!board) return;
    board.innerHTML = '';
    board.classList.toggle('wb-empty', !this.editing && this.layout.length === 0);
    board.classList.toggle('editing', this.editing);
    bar.classList.toggle('show', this.editing);
    $('navbar').classList.toggle('wb-editing-hide', this.editing); // a barra de edição ocupa o espaço da navbar
    this.layout.forEach(inst => {
      const def = WidgetTypes.get(inst.type);
      const cell = document.createElement('div'); cell.className = 'widget-cell jelly'; cell.dataset.id = inst.id;
      cell.style.gridColumn = `${inst.x + 1} / span ${inst.w}`;
      cell.style.gridRow = `${inst.y + 1} / span ${inst.h}`;
      const body = document.createElement('div'); body.className = 'w-body'; cell.appendChild(body);
      if (!def) {
        body.innerHTML = '<div class="w-unavail">Widget indisponível</div>';
      } else if (def.available && !def.available()) {
        body.innerHTML = `<div class="w-unavail">${def.name} indisponível</div>`;
      } else {
        try { def.render(body, inst); } catch (e) { body.innerHTML = '<div class="w-unavail">Erro ao carregar widget</div>'; }
      }
      if (this.editing) {
        const rm = document.createElement('button'); rm.className = 'w-remove'; rm.textContent = '✕';
        rm.addEventListener('click', (e) => { e.stopPropagation(); this.removeWidget(inst.id); });
        cell.appendChild(rm);
        ['se', 'e', 's'].forEach(dir => { const h = document.createElement('div'); h.className = 'w-resize-handle rh-' + dir; h.dataset.dir = dir; cell.appendChild(h); });
        this._bindDrag(cell, inst);
      } else {
        cell.addEventListener('click', () => { if (def && def.onTap) def.onTap(inst); });
      }
      board.appendChild(cell);
    });
    if (this.editing) this.saveDraft();
  },

  /* ---- Arraste (mover) e redimensionamento via ponteiro, com snap em células ---- */
  _cellMetrics() {
    const board = $('widget-board'); const r = board.getBoundingClientRect();
    const style = getComputedStyle(board);
    const gap = parseFloat(style.gap || style.columnGap || '10') || 10;
    const colW = (r.width - gap * (this.COLS - 1)) / this.COLS;
    const rowH = 76 + gap; // mesmo valor de grid-auto-rows definido em CSS
    return { left: r.left, top: r.top, colW, gap, rowH };
  },
  _bindDrag(cell, inst) {
    let mode = null, startX = 0, startY = 0, orig = null, m = null, moved = false;
    const onDown = (e) => {
      if (e.target.closest('.w-remove')) return;
      const handle = e.target.closest('.w-resize-handle');
      mode = handle ? 'resize' : 'move';
      cell.dataset.dir = handle ? handle.dataset.dir : '';
      startX = e.clientX; startY = e.clientY; orig = Object.assign({}, inst); m = WidgetHome._cellMetrics(); moved = false;
      e.target.setPointerCapture && e.target.setPointerCapture(e.pointerId);
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
    };
    const onMove = (e) => {
      const dx = e.clientX - startX, dy = e.clientY - startY;
      if (!moved && Math.hypot(dx, dy) > 6) { moved = true; cell.classList.add('w-dragging'); }
      if (!moved) return; // toque simples (sem arraste real) — deixa o clique do widget acontecer normalmente
      if (mode === 'move') {
        const nx = Math.round(orig.x + dx / (m.colW + m.gap));
        const ny = Math.round(orig.y + dy / m.rowH);
        inst.x = Math.max(0, Math.min(nx, WidgetHome.COLS - inst.w));
        inst.y = Math.max(0, ny);
      } else {
        const dir = cell.dataset.dir;
        let nw = orig.w, nh = orig.h;
        if (dir === 'se' || dir === 'e') nw = Math.round(orig.w + dx / (m.colW + m.gap));
        if (dir === 'se' || dir === 's') nh = Math.round(orig.h + dy / m.rowH);
        const def = WidgetTypes.get(inst.type) || {};
        nw = Math.max(def.minW || 1, Math.min(nw, Math.min(def.maxW || WidgetHome.COLS, WidgetHome.COLS - orig.x)));
        nh = Math.max(def.minH || 1, Math.min(nh, def.maxH || 6));
        inst.w = nw; inst.h = nh;
      }
      cell.style.gridColumn = `${inst.x + 1} / span ${inst.w}`;
      cell.style.gridRow = `${inst.y + 1} / span ${inst.h}`;
    };
    const onUp = () => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      if (!moved) return; // toque simples: nada a persistir, e não re-renderiza (deixa o clique do widget prosseguir)
      cell.classList.remove('w-dragging');
      WidgetHome._clampToGrid(inst);
      WidgetHome.resolveCollisions(inst.id);
      WidgetHome.saveDraft();
      WidgetHome.render();
    };
    cell.addEventListener('pointerdown', onDown);
  },

  bindEntry() {
    // Pressionar e segurar um espaço vazio da Home → modo de edição
    const root = document.querySelector('#screen-home .home-content');
    let timer = null, moved = false, sx = 0, sy = 0;
    const start = (e) => {
      if (this.editing) return;
      if (e.target.closest('.app-icon') || e.target.closest('.widget-cell') || e.target.closest('#dock')) return;
      moved = false; sx = e.clientX; sy = e.clientY;
      timer = setTimeout(() => { if (!moved) this.enterEdit(); }, 550);
    };
    const move = (e) => { if (Math.hypot(e.clientX - sx, e.clientY - sy) > 8) { moved = true; clearTimeout(timer); } };
    const cancel = () => clearTimeout(timer);
    root.addEventListener('pointerdown', start);
    root.addEventListener('pointerup', cancel);
    root.addEventListener('pointercancel', cancel);
    root.addEventListener('pointermove', move);
    $('we-cancel').addEventListener('click', () => this.cancelEdit());
    $('we-done').addEventListener('click', () => this.confirmEdit());
    $('we-add').addEventListener('click', () => WidgetPicker.open());
  }
};

/* ---------- Seletor de widgets (adicionar) ---------- */
const WidgetPicker = {
  open() {
    const sheet = el(`<div class="widget-picker"><div class="widget-picker-sheet">
      <div class="widget-picker-head"><span>Adicionar widget</span><button class="set-back jelly" id="wp-close">✕</button></div>
      <div class="widget-picker-list" id="wp-list"></div>
    </div></div>`);
    document.body.appendChild(sheet);
    const list = sheet.querySelector('#wp-list');
    WidgetTypes.all().forEach(def => {
      const avail = !def.available || def.available();
      const it = el(`<button class="wp-item jelly ${avail ? '' : 'disabled'}"><span class="wpi-glyph">${def.glyph}</span><span class="wpi-text"><div class="wpi-name">${def.name}</div><div class="wpi-desc">${avail ? def.desc : def.desc + ' (indisponível agora)'}</div></span></button>`);
      if (avail) it.addEventListener('click', () => { WidgetHome.addWidget(def.id); this.close(sheet); });
      list.appendChild(it);
    });
    sheet.querySelector('#wp-close').addEventListener('click', () => this.close(sheet));
    requestAnimationFrame(() => sheet.classList.add('open'));
  },
  close(sheet) { sheet.classList.remove('open'); setTimeout(() => sheet.remove(), 280); }
};

/* =====================================================================
   LIMEOS 1.6 — Tipos de widget (catálogo inicial, seção 4.1-4.8 da spec)
   Cada widget reaproveita dados/funções reais dos apps já existentes.
   Nenhum widget finge estar disponível quando a integração real não existe.
   ===================================================================== */

/* ---- 1. Relógio ---- */
WidgetTypes.register({
  id: 'clock', name: 'Relógio', glyph: '🕐', desc: 'Hora atual, atualizada em tempo real.',
  minW: 1, minH: 1, maxW: 2, maxH: 2, defaultW: 2, defaultH: 1,
  render(body, inst) {
    const paint = () => {
      const d = new Date();
      const hh = String(d.getHours()).padStart(2, '0'), mm = String(d.getMinutes()).padStart(2, '0');
      const big = inst.w >= 2 || inst.h >= 2;
      body.innerHTML = `<div class="w-clock-time" style="${big ? '' : 'font-size:18px'}">${hh}:${mm}</div><div class="w-clock-date">${d.toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: 'short' })}</div>`;
    };
    paint();
    const t = setInterval(paint, 1000 * 15); // atualização leve; o relógio não precisa de tique por segundo na Home
    WidgetHome.liveTimers.push(t);
  },
  onTap() { App.open('clock'); }
});

/* ---- 2. Data e calendário ---- */
WidgetTypes.register({
  id: 'date', name: 'Data', glyph: '📅', desc: 'Data atual (sem grade de calendário ou eventos).',
  minW: 1, minH: 1, maxW: 2, maxH: 1, defaultW: 2, defaultH: 1,
  render(body) {
    const paint = () => {
      const d = new Date();
      body.innerHTML = `<div class="w-date-weekday">${d.toLocaleDateString('pt-BR', { weekday: 'long' })}</div><div class="w-date-full">${d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'long' })}</div>`;
    };
    paint();
    // reagenda para a próxima meia-noite e então a cada 24h
    const msToMidnight = new Date(new Date().setHours(24, 0, 5, 0)) - new Date();
    const t1 = setTimeout(() => { paint(); const t2 = setInterval(paint, 86400000); WidgetHome.liveTimers.push(t2); }, Math.max(1000, msToMidnight));
    WidgetHome.liveTimers.push(t1);
  },
  onTap() { App.open('clock'); }
});

/* ---- 3. Atalhos de aplicativos ---- */
WidgetTypes.register({
  id: 'shortcut', name: 'Atalho de app', glyph: '🚀', desc: 'Abre um app existente da LimeOS.',
  minW: 1, minH: 1, maxW: 2, maxH: 1, defaultW: 1, defaultH: 1,
  render(body, inst) {
    const appId = inst.cfg && inst.cfg.appId;
    const a = appId && APPS[appId];
    if (!a || (STORE_APP_IDS.includes(appId) && !AppStore.isInstalled(appId))) {
      body.innerHTML = '<div class="w-unavail">Escolha um app</div>';
      body.classList.add('w-shortcut');
      body.addEventListener('click', (e) => { e.stopPropagation(); if (WidgetHome.editing) ShortcutPicker.open(inst); }, { once: true });
      return;
    }
    body.classList.add('w-shortcut');
    body.innerHTML = `<span class="ws-glyph">${a.glyph}</span>${inst.w > 1 || inst.h > 1 ? `<span class="ws-name">${a.name}</span>` : ''}`;
    if (WidgetHome.editing) body.addEventListener('click', (e) => { e.stopPropagation(); ShortcutPicker.open(inst); });
  },
  onTap(inst) { const appId = inst.cfg && inst.cfg.appId; if (appId && APPS[appId]) App.open(appId); else Core.toast('Nenhum app escolhido para este atalho ainda.'); },
  configure(inst) { ShortcutPicker.open(inst); }
});
const ShortcutPicker = {
  open(inst) {
    const choices = Home.order.concat(Home.dockApps).filter(id => APPS[id]);
    const list = choices.map(id => `<button class="wp-item jelly" data-id="${id}"><span class="wpi-glyph">${APPS[id].glyph}</span><span class="wpi-text"><div class="wpi-name">${APPS[id].name}</div></span></button>`).join('');
    const bd = FM.modal('Escolher app', `<div class="widget-picker-list" style="max-height:50vh;overflow-y:auto;padding:0">${list || '<div class="card-sub">Nenhum app disponível.</div>'}</div>`, [{ label: 'Cancelar', onClick: (m) => m.remove() }]);
    bd.querySelectorAll('[data-id]').forEach(btn => btn.addEventListener('click', () => { inst.cfg = Object.assign({}, inst.cfg, { appId: btn.dataset.id }); bd.remove(); WidgetHome.saveDraft(); WidgetHome.render(); }));
  }
};

WidgetTypes.register({
  id: 'notes', name: 'Notas', glyph: '🗒️', desc: 'Mostra suas notas mais recentes (Lime Notes).',
  minW: 2, minH: 1, maxW: 4, maxH: 3, defaultW: 2, defaultH: 2,
  available() { return AppStore.isInstalled('notes'); },
  render(body, inst) {
    const list = Storage.get('notes.list', []);
    const sorted = Array.isArray(list) ? list.slice().sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)) : [];

  },
  onTap() { App.open('notes'); }
});

/* ---- 6. Controles de música ---- */
WidgetTypes.register({
  id: 'music', name: 'Música', glyph: '🎵', desc: 'Controla a reprodução do Lime Música.',
  minW: 2, minH: 1, maxW: 4, maxH: 2, defaultW: 2, defaultH: 1,
  available() { return AppStore ? true : true; }, // sempre presente (app fixo); disponibilidade real é por faixa carregada
  render(body) {
    if (!Capability.has('indexedDB')) { body.innerHTML = '<div class="w-unavail">Música indisponível neste navegador</div>'; return; }
    if (!Music15.audio) { Music15.audio = new Audio(); Music15.bindAudioEvents(); }
    const paint = () => {
      if (!body.isConnected) return; // célula foi removida/re-renderizada — não toca em nó desconectado
      const hasTrack = Music15.current >= 0 && Music15.queue[Music15.current];
      body.innerHTML = `
        <div class="w-music-track">${hasTrack ? Music15.queue[Music15.current].name : 'Nenhuma faixa'}</div>
        <div class="w-music-sub">${hasTrack ? (Music15.audio.paused ? 'Pausado' : 'Tocando') : (Music15.queue.length ? Music15.queue.length + ' faixa(s) disponíveis' : 'Sem arquivos de áudio')}</div>
        <div class="w-music-controls">
          <button class="w-music-btn jelly" data-act="prev">⏮️</button>
          <button class="w-music-btn jelly" data-act="play">${hasTrack && !Music15.audio.paused ? '⏸️' : '▶️'}</button>
          <button class="w-music-btn jelly" data-act="next">⏭️</button>
        </div>`;
      body.querySelectorAll('[data-act]').forEach(btn => btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const act = btn.dataset.act;
        if (act === 'play') Music15.toggle(); else if (act === 'next') Music15.next(); else Music15.prev();
        setTimeout(paint, 60);
      }));
    };
    if (!Music15.queue.length) Music15.loadQueue().then(paint); else paint();
    const onTick = () => paint();
    // remove o listener assim que a célula sai de cena (re-render/remoção do widget), evitando acúmulo
    Music15.audio.addEventListener('play', onTick); Music15.audio.addEventListener('pause', onTick);
    const stop = new MutationObserver(() => { if (!body.isConnected) { Music15.audio.removeEventListener('play', onTick); Music15.audio.removeEventListener('pause', onTick); stop.disconnect(); } });
    stop.observe($('widget-board'), { childList: true, subtree: true });
  },
  onTap() { App.open('music'); }
});

/* ---- 7. Widgets fornecidos por aplicativos compatíveis ----
   Contrato de extensão: um app registra seu próprio widget chamando
   AppWidgetProviders.register(appId, { id, name, glyph, desc, minW, minH, defaultW, defaultH, render, onTap }).
   Nenhum app atual implementa isso ainda — é só a arquitetura de extensão,
   conforme pedido na spec (seção 4.8/13). Não há widgets fictícios aqui. */
const AppWidgetProviders = {
  _byApp: {},
  register(appId, def) {
    this._byApp[appId] = def;
    WidgetTypes.register(Object.assign({}, def, {
      id: 'app:' + appId,
      available: () => AppStore_isUsable(appId) && (!def.available || def.available()),
      onTap: def.onTap || (() => App.open(appId))
    }));
  },
  listForApp(appId) { return this._byApp[appId] || null; }
};
function AppStore_isUsable(appId) {
  if (!APPS[appId]) return false;
  return !STORE_APP_IDS.includes(appId) || AppStore.isInstalled(appId);
}

/* ---------- Apps: janelas, pilha de apps abertos (multitarefa) ---------- */
/* =====================================================================
   LIMEOS 1.6 — Motor de animação Liquid Jelly (continuidade de origem)
   Anima a expansão/colapso real de uma app-window a partir do retângulo
   de um ícone de origem (Home, Recents, atalho de widget), usando a Web
   Animations API para ter controle total sobre o estado final.
   Respeita 3 modos (seção 9): 'full' (Completas), 'reduced' (Reduzidas),
   'off' (Desativadas — troca instantânea total, sem nenhuma transição).
   Fila determinística: uma única transição corre por vez em cada
   elemento-alvo; uma nova ação cancela a anterior e aplica seu estado
   final antes de iniciar (nunca deixa dois estados concorrentes). */
const AnimEngine = {
  _running: new WeakMap(), // elemento → Animation em curso
  _gen: new WeakMap(),     // elemento → geração atual (evita que um finish() tardio desfaça uma ação mais nova)

  mode() { return (State && State.v && State.v.animMode) || 'full'; },

  /* Garante que qualquer animação anterior nesse elemento termine num estado válido antes de seguir. */
  _settle(elm) {
    const running = this._running.get(elm);
    if (running) { try { running.finish(); } catch (e) {} this._running.delete(elm); }
  },
  _bump(elm) { const g = (this._gen.get(elm) || 0) + 1; this._gen.set(elm, g); return g; },

  /* Expande `winEl` a partir de `fromRect` (ou do centro, se não houver origem válida) até ocupar toda a área do app. */
  openFrom(winEl, fromRect) {
    this._settle(winEl);
    const gen = this._bump(winEl);
    const mode = this.mode();
    winEl.classList.add('open');
    if (mode === 'off' || !fromRect || !fromRect.width) { winEl.style.transform = ''; winEl.style.opacity = ''; return; }
    const to = winEl.getBoundingClientRect();
    // depois de 'open' aplicado, to já é a área final cheia (CSS garante isso via inset:0 do .app-window)
    const sx = Math.max(.02, fromRect.width / to.width), sy = Math.max(.02, fromRect.height / to.height);
    const dx = (fromRect.left + fromRect.width / 2) - (to.left + to.width / 2);
    const dy = (fromRect.top + fromRect.height / 2) - (to.top + to.height / 2);
    const dur = mode === 'reduced' ? 180 : 340;
    const anim = winEl.animate([
      { transform: `translate(${dx}px,${dy}px) scale(${sx},${sy})`, opacity: .85, borderRadius: '28px' },
      { transform: 'translate(0,0) scale(1,1)', opacity: 1, borderRadius: '0px' }
    ], { duration: dur, easing: 'cubic-bezier(.22,.61,.36,1)' });
    this._running.set(winEl, anim);
    // só limpa o transform/estado se nenhuma ação mais nova assumiu este elemento nesse meio-tempo
    // (ex.: SplitView remontando a mesma janela antes da animação de abertura anterior terminar).
    anim.onfinish = anim.oncancel = () => { if (this._gen.get(winEl) === gen) { winEl.style.transform = ''; this._running.delete(winEl); } };
  },

  /* Anima o colapso de `winEl` de volta ao retângulo de origem (ou um fade simples, sem origem válida),
     chamando `onDone` só depois que o estado final visual é alcançado — nunca antes. */
  closeTo(winEl, toRect, onDone) {
    this._settle(winEl);
    const gen = this._bump(winEl);
    const mode = this.mode();
    if (mode === 'off') { winEl.classList.remove('open'); winEl.style.transform = ''; if (onDone) onDone(); return; }
    const from = winEl.getBoundingClientRect();
    const dur = mode === 'reduced' ? 150 : 300;
    let anim;
    if (toRect && toRect.width) {
      const sx = Math.max(.02, toRect.width / from.width), sy = Math.max(.02, toRect.height / from.height);
      const dx = (toRect.left + toRect.width / 2) - (from.left + from.width / 2);
      const dy = (toRect.top + toRect.height / 2) - (from.top + from.height / 2);
      anim = winEl.animate([
        { transform: 'translate(0,0) scale(1,1)', opacity: 1 },
        { transform: `translate(${dx}px,${dy}px) scale(${sx},${sy})`, opacity: .4 }
      ], { duration: dur, easing: 'cubic-bezier(.4,0,.2,1)' });
    } else {
      anim = winEl.animate([{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(.92)' }], { duration: dur, easing: 'ease-in' });
    }
    this._running.set(winEl, anim);
    // Idem: se o elemento já foi reivindicado por uma ação mais nova (reaberto, remontado no split, etc.),
    // este finish tardio não deve mexer em .open/transform — quem assumiu por último decide o estado final.
    const finish = () => { if (this._gen.get(winEl) === gen) { winEl.classList.remove('open'); winEl.style.transform = ''; this._running.delete(winEl); } if (onDone) onDone(); };
    anim.onfinish = finish; anim.oncancel = finish;
  },

  /* Transição simples entre duas telas inteiras (Home ⇄ Recents, por ex.) respeitando o modo. */
  crossFade(elm, show) {
    this._settle(elm);
    if (this.mode() === 'off') return; // mudança de classe .active já é instantânea via CSS
    const anim = elm.animate(show ? [{ opacity: 0 }, { opacity: 1 }] : [{ opacity: 1 }, { opacity: 0 }], { duration: this.mode() === 'reduced' ? 90 : 180, easing: 'ease' });
    this._running.set(elm, anim);
  }
};

const App = {
  openId: null, stack: [], built: {}, splashMs: 1000, backHooks: {}, originRect: {},
  win(id) {
    let w = $('app-' + id);
    if (!w) {
      w = document.createElement('section'); w.id = 'app-' + id; w.className = 'app-window';
      w.innerHTML = `<div class="app-splash"><span class="app-splash-glyph">${APPS[id].glyph}</span></div><div class="app-body" id="body-${id}"></div>`;
      $('app-layer').appendChild(w);
    }
    return w;
  },
  /* Monta o conteúdo do app sem o fluxo de splash/abertura em tela cheia — usado pela tela dividida,
     que precisa de duas janelas "vivas" ao mesmo tempo, sem a animação de abertura única do open(). */
  ensureBuilt(id) {
    if (!APPS[id]) return;
    this.win(id);
    if (!this.stack.includes(id)) this.stack = [id].concat(this.stack);
    if (!this.built[id]) { this.built[id] = true; const fn = Apps[id]; if (fn) fn.build($('body-' + id), $('app-' + id)); }
    if (Apps[id] && Apps[id].onShow) Apps[id].onShow();
  },
  /* Abre `id` com continuidade visual a partir de `rect` (retângulo real do ícone tocado — Home, Recents
     ou atalho de widget). Sem origem válida, usa um fade/scale a partir do centro (fallback). Se já havia
     outro app aberto, a troca conta como "alternância entre apps abertos" (seção 8.4): a janela anterior
     recolhe para a sua própria origem conhecida (ou para o centro) enquanto a nova expande — sem reiniciar
     o app anterior nem descartar sua navegação interna, que continua viva na pilha. */
  open(id, rect) {
    if (!APPS[id]) return;
    const w = this.win(id), fresh = !this.stack.includes(id);
    const prevId = this.openId;
    if (rect) this.originRect[id] = { left: rect.left, top: rect.top, width: rect.width, height: rect.height };
    if (prevId && prevId !== id) { const o = $('app-' + prevId); AnimEngine.closeTo(o, this.originRect[prevId] || null); }
    this.stack = [id].concat(this.stack.filter(x => x !== id)); this.openId = id;
    const sp = w.querySelector('.app-splash');
    if (fresh) { // novo lançamento: monta o conteúdo e mostra splash 1s (como na v0.3)
      this.built[id] = false; $('body-' + id).innerHTML = '';
      sp.classList.remove('hidden'); const g = sp.querySelector('.app-splash-glyph'); g.style.animation = 'none'; void g.offsetWidth; g.style.animation = '';
      setTimeout(() => sp.classList.add('hidden'), this.splashMs);
    } else sp.classList.add('hidden');
    if (!this.built[id]) { this.built[id] = true; const fn = Apps[id]; if (fn) fn.build($('body-' + id), w); }
    if (Apps[id] && Apps[id].onShow) Apps[id].onShow();
    void w.offsetWidth;
    AnimEngine.openFrom(w, rect || this.originRect[id] || null);
    Shell.chromeFor(Shell.current); Nav.touch();
    if (Shell.current === 'screen-recents') Shell.show('screen-home');
  },
  home() { // app → Home (continua aberto em segundo plano) — recolhe para a origem conhecida, se houver
    if (this.openId) { const w = $('app-' + this.openId); AnimEngine.closeTo(w, this.originRect[this.openId] || null); }
    this.openId = null; Shell.show('screen-home'); Nav.touch();
  },
  close(id) { // encerra o app — o estado (built/onClose) é liberado já na hora; só o colapso visual é animado
    const w = $('app-' + id);
    if (w) {
      this.built[id] = false; const b = $('body-' + id); if (Apps[id] && Apps[id].onClose) Apps[id].onClose();
      // a limpeza do HTML em si pode esperar o fim da animação (puramente visual), mas o ESTADO lógico
      // (built=false, onClose já chamado) já está liberado antes de qualquer App.open subsequente rodar —
      // uma reabertura rápida nunca encontra um estado "built" obsoleto esperando a animação terminar.
      // Se o app for reaberto antes dessa limpeza visual rodar, built[id] já estará true outra vez — a
      // limpeza tardia então não apaga nada (confere built[id] continua false antes de agir).
      AnimEngine.closeTo(w, this.originRect[id] || null, () => { if (b && !this.built[id]) b.innerHTML = ''; });
    }
    this.stack = this.stack.filter(x => x !== id); if (this.openId === id) this.openId = null;
    delete this.originRect[id];
  },
  closeAll() { this.stack.slice().forEach(id => this.close(id)); this.openId = null; Nav.refreshMinis(); },
  closeAllInstant() {
    const prevMode = State.v.animMode; State.v.animMode = 'off'; // força troca instantânea sem decoração, mesmo nos outros modos
    document.querySelectorAll('.app-window').forEach(w => { w.style.transition = 'none'; });
    this.closeAll();
    setTimeout(() => { document.querySelectorAll('.app-window').forEach(w => { w.style.transition = ''; }); State.v.animMode = prevMode; }, 60);
  },
  back() { // botão Voltar dentro do app: sub-tela primeiro; senão fecha o app
    const id = this.openId; if (!id) return;
    if (Apps[id] && Apps[id].back && Apps[id].back()) return;
    this.close(id); Shell.show('screen-home'); Nav.refreshMinis();
  }
};

/* ---------- App Store: instala/desinstala os apps opcionais (calculator, notes, modules, browser, lifeos) ----------
   Convenção de chaves por app (usada aqui para apagar os dados reais ao desinstalar — decisão explícita do usuário):
   - calculator: não persiste nada (estado efêmero, nenhuma chave a apagar).
   - notes: 'notes.list' (array de notas; anexos ficam embutidos nos próprios objetos da nota, então uma única chave).
   - modules: 'modules.cfg' (reservada; hoje não há módulos reais, pode não existir).
   - browser: 'browser.history' (histórico de navegação, se o usuário optar por persistir).
   - lifeos: nenhuma chave própria do LimeOS — o LifeOS guarda seus próprios dados DENTRO do iframe (origem derivada
     do srcdoc), fora do localStorage do LimeOS. Desinstalar o app no LimeOS remove o app da Home; os dados do
     LifeOS em si não são tocados por este Storage.del (eles não estão sob o prefixo 'limeos.').
*/
const AppStore = {
  KEY: 'appstore.installed',
  DATA_KEYS: { calculator: [], notes: ['notes.list'], modules: ['modules.cfg'], browser: ['browser.history'], lifeos: [] }, // Lime Camera/Gallery são apps nativos desde a 1.7.1 (não aparecem na App Store, não têm chave aqui)
  installed() { const l = Storage.get(this.KEY, []); return Array.isArray(l) ? l : []; },
  isInstalled(id) { return this.installed().includes(id); },
  install(id) {
    if (!STORE_APP_IDS.includes(id) || this.isInstalled(id)) return;
    const list = this.installed(); list.push(id); Storage.set(this.KEY, list);
    if (!Home.order.includes(id) && !Home.dockApps.includes(id)) Home.order.push(id);
    Home.save(); Home.render(false); Core.emit('appstore'); Core.toast(`${APPS[id].name} instalado.`);
  },
  uninstall(id) {
    if (!this.isInstalled(id)) return;
    const list = this.installed().filter(x => x !== id); Storage.set(this.KEY, list);
    Home.order = Home.order.filter(x => x !== id); Home.dockApps = Home.dockApps.filter(x => x !== id);
    Home.save();
    if (App.stack.includes(id)) App.close(id);
    (this.DATA_KEYS[id] || []).forEach(k => Storage.del(k));
    // Remove atalhos desse app dos widgets (confirmado e rascunho), sem apagar nenhum outro widget/dado.
    if (typeof WidgetHome !== 'undefined') {
      const cleaned = (arr) => arr.filter(w => !(w.type === 'shortcut' && w.cfg && w.cfg.appId === id));
      WidgetHome.confirmed = cleaned(WidgetHome.confirmed); Storage.set(WidgetHome.KEY_LAYOUT, WidgetHome.confirmed);
      WidgetHome.layout = cleaned(WidgetHome.layout);
      if (WidgetHome.editing) WidgetHome.saveDraft();
      WidgetHome.render();
    }
    Home.render(false); Core.emit('appstore'); Core.toast(`${APPS[id].name} desinstalado. Dados do app apagados.`);
  }
};

/* ---------- Navegação por três botões ---------- */
const Nav = {
  ctxTimer: null, CTX_MS: 15000,
  touch() { // interação → formas contextuais por ~15 s
    $('nav-home').classList.add('ctx'); this.refreshMinis(); $('nav-recents').classList.toggle('ctx', App.stack.length > 0);
    clearTimeout(this.ctxTimer); this.ctxTimer = setTimeout(() => this.rest(), this.CTX_MS);
  },
  rest() { $('nav-home').classList.remove('ctx'); $('nav-recents').classList.remove('ctx'); },
  refreshMinis() {
    const box = $('nav-minis'); box.innerHTML = '';
    App.stack.slice(0, 3).forEach(id => { const m = document.createElement('span'); m.className = 'nav-mini'; m.dataset.app = id; m.innerHTML = `<span>${APPS[id].glyph}</span><span>${APPS[id].name}</span>`; box.appendChild(m); });
    if (!App.stack.length) $('nav-recents').classList.remove('ctx');
  },
  bind() {
    $('nav-home').addEventListener('click', () => {
      Panels.closeAll();
      if (Shell.current === 'screen-split') { Shell.show('screen-home'); this.touch(); return; } // split minimiza (ambos continuam vivos em 2º plano)
      if (Shell.current === 'screen-recents') { Recents.close(); }
      if (App.openId) App.home(); else { Shell.show('screen-home'); this.touch(); }
    });
    $('nav-recents').addEventListener('click', () => { Panels.closeAll(); this.touch(); if (Shell.current === 'screen-recents') Recents.close(); else Recents.open(); });
    $('nav-back').addEventListener('click', () => {
      if (Panels.anyOpen()) { Panels.closeAll(); return; }
      if (Shell.current === 'screen-split') { Shell.show('screen-home'); this.touch(); return; }
      if (Shell.current === 'screen-recents') { Recents.close(); return; }
      if (App.openId) App.back(); this.touch();
    });
    document.addEventListener('focusin', (e) => { if (e.target.matches('input,textarea')) $('nav-back-arrow').classList.add('kb'); });
    document.addEventListener('focusout', () => { setTimeout(() => { if (!document.activeElement || !document.activeElement.matches('input,textarea')) $('nav-back-arrow').classList.remove('kb'); }, 50); });
  }
};

/* ---------- Gerenciador de apps recentes ---------- */
const Recents = {
  focus: 0, prev: 'screen-home', cards: [], dragX: null, dragY: null, dragging: false,
  longPressTimer: null, liftedCard: null, liftId: null, splitPending: null,
  /* cartões "entidade": ou {kind:'app', id} ou {kind:'split', a, b} quando o par dividido existe */
  entities() {
    if (SplitView.appA && SplitView.appB) {
      const rest = App.stack.filter(id => id !== SplitView.appA && id !== SplitView.appB);
      return [{ kind: 'split', a: SplitView.appA, b: SplitView.appB }].concat(rest.map(id => ({ kind: 'app', id })));
    }
    return App.stack.map(id => ({ kind: 'app', id }));
  },
  open() {
    this.prev = Shell.current; this.focus = 0; this.build();
    const minis = Array.from($('nav-minis').children).map(m => m.getBoundingClientRect());
    const useFlip = $('nav-recents').classList.contains('ctx') && minis.length;
    Shell.show('screen-recents'); this.layout(true);
    this.cards.forEach((c, i) => { // as pequenas representações crescem e viram os cartões

  close() { Shell.show(this.prev === 'screen-recents' ? 'screen-home' : this.prev); if (!App.openId && !SplitView.active && this.prev !== 'screen-home') Shell.show('screen-home'); Nav.touch(); },
  build() {

    ents.forEach((ent) => {

  layout(instant) { // cartões empilhados como papéis

  closeCtxMenu() { const m = document.querySelector('.rec-card-ctx'); if (m) m.remove(); },
  openCtxMenu(cardEl, id) {
    this.closeCtxMenu();
    const menu = el(`<div class="rec-card-ctx glass"><button data-act="split">🪟 Abrir em tela dividida</button></div>`);
    cardEl.appendChild(menu);
    menu.querySelector('[data-act="split"]').addEventListener('click', (e) => {

  showDropzones(show) {

  },
  bind() {
    const t = $('rec-track');
    t.addEventListener('click', (e) => { // Método A: botão "⋯" de um cartão individual
      const btn = e.target.closest('.rec-card-menu-btn'); if (!btn) return;
      e.stopPropagation(); const card = btn.closest('.rec-card'); this.openCtxMenu(card, card.dataset.app);

      const card = e.target.closest('.rec-card'); this.pdCard = (card && !card.dataset.split) ? card : null;

    });
    window.addEventListener('pointermove', (e) => {
      if (this.dragX === null) return; const dx = e.clientX - this.dragX, dy = e.clientY - this.dragY;

      if (!this.dragging) return;

      if (this.pdCard && !this.liftId && Math.abs(dy) > 46 && Math.abs(dy) > Math.abs(dx)) {
        this.liftId = this.pdCard.dataset.app; this.pdCard.classList.add('dragging-split'); this.showDropzones(true);
      }

        const p = SplitView.isPortrait();
        const zone1 = document.querySelector('.dz-1'), zone2 = document.querySelector('.dz-2');
        const hit = (zoneEl) => { const r = zoneEl.getBoundingClientRect(); return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom; };
        [zone1, zone2].forEach(z => z.classList.toggle('dz-hover', hit(z)));

  },
  pick(id) { // o escolhido vira ativo; os demais voltam à representação reduzida

/* =====================================================================
   TELA DIVIDIDA (1.4) — SplitView
   Reaproveita as mesmas .app-window já criadas por App.win()/App.open():
   ao entrar em split, as janelas são realocadas (reparented) para dentro
   dos painéis; ao sair, voltam para #app-layer. Nenhum componente,
   estado ou sistema de navegação é duplicado.
   ===================================================================== */
const SplitView = {
  active: false, appA: null, appB: null, ratio: 0.5, prevScreen: 'screen-home',
  MIN_RATIO: 0.2, MAX_RATIO: 0.8,
  isPortrait() { return matchMedia('(orientation: portrait)').matches; },
  slotEl(slot) { return $(slot === 'a' ? 'split-pane-a' : 'split-pane-b'); },
  appOf(slot) { return slot === 'a' ? this.appA : this.appB; },

  /* ---- entrar / montar ---- */
  activate(idA, idB) {
    if (!APPS[idA] || !APPS[idB] || idA === idB) return;
    this.prevScreen = (Shell.current === 'screen-split') ? this.prevScreen : Shell.current;
    if (App.openId && App.openId !== idA && App.openId !== idB) { const o = $('app-' + App.openId); if (o) o.classList.remove('open'); }
    this.appA = idA; this.appB = idB; this.ratio = 0.5;
    App.openId = null; // nenhum app ocupa a tela cheia enquanto o split está ativo
    this._mount('a', idA); this._mount('b', idB);
    this.active = true;
    Shell.show('screen-split'); this._applyOrientation(); this._applyRatio();
    Nav.touch();
  },
  _mount(slot, id) {
    App.ensureBuilt(id);
    const w = $('app-' + id), pane = this.slotEl(slot);
    AnimEngine._bump(w); AnimEngine._running.delete(w); // esta montagem decide o estado final: invalida qualquer animação de abrir/fechar pendente sobre a mesma janela
    w.style.transform = ''; w.classList.add('in-split', 'open'); w.classList.remove('hidden-bg');
    pane.innerHTML = ''; pane.appendChild(w);
    const sp = w.querySelector('.app-splash'); if (sp) sp.classList.add('hidden');
  },
  _unmount(slot) {
    const id = this.appOf(slot); if (!id) return;
    const w = $('app-' + id); if (w) { AnimEngine._bump(w); AnimEngine._running.delete(w); w.classList.remove('in-split', 'open'); $('app-layer').appendChild(w); }
  },

  /* ---- trocar um app de um painel, mantendo o outro vivo ---- */
  swap(slot, newId) {
    if (!newId || !APPS[newId]) return;
    const otherSlot = slot === 'a' ? 'b' : 'a', otherId = this.appOf(otherSlot);
    if (newId === otherId) return;
    this._unmount(slot);
    if (slot === 'a') this.appA = newId; else this.appB = newId;
    this._mount(slot, newId);
  },

  /* ---- sair do split ---- */
  exit(keepId) {
    if (!this.active) return;
    const a = this.appA, b = this.appB;
    this._unmount('a'); this._unmount('b');
    this.active = false; this.appA = null; this.appB = null;
    Shell.show('screen-home');
    if (keepId) App.open(keepId); else { App.openId = null; Nav.touch(); }
  },
  closeBoth() {
    const a = this.appA, b = this.appB; this.active = false;
    [a, b].forEach(id => { if (id) { this._unmount(id === a ? 'a' : 'b'); App.close(id); } });
    this.appA = null; this.appB = null; Shell.show('screen-home'); Nav.refreshMinis();
  },

  /* ---- orientação / layout ---- */
  _applyOrientation() {
    const p = this.isPortrait(), scr = $('screen-split');
    scr.classList.toggle('portrait', p); scr.classList.toggle('landscape', !p);
  },
  onOrientationChange() { if (this.active) { this._applyOrientation(); this._applyRatio(); } },
  _applyRatio() {
    const pct = Math.round(this.ratio * 100);
    $('split-pane-a').style.flexBasis = `calc(${pct}% - 9px)`;
    $('split-pane-b').style.flexBasis = `calc(${100 - pct}% - 9px)`;
  },

  /* ---- divisor redimensionável (só CSS flex-basis durante o arraste) ---- */
  bindDivider() {
    const dv = $('split-divider'); let dragging = false, startPos = 0, startRatio = 0.5, full = 1;
    const posOf = (e) => this.isPortrait() ? e.clientY : e.clientX;
    dv.addEventListener('pointerdown', (e) => {
      if (!this.active) return; dragging = true; startPos = posOf(e); startRatio = this.ratio;

  /* ---- botões de ação dentro do split ---- */
  bind() {
    this.bindDivider();
    $('split-exit').addEventListener('click', () => { Core.toast('Tela dividida encerrada.'); this.exit(this.appA); });
    $('split-swap-a').addEventListener('click', () => AppPicker.open(this.appB, (id) => this.swap('a', id)));
    $('split-swap-b').addEventListener('click', () => AppPicker.open(this.appA, (id) => this.swap('b', id)));
    matchMedia('(orientation: portrait)').addEventListener('change', () => this.onOrientationChange());
  }
};

/* ---------- Seletor de app (2º app do split / trocar um dos lados) ---------- */

/* =====================================================================
   NOTIFICAÇÕES · STATUS BAR · PAINÉIS · CENTRAL DE CONTROLE
   ===================================================================== */
const Notif = {
  items: [], seq: 0,
  push(o) {
    if (!State.v.notifAllow) return false;
    const n = Object.assign({ id: ++this.seq, app: 'LimeOS', title: 'Notificação', text: '', glyph: '🔔', max: false, time: Date.now() }, o);
    if (n.appId && State.v.notifBlocked && State.v.notifBlocked[n.appId]) return false;
    this.items.unshift(n); this.render();
    if (n.max) { Core.toast('⚠️ ' + n.title); if (Capability.has('vibration') && State.v.vibrate) try { navigator.vibrate([200, 100, 200, 100, 400]); } catch (e) {} }
    return true;
  },
  clear() { this.items = []; this.render(); },
  render() {
    const list = $('notif-list'); list.innerHTML = '';

    this.items.forEach(n => {
      const c = document.createElement('div'); c.className = 'notif-card glass' + (n.max ? ' max' : '');
      const t = new Date(n.time).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      c.innerHTML = `<div class="notif-ico">${n.glyph}</div><div><div class="notif-app">${n.app} · ${t}</div><div class="notif-title">${n.title}</div><div class="notif-text">${n.text}</div></div>`;

/* ---------- Painéis: puxar a status bar (esquerda = notificações, direita = controle) ---------- */
const Panels = {
  open: null, drag: null,
  el(k) { return k === 'notif' ? $('panel-notif') : $('panel-control'); },
  anyOpen() { return !!this.open; },
  setProgress(k, p) { // p: 0..1 — o blur aumenta progressivamente
    const el = this.el(k), bd = $('panel-backdrop'); p = Math.max(0, Math.min(1, p));
    el.style.transform = `translateY(${-(1 - p) * 105}%)`;
    bd.style.opacity = String(p); const b = (p * 22).toFixed(1) + 'px'; bd.style.backdropFilter = `blur(${b})`; bd.style.webkitBackdropFilter = `blur(${b})`;
  },
  show(k) {
    const el = this.el(k); if (this.open && this.open !== k) this.hide(this.open, true);
    el.classList.add('settling', 'on'); $('panel-backdrop').classList.add('on'); this.open = k;
    $('panel-backdrop').style.transition = 'opacity .35s ease, backdrop-filter .35s ease, -webkit-backdrop-filter .35s ease';
    this.setProgress(k, 1);
    if (k === 'control') CC.render();
  },
  hide(k, instant) {
    const el = this.el(k); el.classList.toggle('settling', !instant); this.setProgress(k, 0);
    el.classList.remove('on'); if (this.open === k) { this.open = null; $('panel-backdrop').classList.remove('on'); }
    if (!instant) setTimeout(() => el.classList.remove('settling'), 450);
  },
  closeAll(instant) { ['notif', 'control'].forEach(k => { if (this.open === k || instant) this.hide(k, instant); }); },
  bind() {
    const sb = $('statusbar');
    sb.addEventListener('pointerdown', (e) => {
      if (this.open) { this.hide(this.open); return; }
      const k = e.clientX < window.innerWidth / 2 ? 'notif' : 'control';
      this.drag = { k, y: e.clientY, p: 0 }; const el = this.el(k); el.classList.remove('settling'); $('panel-backdrop').style.transition = 'none';
      if (k === 'control') CC.render(); else Notif.render();
    });
    window.addEventListener('pointermove', (e) => {
      const d = this.drag; if (!d) return; const h = Math.max(this.el(d.k).offsetHeight, 300);
      d.p = (e.clientY - d.y) / h * 1.6; this.setProgress(d.k, d.p);
    });
    const end = () => { const d = this.drag; if (!d) return; this.drag = null; const el = this.el(d.k); el.classList.add('settling');
      $('panel-backdrop').style.transition = 'opacity .35s ease, backdrop-filter .35s ease, -webkit-backdrop-filter .35s ease';
      if (d.p > 0.25) { el.classList.add('on'); $('panel-backdrop').classList.add('on'); this.open = d.k; this.setProgress(d.k, 1); } else { this.hide(d.k); } };

/* ---------- Central de Controle (inspirada no Quick Panel da Samsung) ---------- */
const CC = {
  tiles: [

    { k: 'bluetooth', i: '🔵', l: 'Bluetooth' }, { k: 'airplane', i: '✈️', l: 'Modo avião' },
    { k: 'location', i: '📍', l: 'Localização' }, { k: 'saver', i: '🍃', l: 'Economia de bateria' },
    { k: 'vibrate', i: '📳', l: 'Vibrar' }, { k: 'rotationLock', i: '🔒', l: 'Bloquear orientação' },

  ],
  sub(k) {

    if (k === 'wallet') return 'Interface (futuro)';
    if (k === 'modes') return Modes.current().name;

    return s[k] ? 'Ligado' : 'Desligado';
  },
  render() {
    const g = $('cc-grid'); g.innerHTML = '';
    this.tiles.forEach(t => {
      if (t.slider) {
        const row = document.createElement('div'); row.className = 'cc-slider glass';
        row.innerHTML = `<span class="ci">${t.i}</span><input type="range" min="0" max="100" value="${State.v[t.k]}" data-k="${t.k}"><span class="cs" style="font-size:11px;color:var(--text-dim);width:34px;text-align:right">${State.v[t.k]}</span>`;
        const inp = row.querySelector('input'), lab = row.querySelector('.cs');
        inp.addEventListener('input', () => { lab.textContent = inp.value; State.set({ [t.k]: +inp.value }); });
        inp.addEventListener('pointerdown', (e) => e.stopPropagation());
        g.appendChild(row); return;

  },

/* ---------- Clock Persistence (1.1.1: posição, tamanho, fonte, estilo, cores Hyper) ---------- */
const ClockPersistence = {
  KEY: 'clock.cfg', FONTS: ['default', 'comfort', 'star'], STYLES: ['classic', 'hyper'],
  DEF: { v: 2, cx: 0.5, cy: 0.30, size: 0.22, font: 'default', style: 'classic', c1: '#d6f24a', c2: '#ffffff', autoAvoid: true },
  _c: null,
  sanitize(c) { // dados inválidos → padrão seguro, nunca bloqueia a Lock Screen. Migra o formato 1.1.
    const d = Object.assign({}, this.DEF); if (!c || typeof c !== 'object') return d;
    const n = (v, lo, hi, def) => (typeof v === 'number' && isFinite(v)) ? Math.min(hi, Math.max(lo, v)) : def, hex = (v, def) => (typeof v === 'string' && /^#[0-9a-f]{6}$/i.test(v)) ? v.toLowerCase() : def;
    d.cx = n(c.cx, 0, 1, d.cx); d.cy = n(c.cy, 0, 1, d.cy);
    d.size = typeof c.size === 'number' ? n(c.size, 0.05, 0.5, d.size) : (typeof c.scale === 'number' ? n(c.scale, 0.5, 1, 1) * 0.2565 : d.size); // 1.1: scale → size
    d.font = this.FONTS.includes(c.font) ? c.font : 'default'; d.style = this.STYLES.includes(c.style) ? c.style : 'classic';
    d.c1 = hex(c.c1, d.c1); d.c2 = hex(c.c2, d.c2); d.autoAvoid = c.autoAvoid !== false; return d;
  },
  load() { if (!this._c) { try { this._c = this.sanitize(Storage.get(this.KEY, null)); } catch (e) { this._c = Object.assign({}, this.DEF); } } return Object.assign({}, this._c); },
  save(c) { this._c = this.sanitize(c); return Storage.set(this.KEY, this._c); }
};

/* ---------- Clock Fonts: fontes reais embutidas (@font-face no CSS) ---------- */
const ClockFonts = {
  list: [{ id: 'default', name: 'Padrão', family: '' }, { id: 'comfort', name: 'Comfort', family: 'LimeComfort' }, { id: 'star', name: 'Star', family: 'LimeStar' }],
  hyper: 'LimeHyper', ready: null,

    this.ready = Promise.all(fams.map(f => document.fonts.load('100px ' + f, '0123456789:').catch(() => []))).then(() => { this.ok = fams.every(f => document.fonts.check('100px ' + f, '0')); ClockLayout.K = {}; return this.ok; }).catch(() => false);

/* ---------- Clock Style: Clássico e Hyper · Beta ---------- */
const ClockStyle = {
  PALETTE: ['#d6f24a', '#ffffff', '#7be0a0', '#ffd23f', '#ff8a5c', '#6ab7ff'],
  lum(h) { const v = [1, 3, 5].map(i => { const c = parseInt(h.substr(i, 2), 16) / 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }); return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2]; },
  legible(h) { // contraste mínimo sobre fundo escuro: clareia cores escuras demais
    let c = h; for (let i = 0; i < 10 && this.lum(c) < 0.2; i++) { const r = [1, 3, 5].map(k => Math.round(parseInt(c.substr(k, 2), 16) + (255 - parseInt(c.substr(k, 2), 16)) * 0.15)); c = '#' + r.map(x => x.toString(16).padStart(2, '0')).join(''); } return c;
  },
  applyTo(el, cfg) { // fonte/estilo no elemento do horário
    const s = el.style;
    if (cfg.style === 'hyper') { s.fontFamily = 'LimeHyper,var(--font)'; s.fontWeight = '400'; s.letterSpacing = '0.02em'; s.lineHeight = '.9'; }
    else { const f = ClockFonts.list.find(x => x.id === cfg.font); if (f && f.family) { s.fontFamily = f.family + ',var(--font)'; s.fontWeight = '400'; s.letterSpacing = '0.02em'; s.lineHeight = '1'; } else { s.fontFamily = ''; s.fontWeight = ''; s.letterSpacing = ''; s.lineHeight = ''; } }
  },
  label(cfg) { return cfg.style === 'hyper' ? 'Hyper · Beta' : 'Clássico · ' + ClockFonts.list.find(x => x.id === cfg.font).name; }
};

/* ---------- Clock Renderer: horário e data ---------- */
const ClockRenderer = {
  render(timeEl, dateEl, cfg) {
    cfg = cfg || ClockPersistence.load();
    const d = new Date(), h24 = State.v.hour24; let hh = d.getHours(); if (!h24) hh = hh % 12 || 12;
    const H = h24 ? String(hh).padStart(2, '0') : String(hh), M = String(d.getMinutes()).padStart(2, '0'), t = H + ':' + M;
    if (timeEl) {

      if (timeEl._k !== key) { timeEl._k = key;
        if (cfg.style === 'hyper') { timeEl.innerHTML = ''; [[H, c1, 'hy-hh'], [':', c1, 'hy-sep'], [M, c2, 'hy-mm']].forEach(([tx, col, cl]) => { const sp = document.createElement('span'); sp.className = cl; sp.style.color = col; sp.textContent = tx; timeEl.appendChild(sp); }); }

/* ---------- Focus Analysis: mapa de atividade visual (somente apoio ao contraste; local) ---------- */
const FocusAnalysis = {
  status: 'none', // none (fundo padrão) | pending | ready | unavailable
  src: null, grid: null, lum: null, GW: 24, GH: 52, detectsObjects: false, usesAI: false,
  label() {
    return { none: 'Sem papel de parede personalizado: fundo padrão do LimeOS.', pending: 'Analisando a imagem…', ready: 'Mapa de atividade visual local (heurística de bordas e contraste). Não é IA e não detecta objetos. Usado só para ajustar o contraste; sua posição nunca é alterada.', unavailable: 'Análise indisponível para esta imagem. A imagem foi preservada; o posicionamento manual funciona normalmente.' }[this.status];
  },
  run() {
    const src = Storage.get('wp.lock', null);
    if (!src) { this.status = 'none'; this.src = null; this.grid = null; return Promise.resolve(this.status); }
    if (src === this.src && (this.status === 'ready' || this.status === 'unavailable')) return Promise.resolve(this.status);
    this.src = src; this.status = 'pending'; this.grid = null;
    return new Promise(res => {
      const im = new Image(); im.crossOrigin = 'anonymous';
      im.onload = () => { try { this.compute(im); this.status = 'ready'; } catch (e) { this.status = 'unavailable'; this.grid = null; } res(this.status); };
      im.onerror = () => { this.status = 'unavailable'; this.grid = null; res(this.status); };
      im.src = src;
    });
  },
  compute(im) {
    const GW = this.GW, GH = Math.max(20, Math.round(GW * innerHeight / innerWidth)); this.GH = GH;
    const c = document.createElement('canvas'); c.width = GW; c.height = GH; const g = c.getContext('2d', { willReadFrequently: true });
    const s = Math.max(GW / im.width, GH / im.height), w = im.width * s, h = im.height * s; g.drawImage(im, (GW - w) / 2, (GH - h) / 2, w, h);
    const px = g.getImageData(0, 0, GW, GH).data, L = new Float32Array(GW * GH);
    for (let i = 0; i < GW * GH; i++) L[i] = (0.2126 * px[i * 4] + 0.7152 * px[i * 4 + 1] + 0.0722 * px[i * 4 + 2]) / 255;
    this.lum = L; this.grid = L;
  },
  luminance(rect, m) {
    if (this.status !== 'ready' || !this.lum) return null; const GW = this.GW, GH = this.GH;
    const x0 = Math.max(0, Math.floor(rect.x0 / m.W * GW)), x1 = Math.min(GW - 1, Math.ceil(rect.x1 / m.W * GW) - 1), y0 = Math.max(0, Math.floor(rect.y0 / m.H * GH)), y1 = Math.min(GH - 1, Math.ceil(rect.y1 / m.H * GH) - 1);
    let a = 0, n = 0; for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { a += this.lum[y * GW + x]; n++; } return n ? a / n : null;
  }
};

const ClockLayout = {

  },
  metrics() { return { W: innerWidth, H: innerHeight, top: 30 + 12, bottom: innerHeight - 100 }; },
  box(px, py, font, K) { const hw = K * font / 2 + 6, hh = font * this.LH / 2; return { x0: px - hw, x1: px + hw, y0: py - hh, y1: py + hh, hw, hh }; },
  maxFont(cfg, px, py) { // tamanho máximo que ainda cabe na área útil na posição atual
    const m = this.metrics(), K = this.ratio(cfg), M = this.M;
    const byW = 2 * (Math.min(px - M, m.W - M - px) - 6) / K, byH = 2 * Math.min(py - m.top, m.bottom - py) / this.LH;
    return Math.max(this.MIN, Math.min(this.MAXF * m.W, (m.W - 2 * M - 12) / K, (m.bottom - m.top) / this.LH, byW > 0 ? byW : this.MIN, byH > 0 ? byH : this.MIN));
  },
  solve(cfg) { // mesma função na Lock real e na pré-visualização; só limita à área útil
    const m = this.metrics(), M = this.M, K = this.ratio(cfg);
    const absMax = Math.max(this.MIN, Math.min(this.MAXF * m.W, (m.W - 2 * M - 12) / K, (m.bottom - m.top) / this.LH));
    const font = Math.min(absMax, Math.max(this.MIN, cfg.size * m.W));
    let px = cfg.cx * m.W, py = cfg.cy * m.H; const b = this.box(px, py, font, K);
    px = Math.min(m.W - M - b.hw, Math.max(M + b.hw, px)); py = Math.min(m.bottom - b.hh, Math.max(m.top + b.hh, py));
    return { x: px, y: py, font, cx: px / m.W, cy: py / m.H, size: font / m.W, m, K };
  },
  applyLock() {
    const cfg = ClockPersistence.load(), s = this.solve(cfg);
    const c = $('lock-clock'), t = $('lock-time'), d = $('lock-date'); if (!c) return s;
    t._k = null; ClockRenderer.render(t, d, cfg);
    c.style.left = s.x + 'px'; c.style.top = s.y + 'px'; t.style.fontSize = s.font + 'px'; d.style.fontSize = ClockRenderer.dateFont(s.font) + 'px';
    const lum = cfg.autoAvoid ? FocusAnalysis.luminance(this.box(s.x, s.y, s.font, s.K), s.m) : null; // só contraste, sem mover
    c.style.textShadow = lum !== null && lum > 0.6 ? '0 2px 14px rgba(0,0,0,.7)' : ''; return s;
  }
};

/* ---------- Clock Animation: transições curtas, sem oscilação indefinida ---------- */
const ClockAnimation = {
  pick(el) { el.animate([{ transform: 'translate(-50%,-50%) scale(1)' }, { transform: 'translate(-50%,-50%) scale(1.04)' }], { duration: 140, easing: 'ease-out', fill: 'forwards' }); },
  settle(el) { const a = el.animate([{ transform: 'translate(-50%,-50%) scale(1.04)' }, { transform: 'translate(-50%,-50%) scale(.985)', offset: .6 }, { transform: 'translate(-50%,-50%) scale(1)' }], { duration: 260, easing: 'cubic-bezier(.34,1.56,.64,1)' }); a.onfinish = () => el.getAnimations().forEach(x => x.cancel()); }
};

/* ---------- Clock Preview: pré-visualização interativa (Personalização › Tela de bloqueio › Relógio) ---------- */
const LEAF_SVG = '<svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 20C4 9 11 3 21 3c0 10-6 17-17 17z" fill="#7fc44a" stroke="#d6f24a" stroke-width="1.2" stroke-linejoin="round"/><path d="M4 20L16 8" stroke="#2e5a1c" stroke-width="1.4" stroke-linecap="round"/></svg>';
const ClockPreview = {
  onWp: null,
  build(b) {
    b.innerHTML = '';
    const W = innerWidth, H = innerHeight, PW = Math.min(240, Math.round(W * 0.62)), s = PW / W, PH = Math.round(PW * H / W);
    let draft = ClockPersistence.load(), cur = null, st = null, rs = null, sel = false, dirty = false, openPal = null;
    const wrap = el('<div class="pv-wrap"></div>'); b.appendChild(wrap);
    const scr = el(`<div class="pv-screen" style="width:${PW}px;height:${PH}px"><div class="pv-ring"></div><div class="pv-clock"><div class="pv-time"></div><div class="pv-date"></div></div><button class="pv-leaf" aria-label="Redimensionar relógio">${LEAF_SVG}</button><div class="pv-hint">Deslize para cima para desbloquear</div></div>`); wrap.appendChild(scr);
    const clock = scr.querySelector('.pv-clock'), tEl = scr.querySelector('.pv-time'), dEl = scr.querySelector('.pv-date'), ring = scr.querySelector('.pv-ring'), leaf = scr.querySelector('.pv-leaf');
    const paintBg = () => { const wp = Storage.get('wp.lock', null); scr.classList.toggle('default-bg', !wp); scr.style.backgroundImage = wp ? `url("${wp}")` : ''; };
    const place = () => { // contorno circular + folha na borda do componente
      const w = clock.offsetWidth, h = clock.offsetHeight, D = Math.hypot(w, h) + 12, cx = cur.x * s, cy = cur.y * s, R = D / 2;
      ring.style.cssText = `width:${D}px;height:${D}px;left:${cx}px;top:${cy}px`;
      const a = Math.PI / 4, lx = Math.min(PW - 13, Math.max(13, cx + R * Math.cos(a))), ly = Math.min(PH - 13, Math.max(13, cy + R * Math.sin(a)));
      leaf.style.left = lx + 'px'; leaf.style.top = ly + 'px';
    };
    const refresh = () => {
      cur = ClockLayout.solve(draft);
      clock.style.left = cur.x * s + 'px'; clock.style.top = cur.y * s + 'px';
      ClockRenderer.render(tEl, dEl, draft); tEl.style.fontSize = cur.font * s + 'px'; dEl.style.fontSize = Math.max(5, ClockRenderer.dateFont(cur.font) * s) + 'px'; place();
    };
    const setSel = (v) => { sel = v; ring.classList.toggle('on', v); leaf.classList.toggle('on', v); };
    const tick = () => { if (!scr.isConnected) { clearInterval(iv); return; } ClockRenderer.render(tEl, dEl, draft); }; const iv = setInterval(tick, 1000);
    paintBg(); refresh(); ClockFonts.load().then(() => { if (scr.isConnected) refresh(); });

    /* Dica de primeiro uso: aparece uma única vez */
    let seen = false; try { seen = !!Storage.get('clock.hint', false); } catch (_) {}
    if (!seen) { Storage.set('clock.hint', true); const tip = el('<div class="pv-tip">Arraste para mudar de posição. Toque para editar o relógio.</div>'); scr.appendChild(tip); const hide = () => { tip.classList.add('off'); setTimeout(() => tip.remove(), 300); }; setTimeout(hide, 4500); scr.addEventListener('pointerdown', hide, { once: true, capture: true }); }

    /* Arrastar direto: o relógio acompanha o dedo; tocar sem mover entra no modo de edição */
    clock.addEventListener('pointerdown', (e) => { const r = scr.getBoundingClientRect(); st = { sx: e.clientX, sy: e.clientY, ox: (e.clientX - r.left) / s - cur.x, oy: (e.clientY - r.top) / s - cur.y, moved: false }; try { clock.setPointerCapture(e.pointerId); } catch (_) {} e.stopPropagation(); });
    clock.addEventListener('pointermove', (e) => { if (!st) return; if (!st.moved) { if (Math.hypot(e.clientX - st.sx, e.clientY - st.sy) < 5) return; st.moved = true; clock.classList.add('drag'); ClockAnimation.pick(clock); }
      const r = scr.getBoundingClientRect(); draft.cx = ((e.clientX - r.left) / s - st.ox) / W; draft.cy = ((e.clientY - r.top) / s - st.oy) / H; dirty = true; refresh(); draft.cx = cur.cx; draft.cy = cur.cy; });
    const end = () => { if (!st) return; const mv = st.moved; st = null; clock.classList.remove('drag'); if (mv) ClockAnimation.settle(clock); else setSel(true); };
    clock.addEventListener('pointerup', end); clock.addEventListener('pointercancel', end);

    /* Folha de limão: redimensiona de forma contínua (para baixo aumenta, para cima diminui) */
    leaf.addEventListener('pointerdown', (e) => { rs = { y: e.clientY, f0: cur.font }; try { leaf.setPointerCapture(e.pointerId); } catch (_) {} leaf.classList.add('drag'); e.stopPropagation(); e.preventDefault(); });
    leaf.addEventListener('pointermove', (e) => { if (!rs) return; const cap = ClockLayout.maxFont(draft, cur.x, cur.y), f = Math.min(cap, Math.max(ClockLayout.MIN, rs.f0 + (e.clientY - rs.y) / s * 0.6)); draft.size = f / W; dirty = true; refresh(); });
    const endR = () => { if (!rs) return; rs = null; leaf.classList.remove('drag'); ClockAnimation.settle(clock); };
    leaf.addEventListener('pointerup', endR); leaf.addEventListener('pointercancel', endR);
    document.addEventListener('pointerdown', (e) => { if (!scr.isConnected) return; if (sel && !clock.contains(e.target) && !leaf.contains(e.target) && !e.target.closest('.pv-panel')) setSel(false); }, true);

    /* Painel compacto: estilo + fonte (Clássico) ou duas cores (Hyper) */
    const panel = el('<div class="pv-panel"></div>'); b.appendChild(panel);
    const chips = (list, isOn, pick, sample) => { const row = el('<div class="pv-chips"></div>'); list.forEach(o => { const x = el(`<button class="pv-chip jelly${isOn(o.id) ? ' on' : ''}">${sample ? `<span class="pv-chip-s" style="font-family:${o.family ? o.family + ',' : ''}var(--font)">20</span>` : ''}<span>${o.name}</span></button>`); x.addEventListener('click', () => { pick(o.id); }); row.appendChild(x); }); return row; };
    const paintPanel = () => {
      panel.innerHTML = ''; openPal = openPal && draft.style === 'hyper' ? openPal : null;
      panel.appendChild(el('<div class="pv-lab">Estilo</div>'));
      panel.appendChild(chips([{ id: 'classic', name: 'Clássico' }, { id: 'hyper', name: 'Hyper · Beta' }], id => draft.style === id, id => { draft.style = id; dirty = true; refresh(); paintPanel(); }));
      if (draft.style === 'classic') {
        panel.appendChild(el('<div class="pv-lab">Fonte</div>'));
        panel.appendChild(chips(ClockFonts.list, id => draft.font === id, id => { draft.font = id; dirty = true; refresh(); paintPanel(); }, true));
      } else {
        panel.appendChild(el('<div class="pv-lab">Cores · horas (HH) e minutos (MM)</div>'));
        const row = el('<div class="pv-cols"></div>');
        [['c1', 'HH'], ['c2', 'MM']].forEach(([k, n]) => { const x = el(`<button class="pv-col${openPal === k ? ' open' : ''}"><span class="pv-sw" style="background:${draft[k]}"></span><span>${n}</span></button>`); x.addEventListener('click', () => { openPal = openPal === k ? null : k; paintPanel(); }); row.appendChild(x); });
        panel.appendChild(row);
        if (openPal) { const pal = el('<div class="pv-pal"></div>'); ClockStyle.PALETTE.forEach(c => { const x = el(`<button class="pv-sw big${draft[openPal] === c ? ' on' : ''}" style="background:${c}" aria-label="${c}"></button>`); x.addEventListener('click', () => { draft[openPal] = c; dirty = true; refresh(); paintPanel(); }); pal.appendChild(x); });
          const inp = el(`<input type="color" class="pv-pick" value="${draft[openPal]}" aria-label="Outra cor">`); inp.addEventListener('input', () => { draft[openPal] = inp.value.toLowerCase(); dirty = true; refresh(); const sw = panel.querySelector('.pv-col.open .pv-sw'); if (sw) sw.style.background = draft[openPal]; }); pal.appendChild(inp); panel.appendChild(pal); }
        panel.appendChild(el('<div class="pv-small">O separador “:” acompanha a cor das horas. Cores escuras demais são clareadas para manter a leitura. A fonte escolhida em Clássico é mantida ao voltar.</div>'));
      }
    };
    paintPanel();
    const ap = el('<button class="btn primary jelly">Aplicar</button>');
    ap.addEventListener('click', () => { ClockPersistence.save(draft); ClockLayout.applyLock(); dirty = false; Core.toast('Relógio aplicado à tela de bloqueio.'); });
    const act = el('<div style="margin-top:10px"></div>'); act.appendChild(ap); b.appendChild(act);
    b.appendChild(el(`<div class="pv-small" style="margin-top:10px">${FocusAnalysis.label()} ${LayerComposition.reason} O papel de parede da tela inicial não é alterado.</div>`));

    this.onWp = () => { if (!scr.isConnected) return; paintBg(); refresh(); };
    FocusAnalysis.run().then(() => { if (scr.isConnected) refresh(); });
  }
};

/* =====================================================================
   LIMEOS 1.2 — Fonte do sistema · Modo de tela/AOD · Estilo de bloqueio (Filme)
   Widgets reais (clima via geolocalização, bateria via Battery API) · Modos
   ===================================================================== */

/* ---------- Tempo de tela / AOD ---------- */
const ScreenTimeout = {
  timer: null,
  arm() {
    clearTimeout(this.timer); const min = State.v.screenTimeoutMin;
    if (!min || Lock.locked === false && false) {} // guarda explícita: só conta em telas desbloqueadas
    if (!min) return; // 0 = desativado
    if (Lock.locked) return; // AOD só a partir do uso ativo, não sobrepõe o fluxo de PIN
    this.timer = setTimeout(() => this.enter(), min * 60000);
  },
  enter() {
    if (Shell.current === 'screen-aod') return;
    this.prev = Shell.current; Shell.show('screen-aod'); this.tick(); clearInterval(this.iv); this.iv = setInterval(() => this.tick(), 1000);
  },
  tick() { ClockRenderer.render($('aod-time'), $('aod-date')); },
  exit() { clearInterval(this.iv); Lock.enter(); },
  bind() {
    $('screen-aod').addEventListener('pointerdown', () => this.exit());
    ['pointerdown', 'pointermove', 'keydown'].forEach(ev => document.addEventListener(ev, () => { if (Shell.current !== 'screen-aod') this.arm(); }, { passive: true }));
  }
};

/* ---------- Clima real (geolocalização + Open-Meteo, sem chave) ---------- */
const WeatherWidget = {
  status: 'idle', data: null, // idle|pending|ready|unavailable
  codeIcon(c) { if (c === 0) return '☀️'; if (c <= 3) return '⛅'; if ([45, 48].includes(c)) return '🌫️'; if (c >= 51 && c <= 67) return '🌦️'; if (c >= 71 && c <= 77) return '❄️'; if (c >= 80 && c <= 82) return '🌧️'; if (c >= 95) return '⛈️'; return '🌡️'; },
  run() {
    if (!Capability.has('geolocation')) { this.status = 'unavailable'; return Promise.resolve(this.status); }
    this.status = 'pending';
    return new Promise(res => {
      navigator.geolocation.getCurrentPosition(
        (pos) => { const { latitude, longitude } = pos.coords;
          fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`).then(r => r.json()).then(j => {
            if (j && j.current_weather) { this.data = j.current_weather; this.status = 'ready'; } else { this.status = 'unavailable'; } res(this.status);
          }).catch(() => { this.status = 'unavailable'; res(this.status); });
        },
        () => { this.status = 'unavailable'; res(this.status); }, { timeout: 8000 }
      );
    });
  },
  label() { if (this.status === 'ready' && this.data) return Math.round(this.data.temperature) + '°C'; if (this.status === 'pending') return '…'; return '—'; },
  sub() { return { idle: 'Clima', pending: 'Localizando…', ready: 'Agora', unavailable: 'Indisponível' }[this.status]; },
  icon() { return this.status === 'ready' && this.data ? this.codeIcon(this.data.weathercode) : '🌐'; }
};

/* ---------- Bateria real (Battery API, mesma fonte da barra de status) ---------- */
const BatteryWidget = {
  level: null, charging: false,
  init() { if (!Capability.has('battery')) return; navigator.getBattery().then(b => { const f = () => { this.level = Math.round(b.level * 100); this.charging = b.charging; }; f(); b.addEventListener('levelchange', f); b.addEventListener('chargingchange', f); }).catch(() => {}); },
  label() { return this.level === null ? (Capability.has('battery') ? '…' : '—') : this.level + '%'; },
  sub() { return Capability.has('battery') ? (this.charging ? 'Carregando' : 'Bateria') : 'Indisponível'; }
};

/* ---------- Estilo de bloqueio: Clássico (existente) e Filme ---------- */
const LockStyle = {
  apply() {
    const filme = State.v.lockStyle === 'filme';
    $('lock-content').classList.toggle('style-filme', filme);
    const w = $('film-widgets'); w.innerHTML = '';
    if (!filme) { w.style.display = 'none'; return; }
    w.style.display = 'flex';
    w.appendChild(el(`<div class="film-widget"><span class="fw-i">${WeatherWidget.icon()}</span><span><span>${WeatherWidget.label()}</span><span class="fw-sub">${WeatherWidget.sub()}</span></span></div>`));
    w.appendChild(el(`<div class="film-widget"><span class="fw-i">🔋</span><span><span>${BatteryWidget.label()}</span><span class="fw-sub">${BatteryWidget.sub()}</span></span></div>`));
    // No estilo Filme a posição/tamanho/fonte do relógio são fixos; as preferências do Clássico (ClockPersistence) não são lidas nem sobrescritas aqui.
  },
  refreshWidgets() { if (State.v.lockStyle === 'filme') this.apply(); }
};

/* ---------- Modos: até 4 personalizados + Normal padrão ---------- */
const Modes = {
  KEY: 'modes.list', MAX: 4,
  load() { const l = Storage.get(this.KEY, null); return Array.isArray(l) ? l : []; },
  save(l) { Storage.set(this.KEY, l); },
  current() { return State.v.activeMode === 'normal' ? { id: 'normal', name: 'Normal', glyph: '⚪', brightness: null, dnd: false, wallpaper: null, blockedApps: [] } : (this.load().find(m => m.id === State.v.activeMode) || { id: 'normal', name: 'Normal' }); },
  isBlocked(appId) { const m = this.current(); return m.id !== 'normal' && Array.isArray(m.blockedApps) && m.blockedApps.includes(appId); },
  activate(id) {
    const prevWallpapers = { home: Storage.get('wp.home', null), lock: Storage.get('wp.lock', null) };
    if (State.v.activeMode !== 'normal') { // restaura o que havia antes do modo anterior, se ele tinha trocado wallpaper
      const prevMode = this.load().find(m => m.id === State.v.activeMode);
      if (prevMode && prevMode.wallpaper && this._stash) { Storage.set('wp.home', this._stash.home); Storage.set('wp.lock', this._stash.lock); this._stash = null; }
    }
    State.set({ activeMode: id });
    if (id === 'normal') { Shell.applyWallpapers(); Core.emit('wallpaper'); Core.toast('Modo Normal ativado.'); return; }
    const m = this.load().find(x => x.id === id); if (!m) return;
    if (m.wallpaper) { this._stash = prevWallpapers; if (m.wallpaper.home) Storage.set('wp.home', m.wallpaper.home); if (m.wallpaper.lock) Storage.set('wp.lock', m.wallpaper.lock); Shell.applyWallpapers(); Core.emit('wallpaper'); }
    if (typeof m.brightness === 'number') State.set({ brightness: m.brightness });
    if (m.dnd) State.set({ dnd: true });
    Core.toast(`Modo ${m.name} ativado.`);
  },
  blockedToast(name) { Core.toast(`🔒 Bloqueado pelo modo ${name}.`); }
};

/* ---------- Integração 1.2 ---------- */
Core.on('wallpaper', () => LockStyle.refreshWidgets());
const _origLockEnter = Lock.enter.bind(Lock);
Lock.enter = function () { _origLockEnter(); LockStyle.apply(); };
const _origLockTick = Lock.tick.bind(Lock);
