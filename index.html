/* ---------------- v5.0: SCROLL ELÁSTICO (One UI / iOS style rubber-band) ----------------
   overflow-y:auto containers don't bounce on Android/Chrome by default, so we fake it:
   when the user pulls past the top or bottom edge, the content stretches slightly and
   springs back on release, instead of just refusing to move. */
function setupElasticScroll(el){
  let startY=0, pulling=false, overpull=0, pointerId=null;
  const MAX_PULL = 70;      // px of visible stretch at the very edge
  const RESISTANCE = 0.42;  // how much slower the content moves vs the finger past the edge

  el.addEventListener('pointerdown', (e)=>{
    if(e.pointerType==='mouse') return; // rubber-banding is a touch affordance, mouse wheel scrolls normally
    startY = e.clientY; pulling=false; overpull=0; pointerId=e.pointerId;
  });
  el.addEventListener('pointermove', (e)=>{
    if(e.pointerId!==pointerId) return;
    const dy = e.clientY - startY;
    const atTop = el.scrollTop<=0;
    const atBottom = el.scrollTop+el.clientHeight >= el.scrollHeight-1;
    if((atTop && dy>0) || (atBottom && dy<0)){
      pulling = true;
      overpull = Math.sign(dy) * Math.min(MAX_PULL, Math.abs(dy)*RESISTANCE);
      el.style.transition='none';
      el.style.transform='translateY('+overpull+'px)';
    } else if(pulling){
      // finger moved back within normal scroll range; release the stretch
      pulling=false;
      el.style.transition='transform .35s cubic-bezier(.34,1.3,.4,1)';
      el.style.transform='translateY(0)';
    }
  });
  function release(e){
    if(e.pointerId!==pointerId || !pulling) return;
    pulling=false;
    el.style.transition='transform .35s cubic-bezier(.34,1.3,.4,1)';
    el.style.transform='translateY(0)';
  }
  el.addEventListener('pointerup', release);
  el.addEventListener('pointercancel', release);
}
document.querySelectorAll('.app-screen').forEach(setupElasticScroll);

// Swipe left/right between "Fora da Home" and "Home"
// Uses Pointer Events (not Touch Events) for more consistent cross-browser behavior,
// and pan-y so the browser knows horizontal drags belong to us while vertical scroll still works.
(function setupScreenSwipe(){
  const container = document.getElementById('screens');
  container.style.touchAction = 'pan-y';
  let startX=0, startY=0, tracking=false, decided=false, isHorizontal=false, pointerId=null;

  container.addEventListener('pointerdown', (e)=>{
    if(e.pointerType==='mouse' && e.buttons!==1) return;
    if(document.body.classList.contains('panel-open')) return;
    if(rearrangeMode) return; // don't fight with the drag-to-reorder gesture
    startX = e.clientX; startY = e.clientY;
    tracking = true; decided = false; isHorizontal = false; pointerId = e.pointerId;
  });
  container.addEventListener('pointermove', (e)=>{
    if(!tracking || e.pointerId!==pointerId) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if(!decided && (Math.abs(dx) > 10 || Math.abs(dy) > 10)){
      decided = true;
      isHorizontal = Math.abs(dx) > Math.abs(dy) * 1.2;
    }
  });
  function finish(e){
    if(!tracking || e.pointerId!==pointerId) return;
    tracking = false;
    if(!isHorizontal) return;
    const dx = e.clientX - startX;
    if(Math.abs(dx) < 45) return;
    // Only two screens exist today, so any confident horizontal swipe just toggles between them.
    goToScreen(currentScreen==='home' ? 'fora' : 'home');
  }
  container.addEventListener('pointerup', finish);
  container.addEventListener('pointercancel', ()=>{ tracking=false; });
})();

function openModule(id, evt){
  const panel = document.getElementById('panel-'+id);
  const rect = evt.currentTarget.getBoundingClientRect();
  const cx = rect.left+rect.width/2, cy = rect.top+rect.height/2;
  const sx = rect.width/window.innerWidth, sy = rect.height/window.innerHeight;
  PANEL_ORIGINS[id] = {cx, cy, sx, sy};
  document.body.classList.add('panel-open');
  document.getElementById(SCREEN_IDS[currentScreen]).style.display='none';
  panel.style.willChange='transform, opacity';
  panel.style.transition='none';
  panel.style.transformOrigin = cx+'px '+cy+'px';
  panel.style.transform = 'scale('+sx+','+sy+')';
  panel.style.opacity='0';
  panel.classList.add('active');
  // force reflow so the browser registers the start state before animating
  panel.offsetHeight;
  requestAnimationFrame(()=>{
    panel.style.transition='transform .28s cubic-bezier(.22,.8,.28,1), opacity .22s ease';
    panel.style.transform='scale(1,1)';
    panel.style.opacity='1';
  });
  setTimeout(()=>{ panel.style.willChange='auto'; }, 320);
  const meta = MODULE_META[id] || {title:id, emoji:'📦', color:'2D6A4F'};
  setFavicon(meta.emoji, meta.color);
  document.title = meta.title+' · LifeOS';
  renderModule(id);
}
function closeModule(id){
  const panel = document.getElementById('panel-'+id);
  document.getElementById(SCREEN_IDS[currentScreen]).style.display='block';
  const origin = PANEL_ORIGINS[id] || {cx:window.innerWidth/2, cy:window.innerHeight/2, sx:0.15, sy:0.08};
  panel.style.willChange='transform, opacity';
  panel.style.transformOrigin = origin.cx+'px '+origin.cy+'px';
  panel.style.transition='transform .24s cubic-bezier(.4,0,.2,1), opacity .2s ease';
  panel.style.transform = 'scale('+origin.sx+','+origin.sy+')';
  panel.style.opacity='0';
  setTimeout(()=>{
    panel.classList.remove('active');
    document.body.classList.remove('panel-open');
    panel.style.willChange='auto';
    if(id==='config' || id==='loja') movePillTo('tab-btn-'+currentScreen); // config/loja aren't swipeable screens; restore the pill only once the tab bar is visible again (offsetLeft is 0 while display:none)
  }, 240);
  resetFavicon();
  renderAll();
}

  document.getElementById('rearrange-bar').classList.add('open');
  if(navigator.vibrate) navigator.vibrate(15);
}
function exitRearrangeMode(){
  if(!rearrangeMode) return;
  rearrangeMode = false;
  document.querySelectorAll('.module-grid').forEach(grid=> grid.classList.remove('rearrange-mode'));
  document.getElementById('rearrange-bar').classList.remove('open');
  saveCurrentWidgetOrder();
  toast('Layout salvo!');
}

function attachLongPress(el, id){
  let timer=null, longPressed=false;
  let dragging=false, startX=0, startY=0, ghostGrid=null;

  const start=(e)=>{
    longPressed=false;
    timer=setTimeout(()=>{
      longPressed=true;
      if(!rearrangeMode) enterRearrangeMode();
      if(navigator.vibrate) navigator.vibrate(15);
    }, 480);
  };
  const clear=()=>{ clearTimeout(timer); };

  el.addEventListener('pointerdown', (e)=>{
    start(e);
    if(rearrangeMode){
      startX = e.clientX; startY = e.clientY;
      ghostGrid = el.parentElement;
    }
  });
  el.addEventListener('pointerup', clear);
  el.addEventListener('pointerleave', clear);

  el.addEventListener('pointermove', (e)=>{
    if(!rearrangeMode) return;
    const dx = Math.abs(e.clientX-startX), dy = Math.abs(e.clientY-startY);
    if(!dragging && (dx>10 || dy>10)){
      dragging = true;
      longPressed = true;
      el.classList.add('dragging');
      el.setPointerCapture(e.pointerId);
    }
    if(dragging){
      const under = document.elementFromPoint(e.clientX, e.clientY);
      const targetCard = under ? under.closest('.module-card[data-mid]') : null;
      document.querySelectorAll('.module-card.drop-target').forEach(c=>c.classList.remove('drop-target'));
      if(targetCard && targetCard!==el && targetCard.parentElement===ghostGrid){
        targetCard.classList.add('drop-target');
      }
    }
  });

  el.addEventListener('pointerup', (e)=>{
    if(dragging){
      el.classList.remove('dragging');
      const under = document.elementFromPoint(e.clientX, e.clientY);
      const targetCard = under ? under.closest('.module-card[data-mid]') : null;
      document.querySelectorAll('.module-card.drop-target').forEach(c=>c.classList.remove('drop-target'));
      if(targetCard && targetCard!==el && targetCard.parentElement===ghostGrid){
        const cards = Array.from(ghostGrid.children);
        const elIdx = cards.indexOf(el), targetIdx = cards.indexOf(targetCard);
        if(elIdx < targetIdx) ghostGrid.insertBefore(el, targetCard.nextSibling);
        else ghostGrid.insertBefore(el, targetCard);
      }
      dragging = false;
    }
  });

  el.addEventListener('click', (e)=>{
    if(dragging){ e.preventDefault(); e.stopImmediatePropagation(); return; }
    if(rearrangeMode){
      e.preventDefault(); e.stopImmediatePropagation();
      toggleWidgetSize(id);
      return;
    }
    if(longPressed){ e.preventDefault(); e.stopImmediatePropagation(); longPressed=false; }
  }, true);
}
document.querySelectorAll('.module-card[data-mid]').forEach(card=>{
  attachLongPress(card, card.getAttribute('data-mid'));
});
applyWidgetOrder();

function toggleSearch(){

function normalizeSearch(s){
  return (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
}
function handleSearchInput(){
  const input=document.getElementById('search-input');
  input.classList.remove('wiggle'); void input.offsetWidth; input.classList.add('wiggle');
  const q=normalizeSearch(input.value.trim());
  const results=document.getElementById('search-results');
  if(!q){ results.innerHTML=''; return; }
  const hits=[];
  DB.tasks.forEach(t=>{ if(normalizeSearch(t.title).includes(q) || normalizeSearch(t.desc).includes(q)) hits.push({type:'Tarefa', title:t.title, mod:'tarefas'}); });
  DB.goals.forEach(g=>{ if(normalizeSearch(g.title).includes(q)) hits.push({type:'Meta', title:g.title, mod:'metas'}); });
  DB.agenda.forEach(e=>{ if(normalizeSearch(e.title).includes(q)) hits.push({type:'Agenda', title:e.title, mod:'agenda'}); });
  DB.trabalhos.forEach(t=>{ if(normalizeSearch(t.title).includes(q)) hits.push({type:t.type==='prova'?'Prova':'Trabalho', title:t.title, mod:'trabalhos'}); });
  DB.assuntos.forEach(a=>{ if(normalizeSearch(a.content).includes(q) || normalizeSearch(a.aulaName).includes(q)) hits.push({type:'Assunto', title:(a.aulaName||'Assunto')+' — '+fmtDate(a.date), mod:'assuntos'}); });
  DB.habits.forEach(h=>{ if(normalizeSearch(h.name).includes(q)) hits.push({type:'Rotina', title:h.name, mod:'habitos'}); });
  if(isModuleInstalled('boxy')){
    DB.boxyData.forEach(box=>{
      if(normalizeSearch(box.name).includes(q)) hits.push({type:'Caixa', title:box.name, mod:'boxy', boxyTarget:{boxId:box.id}});
      box.papers.forEach(p=>{
        if(normalizeSearch(p.title).includes(q) || normalizeSearch(p.text).includes(q)){
          hits.push({type:'Papel', title:(p.title||'Sem título')+' — '+box.name, mod:'boxy', boxyTarget:{boxId:box.id, paperId:p.id}});
        }
      });
    });
  }
  results.innerHTML = hits.length ? hits.map((h,i)=>`
    <div class="item-card" style="cursor:pointer;" onclick="goToSearchResult('${h.mod}', ${h.boxyTarget?JSON.stringify(h.boxyTarget).replace(/"/g,'&quot;'):'null'})">
      <span class="chip green">${esc(h.type)}</span>
      <div class="item-title" style="margin-top:6px;">${esc(h.title)}</div>
    </div>`).join('') : '<div class="brief-empty" style="color:var(--text-soft);">Nada encontrado.</div>';
}
function goToSearchResult(mod, boxyTarget){
  toggleSearch();
  const target = document.querySelector('.module-card[data-mid="'+mod+'"]');
  openModule(mod, {currentTarget: target || document.body});
  if(mod==='boxy' && boxyTarget){
    setTimeout(()=>{
      openBox(boxyTarget.boxId);
      if(boxyTarget.paperId) openPaperView(boxyTarget.boxId, boxyTarget.paperId);
    }, 260); // espera a animação de abertura do painel terminar
  }
}

function toggleTask(id){
  const t=DB.tasks.find(x=>x.id===id);
  t.done=!t.done;
  if(t.done){
    DB.streak = DB.streak || {dates:[], current:0};
    const prevTier = flameTier(DB.streak.current);
    if(!DB.streak.dates.includes(todayStr())) DB.streak.dates.push(todayStr());
    recomputeStreak();
    const newTier = flameTier(DB.streak.current);
    if(newTier && newTier!==prevTier){ celebrateTierUp(newTier); }
    checkAchievements();
  }
  saveDB(); renderTarefas(); renderAll();
}
function recomputeStreak(){
  const dateSet = new Set(DB.streak.dates);
  let count=0;
  let cursor = new Date(todayStr()+'T00:00:00');
  if(!dateSet.has(todayStr())) cursor.setDate(cursor.getDate()-1);
  while(dateSet.has(cursor.toISOString().slice(0,10))){
    count++;
    cursor.setDate(cursor.getDate()-1);
  }
  DB.streak.current = count;
}

function saveTodayAssuntos(){
  const wd = new Date().getDay();
  const todayAulas = (DB.aulas[wd]||[]).filter(a=>a && a.name);
  let count=0;
  todayAulas.forEach(a=>{
    const el=document.getElementById('ta-'+a.id);
    const content = el ? el.value.trim() : '';
    if(content){
      DB.assuntos.push({id:uid(), date:todayStr(), aulaId:a.id, aulaName:a.name, content, method:'texto'});
      count++;
    }
  });
  if(count===0){ toast('Escreva pelo menos uma aula'); return; }
  DB.settings.lastAssuntoPromptDate = todayStr();
  saveDB(); renderAssuntos(); renderAll(); petReact(); toast(count+' assunto(s) salvo(s)!');
}
function startVoiceInput(textareaId){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast('Seu navegador não suporta voz — escreva no campo mesmo'); return; }
  if(!navigator.onLine){ toast('Voz precisa de internet. Sem conexão, escreva no campo.'); return; }
  const rec = new SR();
  rec.lang='pt-BR';
  rec.onresult = (e)=>{
    const text = e.results[0][0].transcript;
    const el = document.getElementById(textareaId);
    if(el) el.value = (el.value ? el.value+' ' : '') + text;
  };
  rec.onerror = ()=> toast('Não consegui ouvir. Tenta de novo ou escreva.');
  toast('Ouvindo... fale agora');
  rec.start();
}

/* ---------------- NOTAS (boletim: notas obtidas em provas e trabalhos) ---------------- */
function renderNotasBoletim(){
  const body=document.getElementById('body-notas');
  const today=todayStr();
  const pending = DB.trabalhos.filter(t=> t.date<=today && !t.grade && (!t.postponeUntil || t.postponeUntil<=today));
  const done = DB.trabalhos.filter(t=> t.grade!=null && t.grade!=='');
  const future = DB.trabalhos.filter(t=> t.date>today && !t.grade);
  let html='';
  html += '<div class="section-label" style="margin-top:0;">Aguardando nota</div>';
  html += pending.length ? pending.map(t=>`
    <div class="item-card">
      <span class="chip ${t.type==='prova'?'red':'yellow'}">${t.type==='prova'?'PROVA':'TRABALHO'}</span>
      <div class="item-title" style="margin-top:6px;">${esc(t.title)}</div>
      <div class="item-meta">📅 ${fmtDate(t.date)}</div>
      <div class="field" style="margin-top:10px;"><label>Nota obtida</label><input id="grade-${t.id}" placeholder="Ex: 8.5"></div>
      <div class="field"><label>Dificuldade</label>
        <select id="diff-${t.id}"><option value="facil">Fácil</option><option value="media" selected>Média</option><option value="dificil">Difícil</option></select>
      </div>
      <div class="item-actions">
        <button class="btn-primary" style="width:auto; padding:9px 16px;" onclick="saveGrade('${t.id}')">Salvar nota</button>
        <button class="btn-secondary" onclick="postponeGrade('${t.id}',7)">Adiar 1 semana</button>
        <button class="btn-secondary" onclick="postponeGrade('${t.id}',3)">Adiar 3 dias</button>
      </div>
    </div>
  `).join('') : '<div class="empty-state"><p>Nada esperando nota no momento.</p></div>';

  html += '<div class="section-label">Notas registradas</div>';
  html += done.length ? done.map(t=>`
    <div class="item-card">
      <div class="item-top">
        <div>
          <span class="chip ${t.type==='prova'?'red':'yellow'}">${t.type==='prova'?'PROVA':'TRABALHO'}</span>
          <div class="item-title" style="margin-top:6px;">${esc(t.title)}</div>
          <div class="item-meta">📅 ${fmtDate(t.date)} · Dificuldade: ${esc(t.difficulty||'—')}</div>
        </div>
        <span class="chip green" style="font-size:13px;">${esc(t.grade)}</span>
      </div>
    </div>
  `).join('') : '<div class="empty-state"><p>Nenhuma nota registrada ainda.</p></div>';

  if(future.length){
    html += '<div class="section-label">Ainda não chegaram</div>';
    html += future.map(t=>`<div class="item-card"><div class="item-title">${esc(t.title)}</div><div class="item-meta">📅 ${fmtDate(t.date)}</div></div>`).join('');
  }
  body.innerHTML = html;
}
function saveGrade(id){
  const t=DB.trabalhos.find(x=>x.id===id);
  const grade=document.getElementById('grade-'+id).value.trim();
  if(!grade){toast('Digite a nota'); return;}
  t.grade=grade;
  t.difficulty=document.getElementById('diff-'+id).value;
  saveDB(); renderNotasBoletim(); renderAll(); checkAchievements(); petReact(); toast('Nota registrada!', true);
}
function postponeGrade(id, days){
  const t=DB.trabalhos.find(x=>x.id===id);
  const d=new Date(); d.setDate(d.getDate()+days);
  t.postponeUntil = d.toISOString().slice(0,10);
  saveDB(); renderNotasBoletim(); toast('Adiado!');
}

function exportBackup(){
  try{
    const blob=new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='lifeos-backup.json';
    a.style.display='none';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
    toast('Backup baixado!');
  }catch(err){
    toast('Não consegui gerar o backup');
  }
}
function importBackup(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const imported = JSON.parse(e.target.result);
      if(!imported || typeof imported!=='object'){ toast('Arquivo inválido'); input.value=''; return; }
      if(confirm('Isso vai substituir os dados atuais pelos do backup. Continuar?')){
        localStorage.setItem(DB_KEY, JSON.stringify(imported));
        toast('Backup importado! Reiniciando...');
        setTimeout(()=>location.reload(), 900);
      } else { input.value=''; }
    }catch(err){ toast('Não consegui ler esse arquivo'); input.value=''; }
  };
  reader.onerror = ()=>{ toast('Erro ao ler o arquivo'); input.value=''; };
  reader.readAsText(file);
}
function wipeData(){
  if(confirm('Tem certeza? Isso vai apagar TODOS os seus dados do LifeOS permanentemente.')){
    localStorage.removeItem(DB_KEY);
    location.reload();
  }
}

  const equipped = ACHIEVEMENTS.find(a=>a.id===DB.achievements.equipped);
  body.innerHTML = `
    <div class="form-card">
      ${equipped?`<div style="text-align:center; margin-bottom:12px;"><span class="chip" style="background:${TIER_COLOR[equipped.tier]}22; color:${TIER_COLOR[equipped.tier]}; font-size:13px; padding:6px 14px;">${equipped.emoji} ${esc(equipped.name)}</span></div>`:''}
      <div class="field"><label>Nome</label><input id="pf-name" value="${esc(DB.profile.name)}" placeholder="Seu nome"></div>
      <div class="field"><label>Sobre você</label><textarea id="pf-bio" placeholder="Uma frase sobre você">${esc(DB.profile.bio)}</textarea></div>
      <button class="btn-primary" onclick="saveProfile()">Salvar perfil</button>
    </div>
    <div class="section-label" style="margin-top:22px;">Conquistas</div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
      ${ACHIEVEMENTS.map(a=>{
        const unlocked = DB.achievements.unlocked.includes(a.id);
        const isEquipped = DB.achievements.equipped===a.id;
        return `<div class="item-card" style="text-align:center; cursor:${unlocked?'pointer':'default'}; opacity:${unlocked?1:0.45}; ${isEquipped?'border-color:'+TIER_COLOR[a.tier]+';':''}" ${unlocked?`onclick="equipAchievement('${a.id}')"`:''}>
          <div style="font-size:26px;">${unlocked?a.emoji:'🔒'}</div>
          <div class="item-title" style="font-size:12.5px; margin-top:4px;">${esc(a.name)}</div>
          <span class="chip" style="background:${TIER_COLOR[a.tier]}22; color:${TIER_COLOR[a.tier]}; margin-top:6px;">${TIER_LABEL[a.tier]}</span>
          ${isEquipped?'<div class="item-meta" style="margin-top:4px; font-weight:700;">Equipada</div>':''}
        </div>`;
      }).join('')}
    </div>
  `;
}
function saveProfile(){
  DB.profile.name = document.getElementById('pf-name').value.trim();
  DB.profile.bio = document.getElementById('pf-bio').value.trim();
  saveDB(); renderAll(); toast('Perfil salvo!');
}

/* ---------------- LIFEOS AI ---------------- */
function looksLikeHomework(q){
  const ql=q.toLowerCase();
  const mathPattern = /\d+\s*[\+\-\*x×÷\/\^]\s*\d+/;
  const keywords = ['quanto é','resolve essa','resolve a','resultado de','resposta da questão','me dá a resposta','qual a resposta','faz essa conta','resolve essa equação','me responde essa pergunta','me responde essa questão','faz meu dever','faz minha tarefa de'];
  return mathPattern.test(q) || keywords.some(k=>ql.includes(k));
}
function renderAI(){
  const box=document.getElementById('ai-messages');
  if(box.children.length===0){
    addAIMessage('bot', 'Oi! Eu sou a LifeOS AI. Posso consultar suas tarefas, agenda, provas e metas — pergunte, por exemplo, "o que eu tenho amanhã?". Também posso ajudar você a estudar, mas em vez de dar a resposta pronta de exercícios, eu vou te guiar até você mesmo entender. 😉');
  }
}
function addAIMessage(who, text){
  const box=document.getElementById('ai-messages');
  const div=document.createElement('div');
  div.className='ai-msg '+who;
  div.textContent=text;
  box.appendChild(div);
  box.parentElement.scrollTop = box.parentElement.scrollHeight;
}
function sendAI(){
  const input=document.getElementById('ai-input');
  const q=input.value.trim();
  if(!q) return;
  addAIMessage('user', q);
  input.value='';
  setTimeout(()=>{ addAIMessage('bot', answerAI(q)); }, 300);
}
function answerAI(q){
  const ql = q.toLowerCase();
  const today = todayStr();

  if(looksLikeHomework(q)){
    return 'Essa parece uma questão de estudo (tipo de prova ou trabalho)! Eu não vou só te dar a resposta de bandeja — bora pensar junto? Me conta: qual foi o passo que você já tentou, ou o que você lembra sobre esse assunto? Se você me mostrar seu raciocínio, eu te ajudo a chegar na resposta certa e confirmo se você realmente entendeu.';
  }

  const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate()+1);
  const tomStr = tomorrow.toISOString().slice(0,10);

  if(ql.includes('amanhã')){
    const items=[];
    DB.tasks.filter(t=>t.date===tomStr && !t.done).forEach(t=>items.push('Tarefa: '+t.title));
    DB.agenda.filter(e=>e.date===tomStr).forEach(e=>items.push(e.title));
    DB.trabalhos.filter(t=>t.date===tomStr).forEach(t=>items.push((t.type==='prova'?'Prova':'Trabalho')+': '+t.title));
    return items.length? 'Amanhã você tem: '+items.join('; ')+'.' : 'Amanhã não tem nada registrado ainda.';
  }
  if(ql.includes('tarefa')){
    const pend=DB.tasks.filter(t=>!t.done);
    return pend.length? 'Suas tarefas pendentes: '+pend.map(t=>t.title+(t.date?' ('+fmtDate(t.date)+')':'')).join('; ')+'.' : 'Você não tem tarefas pendentes. 🎉';
  }
  if(ql.includes('prova') || ql.includes('trabalho')){
    const upcoming=DB.trabalhos.filter(t=>t.date>=today).sort((a,b)=>a.date.localeCompare(b.date));
    return upcoming.length? 'Próximos: '+upcoming.map(t=>(t.type==='prova'?'Prova':'Trabalho')+' "'+t.title+'" em '+fmtDate(t.date)).join('; ')+'.' : 'Nenhuma prova ou trabalho registrado.';
  }
  if(ql.includes('meta')){
    return DB.goals.length? 'Suas metas: '+DB.goals.map(g=>g.title+' ('+g.progress+'%)').join('; ')+'.' : 'Você ainda não criou metas.';
  }
  if(ql.includes('progresso')){
    if(DB.goals.length===0) return 'Você ainda não tem metas para acompanhar progresso.';
    const avg = Math.round(DB.goals.reduce((s,g)=>s+g.progress,0)/DB.goals.length);
    return 'Seu progresso médio nas metas é de '+avg+'%.';
  }
  if(ql.includes('agenda') || ql.includes('evento')){
    const up=DB.agenda.filter(e=>e.date>=today).sort((a,b)=>a.date.localeCompare(b.date));
    return up.length? 'Próximos eventos: '+up.map(e=>e.title+' em '+fmtDate(e.date)).join('; ')+'.' : 'Nenhum evento futuro na agenda.';
  }
  if(ql.includes('assunto') || ql.includes('nas aulas') || ql.includes('na aula')){
    const found = DB.assuntos.filter(a=> normalizeSearch(a.aulaName).includes(normalizeSearch(ql)) || ql.includes(normalizeSearch(a.aulaName)));
    const list = found.length ? found : DB.assuntos.slice(-5);
    return list.length ? 'Assuntos registrados: '+list.map(a=>(a.aulaName?a.aulaName+' ('+fmtDate(a.date)+'): ':fmtDate(a.date)+': ')+a.content).join(' | ') : 'Você ainda não registrou nenhum assunto. Vai lá em Assuntos!';
  }
  if(ql.includes('nota')){
    const done = DB.trabalhos.filter(t=>t.grade!=null && t.grade!=='');
    return done.length ? 'Suas notas registradas: '+done.map(t=>t.title+': '+t.grade).join('; ')+'.' : 'Você ainda não registrou nenhuma nota em Notas.';
  }
  if(ql.includes('hoje')){
    const items=[];
    DB.tasks.filter(t=>t.date===today && !t.done).forEach(t=>items.push('Tarefa: '+t.title));
    DB.agenda.filter(e=>e.date===today).forEach(e=>items.push(e.title));
    DB.trabalhos.filter(t=>t.date===today).forEach(t=>items.push((t.type==='prova'?'Prova':'Trabalho')+': '+t.title));
    return items.length? 'Hoje você tem: '+items.join('; ')+'.' : 'Hoje não tem nada registrado.';
  }
  return 'Posso responder sobre tarefas, agenda, provas/trabalhos, metas e progresso. Tenta perguntar de outro jeito!';
}

/* ---------------- PET (Alfa) — só o Steve, extraído da imagem de referência ---------------- */
function rectPx(x,y,w,h,c){ const out=[]; for(let yy=y;yy<y+h;yy++) for(let xx=x;xx<x+w;xx++) out.push([xx,yy,c]); return out; }
function pixelBoxShadow(pixels, size){ return pixels.map(([x,y,c])=> (x*size)+'px '+(y*size)+'px 0 '+c).join(','); }
function trianglePx(x0,y0,size,color){
  const out=[]; const half=Math.floor(size/2);
  for(let i=0;i<=half;i++){
    out.push(...rectPx(x0, y0+half-i, i+1, 1, color));
    if(i>0) out.push(...rectPx(x0, y0+half+i, i+1, 1, color));
  }
  return out;
}

function attachPetDrag(el, id, tail){
  let dragging=false, offX=0, offY=0, moved=false, startX=0, startY=0;
  let lastX=0, lastY=0, lastT=0;
  let tailAngle=0; // ângulo atual (suavizado) do rabinho, em graus
  let settleTimer=null;

  el.addEventListener('pointerdown', (e)=>{
    dragging=true; moved=false;
    clearTimeout(settleTimer);
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    const rect=el.getBoundingClientRect();
    offX = e.clientX-rect.left; offY = e.clientY-rect.top;
    startX = e.clientX; startY = e.clientY;
    lastX = e.clientX; lastY = e.clientY; lastT = performance.now();
  });

  el.addEventListener('pointermove', (e)=>{
    if(!dragging) return;
    if(Math.abs(e.clientX-startX)>4 || Math.abs(e.clientY-startY)>4) moved=true;
    el.style.left=(e.clientX-offX)+'px'; el.style.top=(e.clientY-offY)+'px';

    if(tail){
      const now = performance.now();
      const dt = Math.max(now-lastT, 16); // evita divisão por ~0
      const vx = (e.clientX-lastX)/dt; // velocidade horizontal (px/ms)
      const vy = (e.clientY-lastY)/dt; // velocidade vertical (px/ms)

      // ângulo-alvo: o rabinho "arrasta atrás", reagindo na direção OPOSTA ao movimento
      // (movendo pra direita → rabinho puxa pra esquerda, e vice-versa; idem vertical)
      const targetAngle = Math.max(-18, Math.min(18, (-vx*55) + (-vy*25)));

      // suaviza (lerp) pra não tremer a cada micro-mudança de direção da mão
      tailAngle += (targetAngle - tailAngle) * 0.35;
      tail.style.transform = 'rotate('+tailAngle.toFixed(1)+'deg)';

      lastX = e.clientX; lastY = e.clientY; lastT = now;
    }
  });

  const endDrag=()=>{
    if(!dragging) return;
    dragging=false;
    if(tail){
      // solta a mão: rabinho volta suavemente pro neutro (0deg)
      tailAngle = 0;
      tail.style.transform = 'rotate(0deg)';
    }
    if(moved){
      DB.settings.petPositions = DB.settings.petPositions || {};
      DB.settings.petPositions[id] = {x: parseFloat(el.style.left)||0, y: parseFloat(el.style.top)||0};
      saveDB();
    } else {
      petTap();
    }
  };
  el.addEventListener('pointerup', endDrag);
  el.addEventListener('pointercancel', endDrag);
}
function showSteveOverlay(pixels, duration){
  const overlay=document.getElementById('steve-react-overlay');
  if(!overlay) return;
  overlay.style.boxShadow=pixelBoxShadow(pixels, STEVE_SIZE);
  overlay.classList.add('show');
  clearTimeout(overlay._t);
  overlay._t=setTimeout(()=>overlay.classList.remove('show'), duration);
}
function petTap(){
  const el=document.getElementById('pet-steve');

  el.classList.remove('jumping'); void el.offsetWidth; el.classList.add('jumping');
  showSteveOverlay(STEVE_HEART_LOCAL, 3000);

function petReact(){

// efeito de "estática de TV antiga": bem raro e bem rápido, de propósito, pra não pesar
function scheduleSteveGlitch(){
  clearTimeout(window._steveGlitchTimer);
  window._steveGlitchTimer = setTimeout(()=>{
    const sprite = document.querySelector('#pet-steve .pixel-pet-sprite');
    if(sprite){
      const gx = 6+Math.floor(Math.random()*12);
      const gy = 8+Math.floor(Math.random()*6);
      const dot=document.createElement('div');
      dot.style.cssText = 'position:absolute; width:'+STEVE_SIZE+'px; height:'+STEVE_SIZE+'px; left:'+(gx*STEVE_SIZE)+'px; top:'+(gy*STEVE_SIZE)+'px; background:#e4e4ea; pointer-events:none;';
      sprite.appendChild(dot);
      setTimeout(()=>dot.remove(), 120);
    }
    scheduleSteveGlitch();
  }, 5000+Math.random()*5000);
}

function openChecklistForm(){
  const body = document.getElementById('body-checklist');
  body.innerHTML = `
    <div class="form-card">
      <div class="field"><label>Nome da checklist</label><input id="cl-title" placeholder="Ex: Preparar mochila"></div>

}
function saveChecklist(){
  const title = document.getElementById('cl-title').value.trim();
  if(!title){ toast('Dê um nome pra checklist'); return; }
  DB.checklistData.push({id:uid(), title, items:[]});
  saveDB(); renderChecklist(); toast('Checklist criada!', true);
}
function deleteChecklist(id){
  if(!confirm('Excluir essa checklist? Essa ação não pode ser desfeita.')) return;
  DB.checklistData = DB.checklistData.filter(c=>c.id!==id);
  saveDB(); renderChecklist();
}
function addChecklistItem(clId){
  const input = document.getElementById('new-item-'+clId);
  const text = input.value.trim();
  if(!text) return;
  const cl = DB.checklistData.find(c=>c.id===clId);
  if(!cl) return;
  cl.items.push({id:uid(), text, done:false});
  saveDB(); drawChecklists();
}
function toggleChecklistItem(clId, itemId){
  const cl = DB.checklistData.find(c=>c.id===clId);
  if(!cl) return;
  const it = cl.items.find(i=>i.id===itemId);
  if(!it) return;
  it.done = !it.done;
  saveDB(); drawChecklists();
}
function deleteChecklistItem(clId, itemId){
  const cl = DB.checklistData.find(c=>c.id===clId);
  if(!cl) return;
  cl.items = cl.items.filter(i=>i.id!==itemId);
  saveDB(); drawChecklists();
}
function resetChecklist(clId){
  const cl = DB.checklistData.find(c=>c.id===clId);
  if(!cl) return;
  cl.items.forEach(i=>i.done=false);
  saveDB(); drawChecklists(); toast('Checklist reiniciada!');
}
function duplicateChecklist(clId){
  const cl = DB.checklistData.find(c=>c.id===clId);
  if(!cl) return;
  const copy = {id:uid(), title:cl.title+' (cópia)', items:cl.items.map(i=>({id:uid(), text:i.text, done:false}))};
  DB.checklistData.push(copy);
  saveDB(); renderChecklist(); toast('Checklist duplicada!');
}

      <div class="field"><label>Progresso % (opcional)</label><input id="game-progress" type="number" min="0" max="100" value="${g&&g.progress!=null?g.progress:''}"></div>
      <div class="field"><label>Horas jogadas (opcional)</label><input id="game-hours" type="number" min="0" value="${g&&g.hours!=null?g.hours:''}"></div>
      <div class="field"><label>Avaliação 1-5 (opcional)</label><input id="game-rating" type="number" min="1" max="5" value="${g&&g.rating!=null?g.rating:''}"></div>
      <div class="field"><label>Observações (opcional)</label><textarea id="game-notes">${g?esc(g.notes||''):''}</textarea></div>
      <button class="btn-primary" onclick="saveGame(${g?`'${g.id}'`:'null'})">Salvar</button>
    </div>` + body.innerHTML;
}
function saveGame(editId){
  const name = document.getElementById('game-name').value.trim();
  if(!name){ toast('Dê um nome ao jogo'); return; }
  const fileInput = document.getElementById('game-cover');
  const fields = {
    name,
    platform:document.getElementById('game-platform').value.trim(),
    status:document.getElementById('game-status').value,
    genre:document.getElementById('game-genre').value.trim(),
    progress:document.getElementById('game-progress').value ? Number(document.getElementById('game-progress').value) : null,
    hours:document.getElementById('game-hours').value ? Number(document.getElementById('game-hours').value) : null,
    rating:document.getElementById('game-rating').value ? Number(document.getElementById('game-rating').value) : null,
    notes:document.getElementById('game-notes').value.trim()
  };
  const finish = (coverData)=>{
    if(editId){
      const g = DB.gamingData.find(x=>x.id===editId);
      Object.assign(g, fields);
      if(coverData) g.cover = coverData;
    } else {
      DB.gamingData.push({id:uid(), ...fields, cover:coverData||null, fav:false, startDate:todayStr(), endDate:null});
    }
    saveDB(); renderGaming(); toast('Salvo!', true);
  };
  if(fileInput.files && fileInput.files[0]){
    const reader = new FileReader();
    reader.onload = (e)=>finish(e.target.result);
    reader.readAsDataURL(fileInput.files[0]);
  } else { finish(null); }
}

/* ---------------- 📚 BIBLIOTECA ---------------- */
const LIVRO_STATUSES = ['Quero ler','Lendo','Lido','Pausado','Abandonado'];
let bibliotecaFilter = 'todos';
function renderBiblioteca(){
  const body = document.getElementById('body-biblioteca');
  let html = `<div class="field"><input id="livro-search" placeholder="Pesquisar livros..." oninput="filterBiblioteca()"></div>`;
  html += `<div style="display:flex; gap:8px; margin-bottom:16px; overflow-x:auto;">
      <button class="btn-secondary" style="white-space:nowrap;" onclick="setBibliotecaFilter('todos')">📚 Todos</button>
      <button class="btn-secondary" style="white-space:nowrap;" onclick="setBibliotecaFilter('Lendo')">📕 Lendo</button>
      <button class="btn-secondary" style="white-space:nowrap;" onclick="setBibliotecaFilter('Lido')">✅ Lidos</button>
      <button class="btn-secondary" style="white-space:nowrap;" onclick="setBibliotecaFilter('Quero ler')">📖 Quero ler</button>
      <button class="btn-secondary" style="white-space:nowrap;" onclick="setBibliotecaFilter('fav')">⭐ Favoritos</button>
    </div>`;

  body.innerHTML = html;
  drawBiblioteca();
}
function setBibliotecaFilter(f){ bibliotecaFilter = f; drawBiblioteca(); }
function getFilteredLivros(){
  let list = DB.bibliotecaData;
  if(bibliotecaFilter==='fav') list = list.filter(l=>l.fav);
  else if(bibliotecaFilter!=='todos') list = list.filter(l=>l.status===bibliotecaFilter);
  return list;
}
function livroCardHtml(l){
  const pct = l.pages ? Math.min(100, Math.round((l.pagesRead||0)/l.pages*100)) : null;
  return `
    <div class="item-card">
      <div class="item-top">
        <div style="display:flex; gap:10px; flex:1;">
          ${l.cover?`<img src="${l.cover}" style="width:52px; height:70px; border-radius:8px; object-fit:cover; flex-shrink:0;">`:`<div class="icon" style="width:52px; height:70px; border-radius:8px; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.06); flex-shrink:0;">📚</div>`}
          <div style="flex:1;">
            <div class="item-title">${esc(l.title)} ${l.fav?'⭐':''}</div>
            <div class="item-meta">${esc(l.author||'')}</div>
            <span class="chip green">${esc(l.status)}</span>
          </div>
        </div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          <button class="icon-btn" onclick="toggleLivroFav('${l.id}')">${l.fav?'★':'☆'}</button>
          <button class="icon-btn danger" onclick="deleteLivro('${l.id}')">🗑</button>
        </div>
      </div>
      ${pct!=null?`<div class="item-meta" style="margin-top:8px;">${l.pagesRead||0} / ${l.pages} páginas · ${pct}%</div>`:''}
      ${l.rating?`<div class="item-meta">Avaliação: ${'⭐'.repeat(Math.min(5,Number(l.rating)||0))}</div>`:''}
      ${l.notes?`<div class="item-desc">${esc(l.notes)}</div>`:''}
      <button class="btn-secondary" style="width:100%; margin-top:10px;" onclick="openLivroForm('${l.id}')">✏️ Editar</button>
    </div>`;
}
function drawBiblioteca(){
  const wrap = document.getElementById('livro-list');
  if(!wrap) return;
  const list = getFilteredLivros();
  wrap.innerHTML = list.length ? list.map(livroCardHtml).join('') : '<div class="empty-state"><div class="em">📚</div><p>Nenhum livro na sua biblioteca ainda.</p></div>';
}
function filterBiblioteca(){
  const q = normalizeSearch(document.getElementById('livro-search').value);
  const wrap = document.getElementById('livro-list');
  const list = getFilteredLivros().filter(l=>normalizeSearch(l.title).includes(q) || normalizeSearch(l.author).includes(q));
  wrap.innerHTML = list.length ? list.map(livroCardHtml).join('') : '<div class="empty-state"><div class="em">📚</div><p>Nada encontrado.</p></div>';
}
function toggleLivroFav(id){
  const l = DB.bibliotecaData.find(x=>x.id===id);
  if(!l) return;
  l.fav = !l.fav;
  saveDB(); drawBiblioteca();
}
function deleteLivro(id){
  if(!confirm('Remover esse livro da biblioteca?')) return;
  DB.bibliotecaData = DB.bibliotecaData.filter(l=>l.id!==id);
  saveDB(); drawBiblioteca();
}
function openLivroForm(editId){

/* ---------------- 🖼️ GALERIA ---------------- */
let galeriaView = 'todas'; // 'todas' | 'favoritos' | albumId
function renderGaleria(){
  const body = document.getElementById('body-galeria');
  let html = `<div class="field"><input id="galeria-search" placeholder="Pesquisar imagens..." oninput="filterGaleria()"></div>`;
  html += `<div style="display:flex; gap:8px; margin-bottom:12px; overflow-x:auto;" id="galeria-tabs"></div>`;
  html += `<div style="display:flex; gap:8px; margin-bottom:16px;">
      <label class="btn-primary" style="flex:1; text-align:center; cursor:pointer; position:relative; overflow:hidden;">📷 Adicionar imagem<input id="galeria-upload" type="file" accept="image/*" style="position:absolute; width:1px; height:1px; opacity:0;" onchange="quickAddGaleriaImage(this)"></label>
      <button class="btn-secondary" onclick="openNewAlbumForm()">📁 Novo álbum</button>
    </div>`;
  html += `<div id="galeria-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:10px;"></div>`;
  body.innerHTML = html;
  drawGaleriaTabs();
  drawGaleria();
}
function drawGaleriaTabs(){
  const wrap = document.getElementById('galeria-tabs');
  if(!wrap) return;
  let html = `<button class="btn-secondary" style="white-space:nowrap; ${galeriaView==='todas'?'background:var(--verde); color:#fff;':''}" onclick="setGaleriaView('todas')">Todas</button>`;
  html += `<button class="btn-secondary" style="white-space:nowrap; ${galeriaView==='favoritos'?'background:var(--verde); color:#fff;':''}" onclick="setGaleriaView('favoritos')">⭐ Favoritos</button>`;
  DB.galeriaAlbums.forEach(a=>{
    html += `<button class="btn-secondary" style="white-space:nowrap; ${galeriaView===a.id?'background:var(--verde); color:#fff;':''}" onclick="setGaleriaView('${a.id}')">${esc(a.name)}</button>`;
  });
  wrap.innerHTML = html;
}
function setGaleriaView(v){ galeriaView = v; drawGaleriaTabs(); drawGaleria(); }
function getFilteredGaleria(){
  let list = DB.galeriaData;
  if(galeriaView==='favoritos') list = list.filter(i=>i.fav);
  else if(galeriaView!=='todas') list = list.filter(i=>i.album===galeriaView);
  return list;
}
function galeriaGridItemHtml(img){
  return `
    <div class="item-card" style="padding:0; overflow:hidden; cursor:pointer;" onclick="openGaleriaImage('${img.id}')">
      <img src="${img.image}" style="width:100%; height:140px; object-fit:cover; display:block;">
      <div style="padding:8px 10px;">
        <div class="item-title" style="font-size:12.5px;">${esc(img.title||'Sem título')} ${img.fav?'⭐':''}</div>
      </div>
    </div>`;
}
function drawGaleria(){
  const wrap = document.getElementById('galeria-grid');
  if(!wrap) return;
  const list = [...getFilteredGaleria()].sort((a,b)=>b.date.localeCompare(a.date));
  wrap.innerHTML = list.length ? list.map(galeriaGridItemHtml).join('') : '<div class="empty-state" style="grid-column:1/-1;"><div class="em">🖼️</div><p>Nenhuma imagem por aqui ainda.</p></div>';
}
function filterGaleria(){
  const q = normalizeSearch(document.getElementById('galeria-search').value);
  const wrap = document.getElementById('galeria-grid');
  const list = getFilteredGaleria().filter(i=> normalizeSearch(i.title).includes(q) || (i.tags||[]).some(t=>normalizeSearch(t).includes(q)));
  wrap.innerHTML = list.length ? list.map(galeriaGridItemHtml).join('') : '<div class="empty-state" style="grid-column:1/-1;"><div class="em">🖼️</div><p>Nada encontrado.</p></div>';
}
function quickAddGaleriaImage(input){
  if(!input.files || !input.files[0]) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    DB.galeriaData.push({id:uid(), image:e.target.result, title:'', desc:'', album:galeriaView!=='todas'&&galeriaView!=='favoritos'?galeriaView:'', tags:[], date:todayStr(), fav:false});
    saveDB(); drawGaleria(); toast('Imagem adicionada!', true);
  };
  reader.readAsDataURL(input.files[0]);
}
function openNewAlbumForm(){
  const name = prompt('Nome do novo álbum:');
  if(!name || !name.trim()) return;
  DB.galeriaAlbums.push({id:uid(), name:name.trim()});
  saveDB(); drawGaleriaTabs(); toast('Álbum criado!');
}
function openGaleriaImage(id){
  const img = DB.galeriaData.find(i=>i.id===id);
  if(!img) return;
  const body = document.getElementById('body-galeria');
  const albumOptions = `<option value="">Sem álbum</option>` + DB.galeriaAlbums.map(a=>`<option value="${a.id}" ${img.album===a.id?'selected':''}>${esc(a.name)}</option>`).join('');
  body.innerHTML = `
    <div class="form-card">
      <img src="${img.image}" style="width:100%; border-radius:12px; margin-bottom:14px; max-height:320px; object-fit:contain; background:rgba(0,0,0,0.04);">
      <div class="field"><label>Título</label><input id="gal-title" value="${esc(img.title||'')}"></div>
      <div class="field"><label>Descrição</label><textarea id="gal-desc">${esc(img.desc||'')}</textarea></div>
      <div class="field"><label>Álbum</label><select id="gal-album">${albumOptions}</select></div>
      <div class="field"><label>Tags (separadas por vírgula)</label><input id="gal-tags" value="${esc((img.tags||[]).join(', '))}"></div>
      <div style="display:flex; gap:8px;">
        <button class="btn-secondary" style="flex:1;" onclick="toggleGaleriaFav('${img.id}')">${img.fav?'★ Favoritado':'☆ Favoritar'}</button>
        <button class="btn-secondary" style="flex:1; color:var(--danger); border-color:var(--danger);" onclick="deleteGaleriaImage('${img.id}')">🗑 Excluir</button>
      </div>
      <button class="btn-primary" style="margin-top:10px;" onclick="saveGaleriaImageInfo('${img.id}')">Salvar</button>
    </div>` + `<button class="btn-secondary" style="width:100%; margin-top:12px;" onclick="renderGaleria()">← Voltar pra galeria</button>`;
}
function toggleGaleriaFav(id){
  const img = DB.galeriaData.find(i=>i.id===id);
  if(!img) return;
  img.fav = !img.fav;
  saveDB(); openGaleriaImage(id);
}
function deleteGaleriaImage(id){
  if(!confirm('Excluir essa imagem? Essa ação não pode ser desfeita.')) return;
  DB.galeriaData = DB.galeriaData.filter(i=>i.id!==id);
  saveDB(); renderGaleria(); toast('Imagem excluída');
}
function saveGaleriaImageInfo(id){
  const img = DB.galeriaData.find(i=>i.id===id);
  if(!img) return;
  img.title = document.getElementById('gal-title').value.trim();
  img.desc = document.getElementById('gal-desc').value.trim();
  img.album = document.getElementById('gal-album').value;
  img.tags = document.getElementById('gal-tags').value.split(',').map(t=>t.trim()).filter(Boolean);
  saveDB(); renderGaleria(); toast('Salvo!', true);
}

/* ---------------- 📊 ESTATÍSTICAS ---------------- */
function statBar(label, value, max, color){
  const pct = max>0 ? Math.min(100, Math.round(value/max*100)) : 0;
  return `
    <div style="margin-bottom:12px;">
      <div style="display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px;">
        <span>${esc(label)}</span><span style="font-weight:700;">${value}</span>
      </div>
      <div style="height:8px; border-radius:999px; background:rgba(0,0,0,0.06); overflow:hidden;">
        <div style="height:100%; width:${pct}%; background:${color||'var(--verde)'}; border-radius:999px;"></div>
      </div>
    </div>`;
}
function statNumberCard(emoji, value, label){
  return `
    <div class="item-card" style="text-align:center; flex:1;">
      <div style="font-size:22px;">${emoji}</div>
      <div style="font-size:20px; font-weight:700; margin-top:4px;">${value}</div>
      <div class="item-meta">${esc(label)}</div>
    </div>`;
}
function renderEstatisticas(){
  const body = document.getElementById('body-estatisticas');
  const today = todayStr();
  let html = '';

  // Tarefas
  const tasksDone = DB.tasks.filter(t=>t.done).length;
  const tasksPending = DB.tasks.filter(t=>!t.done).length;
  const tasksLate = DB.tasks.filter(t=>!t.done && t.date && t.date<today).length;
  html += `<div class="section-label" style="margin-top:0;">✅ Tarefas</div>`;
  html += `<div style="display:flex; gap:10px; margin-bottom:18px;">`;
  html += statNumberCard('✅', tasksDone, 'Concluídas');
  html += statNumberCard('🕓', tasksPending, 'Pendentes');
  html += statNumberCard('⚠️', tasksLate, 'Atrasadas');
  html += `</div>`;

  // Hábitos
  html += `<div class="section-label">🔄 Hábitos</div>`;
  html += `<div class="item-card">`;
  const streakDays = (DB.streak && DB.streak.current) || 0;
  html += statBar('Sequência atual (dias)', streakDays, Math.max(streakDays,30), 'var(--amarelo-escuro)');
  html += statBar('Hábitos cadastrados', DB.habits.length, Math.max(DB.habits.length,10));
  html += `</div>`;

  // Metas
  html += `<div class="section-label">🎯 Metas</div>`;
  const goalsDone = DB.goals.filter(g=>g.progress>=100).length;
  html += `<div style="display:flex; gap:10px; margin-bottom:18px;">`;
  html += statNumberCard('🎯', DB.goals.length, 'Ativas/Totais');
  html += statNumberCard('✅', goalsDone, 'Concluídas');
  html += `</div>`;

  // Estudos
  html += `<div class="section-label">🏫 Estudos</div>`;
  const trabalhosDone = DB.trabalhos.filter(t=>t.grade!=null && t.grade!=='').length;
  const trabalhosPending = DB.trabalhos.filter(t=>t.grade==null || t.grade==='').length;
  html += `<div style="display:flex; gap:10px; margin-bottom:18px;">`;
  html += statNumberCard('📚', DB.trabalhos.length, 'Trabalhos/Provas');
  html += statNumberCard('📊', trabalhosDone, 'Já com nota');
  html += statNumberCard('⏳', trabalhosPending, 'Aguardando nota');
  html += `</div>`;

  // Gaming (só se instalado)
  if(isModuleInstalled('gaming')){
    const games = DB.gamingData;
    const gDone = games.filter(g=>g.status==='Concluído').length;
    const gPlaying = games.filter(g=>g.status==='Jogando').length;
    const totalHours = games.reduce((s,g)=>s+(Number(g.hours)||0),0);
    html += `<div class="section-label">🎮 Gaming</div>`;
    html += `<div style="display:flex; gap:10px; margin-bottom:18px;">`;
    html += statNumberCard('✅', gDone, 'Concluídos');
    html += statNumberCard('▶️', gPlaying, 'Jogando');
    html += statNumberCard('🕒', totalHours, 'Horas registradas');
    html += `</div>`;
  }

  // Biblioteca (só se instalada)
  if(isModuleInstalled('biblioteca')){
    const livros = DB.bibliotecaData;
    const lDone = livros.filter(l=>l.status==='Lido').length;
    const pagesRead = livros.reduce((s,l)=>s+(Number(l.pagesRead)||0),0);
    html += `<div class="section-label">📚 Biblioteca</div>`;
    html += `<div style="display:flex; gap:10px; margin-bottom:18px;">`;
    html += statNumberCard('✅', lDone, 'Livros lidos');
    html += statNumberCard('📄', pagesRead, 'Páginas lidas');
    html += `</div>`;
  }

  body.innerHTML = html;
}

      <div class="field"><label>Nome da caixa</label><input id="box-name" value="${box?esc(box.name):''}" placeholder="Ex: Ideias, Escola, Projetos..."></div>
      <button class="btn-primary" onclick="saveBox(${box?`'${box.id}'`:'null'})">${box?'Salvar':'Criar caixa'}</button>
    </div>` + body.innerHTML;
}
function saveBox(editId){
  const name = document.getElementById('box-name').value.trim();
  if(!name){ toast('Dê um nome pra caixa'); return; }
  if(editId){
    const box = DB.boxyData.find(b=>b.id===editId);
    box.name = name;
  } else {
    DB.boxyData.push({id:uid(), name, papers:[]});
  }
  saveDB(); drawBoxyList(); toast(editId?'Caixa atualizada!':'Caixa criada!', true);
}
function confirmDeleteBox(boxId){
  const box = DB.boxyData.find(b=>b.id===boxId);
  if(!box) return;
  const msg = box.papers.length>0
    ? `Excluir a caixa "${box.name}"? Os ${box.papers.length} papéis dentro dela também serão excluídos. Essa ação não pode ser desfeita.`
    : `Excluir a caixa "${box.name}"? Essa ação não pode ser desfeita.`;
  if(!confirm(msg)) return;
  DB.boxyData = DB.boxyData.filter(b=>b.id!==boxId);
  saveDB(); drawBoxyList(); toast('Caixa excluída');
}
function openBox(boxId){
  boxyView = boxId;
  const box = DB.boxyData.find(b=>b.id===boxId);
  if(!box) return;
  document.getElementById('boxy-header-title').textContent = box.name;
  drawBoxOpen(boxId);
}
function drawBoxOpen(boxId){
  const box = DB.boxyData.find(b=>b.id===boxId);
  if(!box) return;
  const body = document.getElementById('body-boxy');
  let html = `
    <div style="display:flex; gap:8px; margin-bottom:16px;">
      <button class="btn-secondary" style="flex:1;" onclick="openBoxForm('${box.id}')">✏️ Renomear</button>
      <button class="btn-secondary" style="flex:1; color:var(--danger); border-color:var(--danger);" onclick="confirmDeleteBox('${box.id}')">🗑 Excluir caixa</button>
    </div>
    <button class="btn-primary" style="width:100%; margin-bottom:16px;" onclick="openPaperForm('${box.id}')">+ Novo papel</button>`;
  if(box.papers.length===0){
    html += '<div class="empty-state"><div class="em">📄</div><p>Nenhum papel nessa caixa ainda.</p></div>';
  } else {
    html += box.papers.map(p=>paperCardHtml(box.id, p)).join('');
  }
  body.innerHTML = html;
}
function paperCardHtml(boxId, p){
  return `
    <div class="boxy-paper" onclick="openPaperView('${boxId}','${p.id}')">
      <div class="item-title">${esc(p.title||'Sem título')}</div>
      ${p.text?`<div class="item-desc">${esc(p.text.slice(0,80))}${p.text.length>80?'...':''}</div>`:''}
      ${p.links && p.links.length ? `<div class="item-meta">🔗 ${p.links.length} link${p.links.length>1?'s':''}</div>` : ''}
    </div>`;
}
function openPaperView(boxId, paperId){
  const box = DB.boxyData.find(b=>b.id===boxId);
  const paper = box.papers.find(p=>p.id===paperId);
  if(!paper) return;
  const body = document.getElementById('body-boxy');
  body.innerHTML = `
    <button class="btn-secondary" style="width:100%; margin-bottom:14px;" onclick="drawBoxOpen('${boxId}')">← Voltar pra caixa</button>
    <div class="boxy-paper-full">
      <div class="item-title" style="font-size:17px;">${esc(paper.title||'Sem título')}</div>
      ${paper.text?`<div class="item-desc" style="margin-top:10px; white-space:pre-wrap;">${esc(paper.text)}</div>`:''}
      ${paper.links && paper.links.length ? `
        <div style="margin-top:14px;">
          <div class="item-meta" style="font-weight:700; margin-bottom:6px;">Links</div>
          ${paper.links.map(l=>`<div class="item-meta">🔗 <a href="${esc(l)}" target="_blank" rel="noopener" style="color:var(--verde); word-break:break-all;">${esc(l)}</a></div>`).join('')}
        </div>` : ''}
    </div>
    <div style="display:flex; gap:8px; margin-top:14px;">
      <button class="btn-secondary" style="flex:1;" onclick="openPaperForm('${boxId}','${paperId}')">✏️ Editar</button>
      <button class="btn-secondary" style="flex:1; color:var(--danger); border-color:var(--danger);" onclick="deletePaper('${boxId}','${paperId}')">🗑 Excluir</button>
    </div>`;
}
function openPaperForm(boxId, editId){
  const box = DB.boxyData.find(b=>b.id===boxId);
  const paper = editId ? box.papers.find(p=>p.id===editId) : null;
  const body = document.getElementById('body-boxy');
  body.innerHTML = `
    <div class="form-card">
      <div class="field"><label>Título</label><input id="paper-title" value="${paper?esc(paper.title||''):''}" placeholder="Título do papel"></div>
      <div class="field"><label>Texto</label><textarea id="paper-text" rows="6" placeholder="Escreva algo...">${paper?esc(paper.text||''):''}</textarea></div>
      <div class="field"><label>Links (um por linha, opcional)</label><textarea id="paper-links" rows="3" placeholder="https://...">${paper&&paper.links?esc(paper.links.join('\n')):''}</textarea></div>
      <button class="btn-primary" onclick="savePaper('${boxId}', ${editId?`'${editId}'`:'null'})">Salvar</button>
    </div>`;
}
function savePaper(boxId, editId){
  const title = document.getElementById('paper-title').value.trim();
  const text = document.getElementById('paper-text').value.trim();
  const links = document.getElementById('paper-links').value.split('\n').map(l=>l.trim()).filter(Boolean);
  if(!title && !text){ toast('Escreva algo no papel antes de salvar'); return; }
  const box = DB.boxyData.find(b=>b.id===boxId);
  if(editId){
    const paper = box.papers.find(p=>p.id===editId);
    Object.assign(paper, {title, text, links});
  } else {
    box.papers.push({id:uid(), title, text, links, date:todayStr()});
  }
  saveDB();
  drawBoxOpen(boxId);
  toast('Papel salvo!', true);
}
function deletePaper(boxId, paperId){
  if(!confirm('Excluir esse papel? Essa ação não pode ser desfeita.')) return;
  const box = DB.boxyData.find(b=>b.id===boxId);
  box.papers = box.papers.filter(p=>p.id!==paperId);
  saveDB(); drawBoxOpen(boxId); toast('Papel excluído');
}

<script>
/* =====================================================================
   LIMEOS 1.0 (beta) — MÓDULOS
   Core · Storage · Capability · NativeFuture · Shell · Lock · Auth/PIN
   Cada módulo é um objeto isolado; comunicam-se por Core.bus.
   ===================================================================== */
const $ = (id) => document.getElementById(id);
const VERSION = '1.8.10';

/* ---------- Core: barramento de eventos ---------- */
const Core = {
  _h: {},
  on(ev, fn) { (this._h[ev] = this._h[ev] || []).push(fn); },
  emit(ev, data) { (this._h[ev] || []).forEach(fn => { try { fn(data); } catch (e) { console.error(ev, e); } }); },
  toastTimer: null,
  toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(this.toastTimer); this.toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }
};

/* ---------- Storage: persistência (separa config, sensíveis, wallpapers) ---------- */
const Storage = {
  P: 'limeos.', mem: {},
  get(k, d) { try { const v = localStorage.getItem(this.P + k); return v === null ? (k in this.mem ? this.mem[k] : d) : JSON.parse(v); } catch (e) { return k in this.mem ? this.mem[k] : d; } },
  set(k, v) { this.mem[k] = v; try { localStorage.setItem(this.P + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { delete this.mem[k]; try { localStorage.removeItem(this.P + k); } catch (e) {} },
  usage() { // bytes por categoria (somente dados internos do LimeOS)
    const cat = { sistema: 0, preferencias: 0, wallpapers: 0, apps: 0 };
    try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (!k.startsWith(this.P)) continue; const n = (k.length + localStorage.getItem(k).length) * 2; const s = k.slice(this.P.length);
      if (s.startsWith('wp.')) cat.wallpapers += n; else if (s.startsWith('sec.') || s === 'firstRun') cat.sistema += n; else if (s.startsWith('app.')) cat.apps += n; else cat.preferencias += n; } } catch (e) {}
    return cat;
  },
  clearAll() { try { Object.keys(localStorage).filter(k => k.startsWith(this.P)).forEach(k => localStorage.removeItem(k)); } catch (e) {} this.mem = {}; }
};

/* =====================================================================
   LIMEOS 1.5 — FileStore: armazenamento virtual real (IndexedDB)
   Camada compartilhada entre Lime Arquivos e Lime Música. Guarda uma
   árvore de pastas/arquivos com os bytes reais em Blob (nunca em
   localStorage — Blobs grandes quebrariam a quota e o limite de string).
   Um nó: { id, parentId, name, type:'folder'|'file', mime, size,
            blob (só em 'file'), createdAt, modifiedAt }
   A raiz do armazenamento da LimeOS tem parentId = null.
   ===================================================================== */
const FileStore = {
  DB_NAME: 'limeos-filestore', DB_VERSION: 1, STORE: 'nodes',
  _db: null, _ready: null,
  uid() { try { return crypto.randomUUID(); } catch (e) { return 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2); } },
  supported() { return 'indexedDB' in window; },
  open() {
    if (this._ready) return this._ready;
    this._ready = new Promise((resolve, reject) => {
      if (!this.supported()) { reject(new Error('IndexedDB indisponível neste navegador.')); return; }
      const req = indexedDB.open(this.DB_NAME, this.DB_VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(this.STORE)) {
          const os = db.createObjectStore(this.STORE, { keyPath: 'id' });
          os.createIndex('parentId', 'parentId', { unique: false });
        }
      };
      req.onsuccess = () => { this._db = req.result; resolve(this._db); };
      req.onerror = () => reject(req.error || new Error('Falha ao abrir o armazenamento.'));
    });
    return this._ready;
  },
  tx(mode) { return this.open().then(db => db.transaction(this.STORE, mode).objectStore(this.STORE)); },
  /* ---- leitura ---- */
  async get(id) { const os = await this.tx('readonly'); return new Promise((res, rej) => { const r = os.get(id); r.onsuccess = () => res(r.result || null); r.onerror = () => rej(r.error); }); },
  async listChildren(parentId) {
    const os = await this.tx('readonly'); const idx = os.index('parentId');
    return new Promise((res, rej) => { const r = idx.getAll(parentId); r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error); });
  },
  async allFiles() { // usado pela Música: todo arquivo de áudio em qualquer pasta
    const os = await this.tx('readonly');
    return new Promise((res, rej) => { const r = os.getAll(); r.onsuccess = () => res((r.result || []).filter(n => n.type === 'file')); r.onerror = () => rej(r.error); });
  },
  async ensureRoot() { // garante que existe um nó-raiz "Armazenamento da LimeOS" com id fixo
    const root = await this.get('root');
    if (root) return root;
    const node = { id: 'root', parentId: null, name: 'Armazenamento da LimeOS', type: 'folder', createdAt: Date.now(), modifiedAt: Date.now() };
    await this.put(node); return node;
  },
  /* ---- escrita ---- */
  async put(node) { const os = await this.tx('readwrite'); return new Promise((res, rej) => { const r = os.put(node); r.onsuccess = () => res(node); r.onerror = () => rej(r.error); }); },
  async createFolder(parentId, name) {
    const siblings = await this.listChildren(parentId);
    if (siblings.some(s => s.name.toLowerCase() === name.toLowerCase())) throw new Error('Já existe um item com esse nome nesta pasta.');
    const node = { id: this.uid(), parentId, name, type: 'folder', createdAt: Date.now(), modifiedAt: Date.now() };
    return this.put(node);
  },
  async createFile(parentId, name, blob, mime) {
    const siblings = await this.listChildren(parentId);
    let finalName = name, n = 1;
    while (siblings.some(s => s.name.toLowerCase() === finalName.toLowerCase())) { const dot = name.lastIndexOf('.'); finalName = dot > 0 ? `${name.slice(0, dot)} (${n})${name.slice(dot)}` : `${name} (${n})`; n++; }
    const node = { id: this.uid(), parentId, name: finalName, type: 'file', mime: mime || blob.type || 'application/octet-stream', size: blob.size, blob, createdAt: Date.now(), modifiedAt: Date.now() };
    return this.put(node);
  },
  async rename(id, newName) {
    const node = await this.get(id); if (!node) throw new Error('Item não encontrado.');
    const siblings = (await this.listChildren(node.parentId)).filter(s => s.id !== id);
    if (siblings.some(s => s.name.toLowerCase() === newName.toLowerCase())) throw new Error('Já existe um item com esse nome nesta pasta.');
    node.name = newName; node.modifiedAt = Date.now(); return this.put(node);
  },
  async move(id, newParentId) {
    if (id === newParentId) throw new Error('Não é possível mover um item para dentro de si mesmo.');
    const node = await this.get(id); if (!node) throw new Error('Item não encontrado.');
    // impede mover uma pasta para dentro de uma de suas próprias subpastas
    if (node.type === 'folder') { let p = newParentId; while (p) { if (p === id) throw new Error('Não é possível mover uma pasta para dentro dela mesma.'); const pn = await this.get(p); p = pn ? pn.parentId : null; } }
    const siblings = (await this.listChildren(newParentId)).filter(s => s.id !== id);
    if (siblings.some(s => s.name.toLowerCase() === node.name.toLowerCase())) throw new Error('Já existe um item com esse nome no destino.');
    node.parentId = newParentId; node.modifiedAt = Date.now(); return this.put(node);
  },
  async duplicate(id) {
    const node = await this.get(id); if (!node) throw new Error('Item não encontrado.');
    if (node.type === 'file') { return this.createFile(node.parentId, node.name, node.blob, node.mime); }
    // duplica pasta recursivamente
    const copy = await this.createFolder(node.parentId, node.name + ' (cópia)').catch(async () => { // nome já existe, varia
      let n = 2; while (true) { try { return await this.createFolder(node.parentId, `${node.name} (cópia ${n})`); } catch (e) { n++; if (n > 50) throw e; } }
    });
    const kids = await this.listChildren(id);
    for (const k of kids) { const kc = await this.duplicateInto(k.id, copy.id); }
    return copy;
  },
  async duplicateInto(id, newParentId) {
    const node = await this.get(id); if (!node) return null;
    if (node.type === 'file') return this.createFile(newParentId, node.name, node.blob, node.mime);
    const folder = await this.createFolder(newParentId, node.name);
    const kids = await this.listChildren(id);
    for (const k of kids) await this.duplicateInto(k.id, folder.id);
    return folder;
  },
  async remove(id) { // exclusão recursiva (pasta + todo o conteúdo)
    const node = await this.get(id); if (!node) return;
    if (node.type === 'folder') { const kids = await this.listChildren(id); for (const k of kids) await this.remove(k.id); }
    const os = await this.tx('readwrite'); return new Promise((res, rej) => { const r = os.delete(id); r.onsuccess = () => res(true); r.onerror = () => rej(r.error); });
  },
  async totalUsage() { // soma de bytes reais de todos os arquivos (não conta pastas)
    const os = await this.tx('readonly');
    return new Promise((res, rej) => { const r = os.getAll(); r.onsuccess = () => res((r.result || []).reduce((s, n) => s + (n.type === 'file' ? (n.size || 0) : 0), 0)); r.onerror = () => rej(r.error); });
  },
  /* ---- caminho (breadcrumb) ---- */
  async pathOf(id) {
    const path = []; let cur = await this.get(id);
    while (cur) { path.unshift(cur); if (!cur.parentId) break; cur = await this.get(cur.parentId); }
    return path;
  }
};

/* =====================================================================
   LIMEOS 1.7 — MediaStore: armazenamento dedicado para fotos/vídeos
   Banco IndexedDB próprio (separado do FileStore do Arquivos/Música,
   por decisão explícita do usuário ao planejar 1.7), guardando os bytes
   reais em Blob + metadados completos exigidos pela spec.
   Um registro de mídia: { id, kind:'photo'|'video', mime, size,
     blob, thumbBlob, name, createdAt (importação), capturedAt (quando
     conhecida), width, height, durationMs (vídeo), favorite:boolean,
     albumIds:[idAlbum...], trashed:boolean, trashedAt, source:'capture'|'import' }
   Um álbum: { id, name, createdAt, order:[mediaId...] }
   ===================================================================== */
const MediaStore = {
  DB_NAME: 'limeos-media', DB_VERSION: 1, STORE_MEDIA: 'media', STORE_ALBUMS: 'albums',
  _db: null, _ready: null,
  uid() { try { return crypto.randomUUID(); } catch (e) { return 'm-' + Date.now() + '-' + Math.random().toString(36).slice(2); } },
  supported() { return 'indexedDB' in window; },
  open() {
    if (this._ready) return this._ready;
    this._ready = new Promise((resolve, reject) => {
      if (!this.supported()) { reject(new Error('IndexedDB indisponível neste navegador.')); return; }
      const req = indexedDB.open(this.DB_NAME, this.DB_VERSION);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(this.STORE_MEDIA)) {
          const os = db.createObjectStore(this.STORE_MEDIA, { keyPath: 'id' });
          os.createIndex('createdAt', 'createdAt', { unique: false });
          os.createIndex('trashed', 'trashed', { unique: false });
        }
        if (!db.objectStoreNames.contains(this.STORE_ALBUMS)) {
          db.createObjectStore(this.STORE_ALBUMS, { keyPath: 'id' });
        }
      };
      req.onsuccess = () => { this._db = req.result; resolve(this._db); };
      req.onerror = () => reject(req.error || new Error('Falha ao abrir o armazenamento de mídia.'));
    });
    return this._ready;
  },
  tx(store, mode) { return this.open().then(db => db.transaction(store, mode).objectStore(store)); },
  async persistRequest() { // pede armazenamento persistente quando a API existe — melhor esforço, nunca bloqueia
    try { if (navigator.storage && navigator.storage.persist) return await navigator.storage.persist(); } catch (e) {} return false;
  },
  async estimate() { // quota/uso real quando o navegador oferece
    try { if (navigator.storage && navigator.storage.estimate) return await navigator.storage.estimate(); } catch (e) {} return null;
  },
  /* ---- leitura ---- */
  async getMedia(id) { const os = await this.tx(this.STORE_MEDIA, 'readonly'); return new Promise((res, rej) => { const r = os.get(id); r.onsuccess = () => res(r.result || null); r.onerror = () => rej(r.error); }); },

  async trash() { const all = await this.allMedia(); return all.filter(m => !!m.trashed); },
  async allAlbums() { const os = await this.tx(this.STORE_ALBUMS, 'readonly'); return new Promise((res, rej) => { const r = os.getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error); }); },

  async deleteAlbumRow(id) { const os = await this.tx(this.STORE_ALBUMS, 'readwrite'); return new Promise((res, rej) => { const r = os.delete(id); r.onsuccess = () => res(true); r.onerror = () => rej(r.error); }); },

  async addMedia({ kind, mime, blob, thumbBlob, name, width, height, durationMs, source, capturedAt }) {
    const rec = {
      id: this.uid(), kind, mime, size: blob.size, blob, thumbBlob: thumbBlob || null,
      name: name || (kind === 'photo' ? 'Foto' : 'Vídeo') + '_' + Date.now(),
      createdAt: Date.now(), capturedAt: capturedAt || Date.now(),

  async trashMedia(id) { const m = await this.getMedia(id); if (!m) throw new Error('Mídia não encontrada.'); m.trashed = true; m.trashedAt = Date.now(); await this.putMedia(m); return m; },

  },
  async deleteAlbum(id) { // só remove a coleção virtual — nunca apaga as mídias

  },
  async totalUsage() { const all = await this.allMedia(); return all.reduce((s, m) => s + (m.size || 0) + (m.thumbBlob ? m.thumbBlob.size : 0), 0); }
};

/* ---------- Auth: camada abstrata (PIN + WebAuthn quando suportado) ---------- */
const Auth = {
  async hash(pin) {
    const s = 'limeos:' + pin;
    try { if (window.crypto && crypto.subtle) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return 'sha256:' + Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join(''); } } catch (e) {}
    let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return 'djb:' + h;
  },
  async init() { if (!Storage.get('sec.pin', null)) Storage.set('sec.pin', await this.hash('0000')); },
  async verifyPin(pin) { return (await this.hash(pin)) === Storage.get('sec.pin', null); },
  async setPin(pin) { Storage.set('sec.pin', await this.hash(pin)); },
  biometricAvailable() { return Capability.has('webauthn'); },
  /* ===== 1.8.9 — Biometria real via WebAuthn =====
     O LimeOS, como PWA, não lê a impressão digital/rosto diretamente — ninguém faz isso no
     navegador. O que é real aqui é a API WebAuthn do próprio navegador/SO: ela pede ao usuário
     para usar o autenticador da plataforma (Face ID/Touch ID/impressão digital/PIN do SO) e
     devolve uma prova criptográfica, sem o LimeOS jamais ver o dado biométrico em si. Isso
     obrigatoriamente abre o prompt nativo do navegador/SO — nenhum código pode suprimir essa
     etapa, é a própria garantia de segurança do WebAuthn. O credential ID fica salvo localmente
     (Storage) para permitir pedir a verificação depois; não existe backend, nada sai do aparelho. */
  biometricRegistered() { return !!Storage.get('sec.webauthnCredId', null); },
  biometricStatus() {
    if (!this.biometricAvailable()) return 'Biometria indisponível neste navegador/dispositivo. Use o PIN.';
    return this.biometricRegistered() ? 'Biometria configurada — disponível na tela de PIN.' : 'WebAuthn disponível, ainda não configurado. Use o PIN ou configure a biometria.';
  },
  _b64urlToBuf(s) { const pad = s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4); const bin = atob(pad); const buf = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i); return buf.buffer; },
  _bufToB64url(buf) { const bytes = new Uint8Array(buf); let bin = ''; for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]); return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); },
  async registerBiometric() {
    if (!this.biometricAvailable()) throw new Error('WebAuthn não está disponível neste navegador.');
    if (window.PublicKeyCredential && PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable) {
      try { const ok = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); if (!ok) throw new Error('Nenhum autenticador biométrico de plataforma (digital/rosto) foi encontrado neste dispositivo.'); } catch (e) { if (e instanceof Error && e.message.includes('autenticador')) throw e; }
    }
    const userId = new Uint8Array(16); crypto.getRandomValues(userId);
    const challenge = new Uint8Array(32); crypto.getRandomValues(challenge);
    // O prompt nativo do navegador/SO abre exatamente aqui — é exigido pelo WebAuthn, não opcional.
    const cred = await navigator.credentials.create({
      publicKey: {
        challenge, rp: { name: 'LimeOS' },
        user: { id: userId, name: 'usuario-limeos', displayName: 'Usuário LimeOS' },
        pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
        authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' },
        timeout: 60000, attestation: 'none'
      }
    });
    if (!cred) throw new Error('Nenhuma credencial foi criada.');
    Storage.set('sec.webauthnCredId', this._bufToB64url(cred.rawId));
    return true;
  },
  async verifyBiometric() {
    const credId = Storage.get('sec.webauthnCredId', null);
    if (!credId) throw new Error('Biometria ainda não configurada.');
    const challenge = new Uint8Array(32); crypto.getRandomValues(challenge);
    // O prompt nativo do navegador/SO abre exatamente aqui também, por exigência do WebAuthn.
    const assertion = await navigator.credentials.get({
      publicKey: { challenge, allowCredentials: [{ id: this._b64urlToBuf(credId), type: 'public-key' }], userVerification: 'required', timeout: 60000 }
    });
    return !!assertion;
  },
  forgetBiometric() { Storage.del('sec.webauthnCredId'); }
};

/* ---------- Lock Screen ---------- */
const Lock = {
  timer: null, startY: null, active: false, locked: true,
  enter() {
    this.locked = true; App.closeAllInstant(); Panels.closeAll(true);
    Shell.show('screen-lock'); this.tick(); clearInterval(this.timer); this.timer = setInterval(() => this.tick(), 1000);
    $('lock-time').style.transform = ''; $('lock-content').style.opacity = ''; $('lock-clock').style.transform = ''; ClockLayout.applyLock();
  },
  tick() { const t = ClockRenderer.render($('lock-time'), $('lock-date')); $('sb-time').textContent = t; },
  bind() {
    const z = $('lock-zone');
    z.addEventListener('pointerdown', (e) => { this.startY = e.clientY; this.active = true; try { z.setPointerCapture(e.pointerId); } catch (_) {} $('lock-content').classList.add('dragging'); });
    z.addEventListener('pointermove', (e) => { // o relógio cresce DURANTE o arrasto
      if (!this.active) return; const dist = Math.max(0, this.startY - e.clientY); const p = Math.min(dist / 300, 1);
      $('lock-time').style.transform = `scale(${1 + p * 0.55})`; $('lock-clock').style.transform = `translate(-50%, calc(-50% - ${p * 40}px))`; $('lock-content').style.opacity = String(1 - p * 0.35);
    });
    const end = (e) => {
      if (!this.active) return; this.active = false; $('lock-content').classList.remove('dragging');
      const dist = this.startY - e.clientY;
      if (dist > 110) this.toPin();
      else { $('lock-time').style.transform = ''; $('lock-clock').style.transform = ''; $('lock-content').style.opacity = ''; }
    };
    z.addEventListener('pointerup', end); z.addEventListener('pointercancel', end);
  },
  toPin() { Pin.reset(); Shell.show('screen-pin'); $('lock-content').style.opacity = ''; Pin.refreshBioButton(); if (Auth.biometricRegistered()) Pin.tryBiometric(true); },
  unlocked() { this.locked = false; Shell.show('screen-home'); Home.render(); }
};

/* ---------- PIN (Material Design 3, animação por tecla) ---------- */
const Pin = {
  buf: '', busy: false, bioTrying: false,
  reset() { this.buf = ''; this.busy = false; this.dots(); },
  dots() { document.querySelectorAll('#pin-dots .pin-dot').forEach((d, i) => { d.classList.toggle('filled', i < this.buf.length); d.classList.remove('error'); }); },
  bind() {
    $('pin-pad').addEventListener('click', (e) => {
      const key = e.target.closest('.pin-key'); if (!key || !key.dataset.key || this.busy) return;
      const v = key.dataset.key;
      if (v === 'del') { this.buf = this.buf.slice(0, -1); this.dots(); return; }
      if (this.buf.length >= 4) return;
      key.classList.remove('pressed'); void key.offsetWidth; key.classList.add('pressed');
      this.fly(key, this.buf.length, v);
      this.buf += v;
      setTimeout(() => this.dots(), 200);
      if (this.buf.length === 4) this.check();
    });
    $('pin-bio').addEventListener('click', () => { if (Auth.biometricRegistered()) this.tryBiometric(false); });
  },
  /* 1.8.9 — Botão/estado de biometria na tela de PIN */
  refreshBioButton() {
    const btn = $('pin-bio');
    if (Auth.biometricRegistered()) { btn.textContent = '🔓 Usar biometria'; btn.classList.add('pin-bio-action'); }
    else { btn.textContent = Auth.biometricStatus(); btn.classList.remove('pin-bio-action'); }
  },
  /* auto=true: tentativa silenciosa ao entrar na tela (ainda assim abre o prompt nativo do SO,
     mas sem exigir toque extra do usuário); auto=false: toque explícito no botão. Falha/cancelamento
     do WebAuthn nunca trava a tela — o PIN continua disponível normalmente como fallback real. */
  async tryBiometric(auto) {
    if (this.bioTrying || this.busy) return;
    this.bioTrying = true;
    const btn = $('pin-bio'); const prevText = btn.textContent;
    if (!auto) btn.textContent = 'Aguardando biometria…';
    try {
      const ok = await Auth.verifyBiometric();
      if (ok) {
        this.busy = true;
        const c = $('pin-content'); const a = c.animate([{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(.92)', opacity: 0 }], { duration: 260, easing: 'ease-in', fill: 'forwards' });
        a.onfinish = () => { c.getAnimations().forEach(x => x.cancel()); Lock.unlocked(); };
        return;
      }
    } catch (e) {
      // Cancelamento/erro do WebAuthn (usuário recusou, timeout, etc.) — volta para o PIN sem drama.
      if (!auto) Core.toast('Biometria não confirmada. Use o PIN.');
    }
    this.bioTrying = false; if (btn.isConnected) btn.textContent = prevText;
  },
  fly(key, idx, label) { // o número vira o indicador, de forma fluida
    const dot = document.querySelectorAll('#pin-dots .pin-dot')[idx]; if (!dot) return;
    const a = key.getBoundingClientRect(), b = dot.getBoundingClientRect();
    const f = document.createElement('div'); f.className = 'pin-flyer'; f.style.left = (a.left + a.width / 2 - 7) + 'px'; f.style.top = (a.top + a.height / 2 - 7) + 'px';
    document.body.appendChild(f);
    const dx = (b.left + b.width / 2) - (a.left + a.width / 2), dy = (b.top + b.height / 2) - (a.top + a.height / 2);
    const anim = f.animate([{ transform: 'translate(0,0) scale(1.6)', opacity: 1 }, { transform: `translate(${dx}px,${dy}px) scale(1)`, opacity: .9 }], { duration: 220, easing: 'cubic-bezier(.34,1.56,.64,1)', fill: 'forwards' });
    anim.onfinish = () => f.remove();
    if (Capability.has('vibration') && State.v.vibrate) try { navigator.vibrate(8); } catch (e) {}
  },
  async check() {
    this.busy = true;
    const ok = await Auth.verifyPin(this.buf);
    setTimeout(() => {
      if (ok) { // animação de sucesso → Home
        const c = $('pin-content'); const a = c.animate([{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(.92)', opacity: 0 }], { duration: 260, easing: 'ease-in', fill: 'forwards' });
        a.onfinish = () => { c.getAnimations().forEach(x => x.cancel()); Lock.unlocked(); };
      } else {
        document.querySelectorAll('#pin-dots .pin-dot').forEach(d => d.classList.add('error'));
        $('pin-content').classList.add('shake');
        setTimeout(() => { $('pin-content').classList.remove('shake'); this.reset(); }, 450);
      }
    }, 240);
  }
};

  appstore: { name: 'App Store', glyph: '🛒', info: 'Instale e desinstale os apps opcionais do LimeOS' },
  calculator: { name: 'Lime Calculator', glyph: '🧮', info: 'Calculadora real, com precedência de operadores', store: true, since: '1.3' },
  notes:      { name: 'Lime Notes', glyph: '🗒️', info: 'Notas com anexos, salvas localmente', store: true, since: '1.3' },
  modules:    { name: 'Lime Modules', glyph: '🧩', info: 'Estrutura para módulos futuros (ainda sem módulos reais)', store: true, since: '1.3' },
  browser:    { name: 'Lime Browser', glyph: '🌐', info: 'Navegador baseado em iframe, com histórico próprio', store: true, since: '1.3' },
  lifeos:     { name: 'LifeOS', glyph: '🗓️', info: 'Seu sistema pessoal de produtividade, incorporado', store: true, since: '1.3' },
